name: Deploy Hawksnest

# Deploys the kustomize stack to the K3s cluster in Dragonfly.
#
# The cluster is behind NAT — GitHub cannot reach in (see DEPLOYMENT.md §9).
# This therefore runs on a SELF-HOSTED runner installed inside the Dragonfly
# WSL2 distro, which reaches the cluster locally over ~/.kube/config. GitHub
# only ever hands the runner a job; nothing is exposed to the internet.
#
# Triggers:
#   * workflow_dispatch — manual "Run workflow" button (optionally unpark zwave).
#   * push to main (manifests/script/workflow only) — auto-deploy on merge.
#
# Runner setup + how this honors the door-lock safety rules: DEPLOYMENT.md §10.

on:
  workflow_dispatch:
    inputs:
      overlay:
        description: "Which overlay to deploy"
        type: choice
        options: [prod, staging]
        default: prod
      unpark_zwave:
        description: "Run zwave-js-ui at replicas:1 (prod only; after the ZWA-2 by-id path is filled in)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "kustomize/**"
      - "ring-timeline/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"

# Never let two deploys touch the cluster at once; queue them instead.
concurrency:
  group: hawksnest-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply kustomize to K3s
    # Matches the labels you give the runner during registration (see §10).
    runs-on: [self-hosted, linux, dragonfly]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ring-timeline is the one workload here we build ourselves (everything else runs an
      # upstream image). No registry: build on this runner and import straight into k3s
      # containerd, the same way the Hawksnest web image ships. The Deployment pins
      # imagePullPolicy: IfNotPresent so k3s uses this instead of hunting docker.io.
      - name: Build ring-timeline image
        run: docker build -t ring-timeline:local ring-timeline

      - name: Import ring-timeline into K3s containerd
        run: docker save ring-timeline:local | sudo k3s ctr -n k8s.io images import -

      - name: Deploy
        env:
          # push events have no inputs → deploy prod. Staging is only ever reached
          # via the manual dispatch button, so an auto-deploy on merge always targets
          # the live prod overlay (unchanged behaviour).
          OVERLAY: ${{ github.event.inputs.overlay || 'prod' }}
          # push events have no inputs → false. deploy.sh treats false as
          # "park ONLY if the device path is still a REPLACE- placeholder"; once
          # the real by-id path is committed, zwave-js-ui keeps running, so an
          # auto-deploy never knocks the locks offline. The manual button's
          # unpark=true is just an escape hatch to force-run with a placeholder.
          UNPARK_ZWAVE: ${{ github.event.inputs.unpark_zwave || 'false' }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

      # The ring-timeline image tag is fixed, so `apply` alone can't see a code change —
      # restart it to pick up the image imported above. Only this one workload: every other
      # deployment here runs a pinned upstream image and must not be bounced (restarting
      # ring-mqtt or zwave-js-ui drops cameras/locks for minutes).
      - name: Roll ring-timeline to the new image
        env:
          OVERLAY: ${{ github.event.inputs.overlay || 'prod' }}
        run: |
          ns=home-automation
          [ "${OVERLAY}" = "staging" ] && ns=home-automation-staging
          sudo k3s kubectl -n "$ns" rollout restart deployment/ring-timeline
          sudo k3s kubectl -n "$ns" rollout status deployment/ring-timeline --timeout=120s
