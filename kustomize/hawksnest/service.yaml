# NodePort 30080 — mirrors HA's 30123 convention. The Windows portproxy maps
# 0.0.0.0:8080 -> wsl:30080 for LAN/Tailscale access; for purely-local testing,
# `kubectl -n home-automation port-forward svc/hawksnest 8080:80` works too.
apiVersion: v1
kind: Service
metadata:
  name: hawksnest
  labels:
    app: hawksnest
spec:
  type: NodePort
  selector:
    app: hawksnest
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
