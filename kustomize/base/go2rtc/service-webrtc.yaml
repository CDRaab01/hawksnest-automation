apiVersion: v1
kind: Service
metadata:
  name: go2rtc-webrtc
  labels:
    app: go2rtc
spec:
  # WebRTC media path (TCP). NodePort in base = prod's exposure: the distro-side
  # socat unit (windows/go2rtc-forwarder.service) listens on :8555 and forwards to
  # this NodePort, and go2rtc advertises GO2RTC_HOST_IP:8555 as its ICE candidate.
  # (A hostPort is NOT reachable from Windows under WSL mirrored networking — it's
  # DNAT with no listening socket; only a real socket like socat's is surfaced.)
  # NodePorts are cluster-unique, so the staging overlay patches this to ClusterIP
  # (mirrors home-assistant/ntfy) to avoid a 30855 collision on the shared cluster.
  type: NodePort
  selector:
    app: go2rtc
  ports:
    - name: webrtc-tcp
      port: 8555
      targetPort: webrtc-tcp
      protocol: TCP
      # Fixed NodePort so the socat forwarder target is stable.
      nodePort: 30855
    - name: webrtc-udp
      port: 8555
      targetPort: webrtc-udp
      protocol: UDP
      # The SAME nodePort number as the TCP entry above, which is legal and
      # intentional: a NodePort is unique per (protocol, port), not per port. Both
      # socat units therefore target 30855 and differ only in transport, which keeps
      # the two forwarders symmetrical and the docs honest.
      nodePort: 30855
