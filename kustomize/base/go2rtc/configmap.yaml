apiVersion: v1
kind: ConfigMap
metadata:
  name: go2rtc-seed
data:
  # Seed config for the dedicated go2rtc that provides TWO-WAY AUDIO ("talk") for
  # the Hawksnest app. Copied to the PVC at /config/go2rtc.yaml on first boot only
  # (see the seed-config initContainer) — go2rtc rewrites this file at runtime when
  # it rotates the Ring refresh token, and that rewrite must persist, so we never
  # clobber an existing one.
  #
  # Why a SEPARATE go2rtc (not ring-mqtt's): ring-mqtt's embedded go2rtc runs with
  # its API and WebRTC disabled and bridges Ring as a one-way RTSP `exec:` source,
  # so it cannot carry a back-channel. go2rtc's NATIVE `ring:` source does support
  # two-way audio (https://github.com/AlexxIT/go2rtc/tree/master/internal/ring).
  #
  # ${VARS} are substituted by go2rtc from the container environment (set via the
  # go2rtc-credentials Secret + the downward-API HOST IP). See secrets/go2rtc.env.example.
  go2rtc.yaml: |
    log:
      level: info

    api:
      # In-cluster only; the app reaches it through the Hawksnest nginx proxy at
      # /go2rtc/ (same origin, so Tailscale/LAN-scoped). go2rtc's API has no auth —
      # do NOT expose this port outside the cluster.
      listen: ":1984"

    rtsp:
      # Not needed here — HA already consumes ring-mqtt's RTSP for video. Disable.
      listen: ""

    webrtc:
      # TCP-only on 8555, published to the host via a hostPort so ICE can reach it
      # over Tailscale/LAN. TCP avoids UDP/NAT pain across Tailscale.
      listen: ":8555/tcp"
      candidates:
        # The Windows host's Tailscale (or LAN) IP — the address clients can reach.
        # Injected from the GO2RTC_HOST_IP env (secrets/go2rtc.env).
        - "${GO2RTC_HOST_IP}:8555"

    streams:
      # --- Reolink (local RTSP) -------------------------------------------------
      # The MAIN stream only. Frigate is NOT fed from here — it opens its own
      # connection to the camera's SUB stream. Two independent paths on purpose:
      # routing 24/7 recording through this pod would make a go2rtc restart a hole
      # in the timeline, and go2rtc's RTSP listener stays disabled (see `rtsp:`
      # above). main vs sub are different streams on the camera, so there is no
      # contention to avoid by sharing one connection.
      #
      # Live view therefore runs at full sensor resolution over WebRTC while
      # Frigate detects and records the cheap sub stream.
      #
      # This is the BIG ROOM (decided 2026-07-29). The first Reolink was originally
      # scoped for the bedroom; it now takes the `big_room` slug instead, so the Ring
      # big_room entry below is the one retired and the Ring `bedroom` entry stays
      # live until a second Reolink arrives for that room in a later phase.
      big_room: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BIG_ROOM}:554/h264Preview_01_main"

      # --- Ring (cloud) ---------------------------------------------------------
      # ONE entry per Ring camera you want to talk through. The stream NAME MUST
      # match the Home Assistant camera base (`camera.<base>`) so the Hawksnest app
      # can find it (e.g. HA `camera.front_door_live` -> base `front_door` -> here).
      #
      # Fill in each camera's Ring device_id (find it in go2rtc's web UI: Add > Ring,
      # or in ring-mqtt). The refresh_token is shared via env. Duplicate per camera.
      # Stream name = the HA camera base (verify against Developer Tools -> States;
      # rename if ring-mqtt slugged a name differently, e.g. first_floor_stairway).
      front_door: "ring:?device_id=${RING_DEVICE_ID_FRONT_DOOR}&refresh_token=${RING_REFRESH_TOKEN}"
      front_driveway: "ring:?device_id=${RING_DEVICE_ID_FRONT_DRIVEWAY}&refresh_token=${RING_REFRESH_TOKEN}"
      basement: "ring:?device_id=${RING_DEVICE_ID_BASEMENT}&refresh_token=${RING_REFRESH_TOKEN}"
      puzzle_room: "ring:?device_id=${RING_DEVICE_ID_PUZZLE_ROOM}&refresh_token=${RING_REFRESH_TOKEN}"
      back_yard_patio: "ring:?device_id=${RING_DEVICE_ID_BACK_YARD_PATIO}&refresh_token=${RING_REFRESH_TOKEN}"
      kitchen: "ring:?device_id=${RING_DEVICE_ID_KITCHEN}&refresh_token=${RING_REFRESH_TOKEN}"
      pet_camera: "ring:?device_id=${RING_DEVICE_ID_PET_CAMERA}&refresh_token=${RING_REFRESH_TOKEN}"
      back_side_yard: "ring:?device_id=${RING_DEVICE_ID_BACK_SIDE_YARD}&refresh_token=${RING_REFRESH_TOKEN}"
      first_floor_stairway: "ring:?device_id=${RING_DEVICE_ID_FIRST_FLOOR_STAIRWAY}&refresh_token=${RING_REFRESH_TOKEN}"
      bedroom: "ring:?device_id=${RING_DEVICE_ID_BEDROOM}&refresh_token=${RING_REFRESH_TOKEN}"
      # NOTE: no `big_room` entry here on purpose — the Reolink above claims that slug.
      # The Ring big_room camera is the one being retired. `RING_DEVICE_ID_BIG_ROOM` is
      # now the unused key in go2rtc.env (it was RING_DEVICE_ID_BEDROOM before the
      # 2026-07-29 retarget); leave it in place, it is harmless.
