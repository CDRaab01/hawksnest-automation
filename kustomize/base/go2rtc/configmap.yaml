apiVersion: v1
kind: ConfigMap
metadata:
  name: go2rtc-seed
data:
  # Seed config for the dedicated go2rtc that provides TWO-WAY AUDIO ("talk") for
  # the Hawksnest app. Copied to the PVC at /config/go2rtc.yaml on first boot only
  # (see the seed-config initContainer) — go2rtc rewrites this file at runtime when
  # it rotates the Ring refresh token, and that rewrite must persist, so we never
  # clobber an existing one.
  #
  # Why a SEPARATE go2rtc (not ring-mqtt's): ring-mqtt's embedded go2rtc runs with
  # its API and WebRTC disabled and bridges Ring as a one-way RTSP `exec:` source,
  # so it cannot carry a back-channel. go2rtc's NATIVE `ring:` source does support
  # two-way audio (https://github.com/AlexxIT/go2rtc/tree/master/internal/ring).
  #
  # ${VARS} are substituted by go2rtc from the container environment (set via the
  # go2rtc-credentials Secret + the downward-API HOST IP). See secrets/go2rtc.env.example.
  go2rtc.yaml: |
    log:
      level: info

    api:
      # In-cluster only; the app reaches it through the Hawksnest nginx proxy at
      # /go2rtc/ (same origin, so Tailscale/LAN-scoped). go2rtc's API has no auth —
      # do NOT expose this port outside the cluster.
      listen: ":1984"

    rtsp:
      # LOOPBACK ONLY, and it is NOT optional — every `ffmpeg:` source below depends
      # on it.
      #
      # This was `listen: ""` on the reasoning that nothing external consumes RTSP
      # here (HA takes ring-mqtt's stream for video), which is true and beside the
      # point. A go2rtc `ffmpeg:` source does not hand frames back in-process: it
      # runs ffmpeg as a child and **publishes the transcoded result back into
      # go2rtc over RTSP at 127.0.0.1:8554**. With no listener there is nowhere to
      # publish, so the audio producers added 2026-07-31 could never start — the
      # bare RTSP producer served video, WebRTC dropped the camera's AAC because it
      # cannot carry it, and every Reolink was silent. Diagnosed 2026-08-02:
      # `ffmpeg -f lavfi -i sine -c:a libopus -f rtsp rtsp://127.0.0.1:8554/x`
      # inside the pod returned "Connection refused".
      #
      # The note further down about the `ffmpeg:<stream>#...` shorthand needing this
      # listener for its INPUT was right, and stopped one step short: the OUTPUT
      # needs it too, for the full-URL form as well.
      #
      # 127.0.0.1 rather than :8554 keeps the exposure exactly where it was. The
      # pod's loopback is not reachable from other pods, the node, or the network —
      # only from ffmpeg children in this same container, which is the whole point.
      # Do not widen it to ":8554" without a reason; go2rtc's RTSP has no auth.
      listen: "127.0.0.1:8554"

    webrtc:
      # TCP **and** UDP on 8555, published to the host by the two socat forwarders
      # in windows/ so ICE can reach it over Tailscale/LAN.
      #
      # This was ":8555/tcp" until 2026-08-25, on the reasoning that "TCP avoids
      # UDP/NAT pain across Tailscale". That was a sound call when go2rtc served
      # only Ring cameras, whose streams are small. It stopped being the right
      # default once the Reolinks arrived (2026-07-29) at 2560x1440 / ~3.2 Mbps:
      # WebRTC over TCP cannot DROP a late frame, so a transient Wi-Fi hiccup
      # becomes a head-of-line stall and then a burst -- which is exactly what
      # "the live view is choppy" looks like. Over UDP the same hiccup costs a
      # frame and the stream adapts. Measured symptom: Reolink live was choppy on
      # both web and Android while the Ring cameras on the same path were fine,
      # and the source stream itself was verified clean (25 fps, 3.2 Mbps, no
      # timestamp gaps) straight off the camera AND through go2rtc.
      #
      # This is ADDITIVE, deliberately. go2rtc offers both transports as ICE
      # candidates, clients prefer UDP and fall back to TCP on their own. If the
      # UDP path is broken or blocked, behaviour is exactly what it was before
      # this change -- so the blast radius of the UDP half failing is "no
      # improvement", never "live view is down".
      #
      # SYNTAX IS LOAD-BEARING, verified against alexxit/go2rtc:1.9.14 rather than
      # assumed, because the failure is silent:
      #   ":8555/tcp"      -> TCP only          (what we had)
      #   ":8555"          -> TCP **and** UDP   (what we want)
      #   ":8555/udp"      -> UDP only
      #   ":8555/tcp+udp"  -> binds NOTHING, and logs no error
      # Confirm after any edit with the startup log, which prints one line per
      # transport: `[webrtc] listen tcp addr=...` and `[webrtc] listen udp addr=...`.
      listen: ":8555"
      candidates:
        # The Windows host's Tailscale (or LAN) IP — the address clients can reach.
        # Injected from the GO2RTC_HOST_IP env (secrets/go2rtc.env).
        - "${GO2RTC_HOST_IP}:8555"

    streams:
      # --- Reolink (local RTSP) -------------------------------------------------
      # The MAIN stream only. Frigate is NOT fed from here — it opens its own
      # connection to the camera's SUB stream. Two independent paths on purpose:
      # routing 24/7 recording through this pod would make a go2rtc restart a hole
      # in the timeline, and go2rtc's RTSP listener is loopback-only (see `rtsp:`
      # above), so nothing outside this pod could consume it anyway.
      # main vs sub are different streams on the camera, so there is no
      # contention to avoid by sharing one connection.
      #
      # Live view therefore runs at full sensor resolution over WebRTC while
      # Frigate detects and records the cheap sub stream.
      #
      # This is the BIG ROOM (decided 2026-07-29). The first Reolink was originally
      # scoped for the bedroom; it now takes the `big_room` slug instead, so the Ring
      # big_room entry below is the one retired and the Ring `bedroom` entry stays
      # live until a second Reolink arrives for that room in a later phase.
      #
      # RESOLVED 2026-07-29 — main stream is now **2560x1440 h264 @ 20fps, 4096 kbps**,
      # verified by ffprobe after the change, not just by the camera's own report.
      #
      # It shipped as 3840x2160 **h265**, which WebRTC largely cannot play (browser HEVC
      # support is absent-to-marginal, Chrome/Edge especially). The fix was at the CAMERA
      # — `SetEnc` to 2560x1440/h264 — NOT a go2rtc transcode, which would have meant
      # 4K HEVC transcoding on the same CPU as Frigate's detector.
      #
      # This is a DELIBERATE DOWNGRADE from the camera's native 4K (3840x2160), not the
      # camera's limit — 4K is H.265-only here. It costs live-view sharpness ONLY:
      # Frigate reads the SUB stream for both detect and record, so recordings,
      # detection and search are untouched by this number.
      #
      # Raising it back to 4K silently breaks live view again (4K forces h265). The
      # conditions under which that becomes worth revisiting are written up in
      # plan.md, "Going back to 4K later" — read it before changing this.
      #
      # The trap: `SetEnc` with 4K+h264 returns `code: 0, rspCode: 200` — a success —
      # and simply keeps h265. It does not error on an unsupported combination, so
      # ALWAYS re-read `GetEnc` (or ffprobe) after changing encode settings rather
      # than trusting the 200. The encoder also restarts (~20s of HTTP 502s).
      #
      # 2560x1440 is what this design assumed all along, so nothing downstream changes.
      # REOLINK_USER / REOLINK_PASS are shared across every Reolink on purpose
      # (decided 2026-07-29). Per-camera credentials were considered and rejected:
      # they all live in the same two container-mounted env files, so a leak exposes
      # every camera regardless, and the only scenario per-camera passwords help is
      # pivoting from an already-compromised camera to another — where the attacker
      # would gain a read-only stream they already had. Two variables instead of ten
      # at five cameras. Each camera still gets its own IP variable.
      # EVERY MAIN STREAM CARRIES A SECOND, AUDIO-ONLY PRODUCER. WHY:
      # Live view had NO SOUND AT ALL (reported 2026-07-31). The Reolinks emit
      # **AAC** (16 kHz mono; MPEG4-GENERIC/16000 in their SDP, confirmed by probing
      # the live producer). WebRTC cannot carry AAC — only Opus/PCMA/PCMU — and these
      # entries were bare RTSP URLs with no transcode directive, so there was nothing
      # to convert it and the audio track was simply never negotiated. Silence was the
      # correct outcome of the config, not a fault.
      #
      # The second source transcodes ONLY the audio to Opus. go2rtc starts sources
      # lazily and additively: RTSP/MSE/HLS consumers that can take AAC keep using the
      # bare producer above, and nothing runs at all while nobody is watching.
      #
      # THE FULL URL, NOT the `ffmpeg:big_room#...` shorthand. The shorthand feeds
      # ffmpeg from go2rtc's own internal RTSP endpoint, which would mean the camera's
      # stream making a second round trip through go2rtc for no gain. Going straight
      # to the camera keeps it to one hop.
      #
      # (This note used to say the shorthand would fail because the RTSP listener was
      # disabled. That was true, and it was also the bug: the listener is required for
      # the ffmpeg OUTPUT regardless of which input form is used. It is now
      # loopback-enabled — see the `rtsp:` block.)
      #
      # NO `#video=` ON PURPOSE. Adding `#video=copy` would make this producer offer
      # H264 as well, and a WebRTC consumer could then start BOTH producers — two RTSP
      # sessions to the same camera for one viewer. Audio-only keeps it to one extra.
      # That still costs a session per viewer, against the per-camera RTSP budget in
      # plan.md — watch it if several people view one camera at once.
      #
      # THE `_sub` STREAMS BELOW ARE DELIBERATELY LEFT ALONE. Low quality exists to cut
      # bandwidth on a weak link; giving it its own audio transcode would add a second
      # camera session to the exact case that is already struggling. Consequence to know:
      # **toggling Low drops audio.** Revisit if that proves annoying in practice.
      #
      # MEMORY: ffmpeg children share this pod's cgroup, and this is the SAME go2rtc
      # that serves Ring two-way talk — an OOMKill takes Ring talk down with it. The
      # limit was raised 256Mi -> 512Mi in the same commit for exactly this reason.
      big_room:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BIG_ROOM}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BIG_ROOM}:554/h264Preview_01_main#audio=opus"
      first_floor_stairway:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FIRST_FLOOR_STAIRWAY}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FIRST_FLOOR_STAIRWAY}:554/h264Preview_01_main#audio=opus"
      # `<name>_sub` = the same camera's SUB stream (640x360 / 896x512, ~256-1024
      # kbps), for the app's Low/High live-quality toggle (added 2026-07-30). The
      # main stream is fixed-bitrate with no adaptation, so a weak cellular link
      # stalls rather than degrades — Low keeps a live picture at ~1/20 the
      # bandwidth. go2rtc opens streams on demand: these cost nothing while nobody
      # selects Low, and one extra RTSP session to the camera while someone does
      # (an independent connection from Frigate's, which reads the same sub stream
      # — mind the per-camera RTSP session budget in plan.md).
      big_room_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BIG_ROOM}:554/h264Preview_01_sub"
      first_floor_stairway_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FIRST_FLOOR_STAIRWAY}:554/h264Preview_01_sub"
      # kitchen is an E1 **Pro** (E330), not an E1 Zoom like the two above. Its main
      # stream is 2880x1616 and already h264 — the 4K/H.265 default that had to be
      # fixed on both Zooms does not apply to the 4MP models. Nothing to do here, but
      # do not assume the Zoom settings transfer; they do not (see the Frigate seed,
      # where this camera's detect geometry is completely different).
      kitchen:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_KITCHEN}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_KITCHEN}:554/h264Preview_01_main#audio=opus"
      kitchen_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_KITCHEN}:554/h264Preview_01_sub"

      # Four more cameras, added 2026-07-31 — nursery, basement, bedroom, garage.
      # ALL FOUR ARE E1 PRO (E330), the same model as `kitchen` above, and every one
      # was ffprobed individually rather than assumed from the model name:
      #   sub   896x512  @10   main  2880x1616 @20   (all four, h264 both streams)
      # That matches kitchen exactly and differs from the two E1 Zooms (640x360 sub,
      # 2560x1440 main). Being 4MP models they need NO H.265 fix — the 4K/h265
      # SetEnc dance both Zooms required does not apply here.
      #
      # `basement` and `bedroom` REPLACE the Ring cameras that held those slugs (the
      # Ring entries are retired below, same swap as big_room/kitchen/stairway on
      # 2026-07-29). `nursery` and `garage` are new slugs — nothing had them.
      nursery:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY}:554/h264Preview_01_main#audio=opus"
      nursery_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY}:554/h264Preview_01_sub"
      # `nursery_high` is a SECOND camera in the nursery, added 2026-08-29 — it does not
      # replace `nursery`, and the two are independent streams on independent IPs.
      #
      # MIND THE RF HERE. `nursery` sits at -61 dBm and is the one camera measured to
      # COLLAPSE under channel contention (3272 -> 236 kbps; see the `record:` comment
      # in the Frigate seed, which is why main-stream recording is reverted). This entry
      # adds a second camera to that same weak corner of the house. Live view is
      # on-demand and the sub stream is ~213 kbps, so idle cost is nil — but if the
      # nursery cameras start skipping frames, this is the first thing to suspect, and
      # the fix is RF (an AP nearer that room), not config.
      # 4K H.264 (3840x2160 @20, ~4377 kbps measured). Main stream like every other
      # camera here — the sub-stream workaround below is GONE, and so is the reason
      # for it.
      #
      # HISTORY, because it cost a crash: this camera shipped 4K **H.265**, and going
      # live on it killed the Android app outright, 2026-08-29 22:20 EDT —
      #   Fatal signal 11 (SIGSEGV), fault addr 0x0
      #   #00 libjingle_peerconnection_so.so     <- WebRTC native lib
      # Handed HEVC, libwebrtc null-derefs rather than failing negotiation, so
      # "WebRTC cannot play HEVC" understates it: the process dies. Live view was
      # parked on the sub stream to make that unreachable.
      #
      # RESOLVED 2026-08-30 by re-encoding the CAMERA to 4K h264, which this model
      # supports — see the frigate seed's deviation block. No HEVC anywhere in the
      # fleet now, so nothing needs the workaround.
      nursery_high:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY_HIGH}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY_HIGH}:554/h264Preview_01_main#audio=opus"
      nursery_high_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY_HIGH}:554/h264Preview_01_sub"
      basement:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BASEMENT}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BASEMENT}:554/h264Preview_01_main#audio=opus"
      basement_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BASEMENT}:554/h264Preview_01_sub"
      bedroom:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BEDROOM}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BEDROOM}:554/h264Preview_01_main#audio=opus"
      bedroom_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BEDROOM}:554/h264Preview_01_sub"
      garage:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_GARAGE}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_GARAGE}:554/h264Preview_01_main#audio=opus"
      garage_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_GARAGE}:554/h264Preview_01_sub"

      # Reolink Video Doorbell WiFi (D340W), added 2026-08-30. NOT an E1 Pro/Zoom —
      # ffprobed individually (192.168.4.74): sub 640x480 @10, main 2560x1920 @20,
      # h264 both, AAC 16k mono on both. The sub is 4:3, unlike every other Reolink
      # here; see the Frigate seed for why that matters.
      #
      # TEMPORARY SLUG. The Ring doorbell still holds `front_door` (ring-mqtt, live)
      # and this runs alongside it until the handover, so the two never collide.
      # Renaming at handover means redoing this entry, the Frigate block and the HA
      # entities together.
      #
      # RTSP over UDP HANGS on this camera — a bare ffprobe never returns. go2rtc
      # negotiates its own transport so these plain URLs are fine, but any manual
      # ffprobe/ffmpeg against it needs `-rtsp_transport tcp`.
      front_door_reolink:
        - "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FRONT_DOOR_REOLINK}:554/h264Preview_01_main"
        - "ffmpeg:rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FRONT_DOOR_REOLINK}:554/h264Preview_01_main#audio=opus"
      front_door_reolink_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FRONT_DOOR_REOLINK}:554/h264Preview_01_sub"

      # --- Reolink Home Hub: battery cameras (Argus 4 Pro), added 2026-09-12 ------
      # These cameras have no RTSP of their own; the hub serves each bound camera as
      # a CHANNEL on the hub's IP — h264Preview_0N_{main,sub}, N is 1-BASED here (the
      # hub's CGI API and the FLV path count from 0). One IP, one credential pair, for
      # all of them. The pair is the hub's ADMIN login: the hub has no user table
      # (AddUser -> "not support", v3.3.0.456), so it is the one RTSP source that
      # carries admin rights. Kept as REOLINK_HUB_*, never the fleet REOLINK_USER/PASS.
      #
      # LIVE COMES FROM THE SUB STREAM, on purpose. ffprobed 2026-09-12: main is
      # 5120x1440 HEVC on both — and HEVC on WebRTC SIGSEGVs the Android app — while
      # sub is h264 1536x432 @25 + AAC 16k mono. If the app ever offers h264 on the
      # Clear stream, switch `<name>` to _main. No `<name>_sub` entry: with live already
      # on sub a Low toggle would be a no-op, and Hawksnest hides it when go2rtc doesn't
      # list it (fails closed). The audio producer stays: the hub carried three
      # concurrent sessions on one channel without complaint (Frigate's one plus these
      # two is exactly the budget).
      #
      # go2rtc opens a source only when a viewer asks, and the hub WAKES the camera
      # for it (7-15 s measured) and drops the session after 5 minutes. That is the
      # intended cost of watching live; nothing here holds a session open. Frigate
      # pulls these only on demand (see the HA automations) — it never holds them.
      backyard_patio:
        - "rtsp://${REOLINK_HUB_USER}:${REOLINK_HUB_PASS}@${REOLINK_IP_HOME_HUB}:554/h264Preview_01_sub"
        - "ffmpeg:rtsp://${REOLINK_HUB_USER}:${REOLINK_HUB_PASS}@${REOLINK_IP_HOME_HUB}:554/h264Preview_01_sub#audio=opus"
      front_yard:
        - "rtsp://${REOLINK_HUB_USER}:${REOLINK_HUB_PASS}@${REOLINK_IP_HOME_HUB}:554/h264Preview_02_sub"
        - "ffmpeg:rtsp://${REOLINK_HUB_USER}:${REOLINK_HUB_PASS}@${REOLINK_IP_HOME_HUB}:554/h264Preview_02_sub#audio=opus"

      # --- Ring (cloud) ---------------------------------------------------------
      # ONE entry per Ring camera you want to talk through. The stream NAME MUST
      # match the Home Assistant camera base (`camera.<base>`) so the Hawksnest app
      # can find it (e.g. HA `camera.front_door_live` -> base `front_door` -> here).
      #
      # Fill in each camera's Ring device_id (find it in go2rtc's web UI: Add > Ring,
      # or in ring-mqtt). The refresh_token is shared via env. Duplicate per camera.
      # Stream name = the HA camera base (verify against Developer Tools -> States;
      # rename if ring-mqtt slugged a name differently, e.g. first_floor_stairway).
      #
      # FOUR OF THESE READ WRONG AND ARE RIGHT, corrected 2026-08-05. The key is the HA
      # ENTITY BASE, not the camera's name — and on this account those two stopped
      # agreeing. ring-mqtt slugs an entity id once, at first discovery, and never
      # revisits it; the names in the Ring app were changed afterwards. So:
      #
      #   key         HA entity                      Ring app calls it
      #   front_door  camera.front_door_snapshot     Front Door
      #   front       camera.front_snapshot          Front Driveway
      #   back        camera.back_snapshot           Back Yard Patio
      #   back2       camera.back2_snapshot          Back Side Yard
      #   office      camera.office_snapshot         Puzzle Room
      #   pet_camera  camera.pet_camera_snapshot     Basement Storage Room
      #
      # Named by the friendly slug until now, which is why TALK WAS DEAD on those four:
      # both Hawksnest clients derive the go2rtc `src` from the entity id, so they asked
      # for a stream called `front` while this file called it `front_driveway`. It failed
      # silently — the button was there, the WebSocket opened, and the negotiation just
      # never completed. The RING_DEVICE_ID_* env names still carry the friendly names on
      # purpose: those identify the physical device, they live in a gitignored secret, and
      # nothing reads them but this file.
      #
      # If a camera's talk stops working, check its entity base FIRST (Developer Tools ->
      # States). Renaming in the Ring app will not move it; only a fresh ring-mqtt
      # discovery would, and that would break automations, so the entity id is the stable
      # side and this file follows it.
      front_door: "ring:?device_id=${RING_DEVICE_ID_FRONT_DOOR}&refresh_token=${RING_REFRESH_TOKEN}"
      front: "ring:?device_id=${RING_DEVICE_ID_FRONT_DRIVEWAY}&refresh_token=${RING_REFRESH_TOKEN}"
      # NOTE: no `basement` entry here — the Reolink above claims that slug
      # (2026-07-31). `RING_DEVICE_ID_BASEMENT` joins RING_DEVICE_ID_BIG_ROOM,
      # RING_DEVICE_ID_KITCHEN and RING_DEVICE_ID_FIRST_FLOOR_STAIRWAY as
      # unused-but-harmless keys in go2rtc.env; leave it in place.
      office: "ring:?device_id=${RING_DEVICE_ID_PUZZLE_ROOM}&refresh_token=${RING_REFRESH_TOKEN}"
      back: "ring:?device_id=${RING_DEVICE_ID_BACK_YARD_PATIO}&refresh_token=${RING_REFRESH_TOKEN}"
      # NOTE: no `kitchen` entry here — the Reolink above claims that slug
      # (2026-07-29). `RING_DEVICE_ID_KITCHEN` joins RING_DEVICE_ID_BIG_ROOM and
      # RING_DEVICE_ID_FIRST_FLOOR_STAIRWAY as unused-but-harmless keys in go2rtc.env.
      pet_camera: "ring:?device_id=${RING_DEVICE_ID_PET_CAMERA}&refresh_token=${RING_REFRESH_TOKEN}"
      back2: "ring:?device_id=${RING_DEVICE_ID_BACK_SIDE_YARD}&refresh_token=${RING_REFRESH_TOKEN}"
      # NOTE: no `first_floor_stairway` entry here — the Reolink above claims that
      # slug (2026-07-29, same swap as big_room). The Ring stairway camera is retired.
      # `RING_DEVICE_ID_FIRST_FLOOR_STAIRWAY` joins RING_DEVICE_ID_BIG_ROOM as an
      # unused-but-harmless key in go2rtc.env; leave both in place.
      # NOTE: no `bedroom` entry here — the Reolink above claims that slug
      # (2026-07-31). This is the slug the FIRST Reolink was originally scoped for
      # before it was retargeted to `big_room` on 2026-07-29; the room finally has
      # its own camera. `RING_DEVICE_ID_BEDROOM` is now unused-but-harmless in
      # go2rtc.env; leave it in place.
      # NOTE: no `big_room` entry here on purpose — the Reolink above claims that slug.
      # The Ring big_room camera is the one being retired. `RING_DEVICE_ID_BIG_ROOM` is
      # now the unused key in go2rtc.env (it was RING_DEVICE_ID_BEDROOM before the
      # 2026-07-29 retarget); leave it in place, it is harmless.
