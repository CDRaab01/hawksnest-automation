apiVersion: v1
kind: ConfigMap
metadata:
  name: go2rtc-seed
data:
  # Seed config for the dedicated go2rtc that provides TWO-WAY AUDIO ("talk") for
  # the Hawksnest app. Copied to the PVC at /config/go2rtc.yaml on first boot only
  # (see the seed-config initContainer) — go2rtc rewrites this file at runtime when
  # it rotates the Ring refresh token, and that rewrite must persist, so we never
  # clobber an existing one.
  #
  # Why a SEPARATE go2rtc (not ring-mqtt's): ring-mqtt's embedded go2rtc runs with
  # its API and WebRTC disabled and bridges Ring as a one-way RTSP `exec:` source,
  # so it cannot carry a back-channel. go2rtc's NATIVE `ring:` source does support
  # two-way audio (https://github.com/AlexxIT/go2rtc/tree/master/internal/ring).
  #
  # ${VARS} are substituted by go2rtc from the container environment (set via the
  # go2rtc-credentials Secret + the downward-API HOST IP). See secrets/go2rtc.env.example.
  go2rtc.yaml: |
    log:
      level: info

    api:
      # In-cluster only; the app reaches it through the Hawksnest nginx proxy at
      # /go2rtc/ (same origin, so Tailscale/LAN-scoped). go2rtc's API has no auth —
      # do NOT expose this port outside the cluster.
      listen: ":1984"

    rtsp:
      # Not needed here — HA already consumes ring-mqtt's RTSP for video. Disable.
      listen: ""

    webrtc:
      # TCP-only on 8555, published to the host via a hostPort so ICE can reach it
      # over Tailscale/LAN. TCP avoids UDP/NAT pain across Tailscale.
      listen: ":8555/tcp"
      candidates:
        # The Windows host's Tailscale (or LAN) IP — the address clients can reach.
        # Injected from the GO2RTC_HOST_IP env (secrets/go2rtc.env).
        - "${GO2RTC_HOST_IP}:8555"

    streams:
      # --- Reolink (local RTSP) -------------------------------------------------
      # The MAIN stream only. Frigate is NOT fed from here — it opens its own
      # connection to the camera's SUB stream. Two independent paths on purpose:
      # routing 24/7 recording through this pod would make a go2rtc restart a hole
      # in the timeline, and go2rtc's RTSP listener stays disabled (see `rtsp:`
      # above). main vs sub are different streams on the camera, so there is no
      # contention to avoid by sharing one connection.
      #
      # Live view therefore runs at full sensor resolution over WebRTC while
      # Frigate detects and records the cheap sub stream.
      #
      # This is the BIG ROOM (decided 2026-07-29). The first Reolink was originally
      # scoped for the bedroom; it now takes the `big_room` slug instead, so the Ring
      # big_room entry below is the one retired and the Ring `bedroom` entry stays
      # live until a second Reolink arrives for that room in a later phase.
      #
      # RESOLVED 2026-07-29 — main stream is now **2560x1440 h264 @ 20fps, 4096 kbps**,
      # verified by ffprobe after the change, not just by the camera's own report.
      #
      # It shipped as 3840x2160 **h265**, which WebRTC largely cannot play (browser HEVC
      # support is absent-to-marginal, Chrome/Edge especially). The fix was at the CAMERA
      # — `SetEnc` to 2560x1440/h264 — NOT a go2rtc transcode, which would have meant
      # 4K HEVC transcoding on the same CPU as Frigate's detector.
      #
      # This is a DELIBERATE DOWNGRADE from the camera's native 4K (3840x2160), not the
      # camera's limit — 4K is H.265-only here. It costs live-view sharpness ONLY:
      # Frigate reads the SUB stream for both detect and record, so recordings,
      # detection and search are untouched by this number.
      #
      # Raising it back to 4K silently breaks live view again (4K forces h265). The
      # conditions under which that becomes worth revisiting are written up in
      # plan.md, "Going back to 4K later" — read it before changing this.
      #
      # The trap: `SetEnc` with 4K+h264 returns `code: 0, rspCode: 200` — a success —
      # and simply keeps h265. It does not error on an unsupported combination, so
      # ALWAYS re-read `GetEnc` (or ffprobe) after changing encode settings rather
      # than trusting the 200. The encoder also restarts (~20s of HTTP 502s).
      #
      # 2560x1440 is what this design assumed all along, so nothing downstream changes.
      # REOLINK_USER / REOLINK_PASS are shared across every Reolink on purpose
      # (decided 2026-07-29). Per-camera credentials were considered and rejected:
      # they all live in the same two container-mounted env files, so a leak exposes
      # every camera regardless, and the only scenario per-camera passwords help is
      # pivoting from an already-compromised camera to another — where the attacker
      # would gain a read-only stream they already had. Two variables instead of ten
      # at five cameras. Each camera still gets its own IP variable.
      big_room: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BIG_ROOM}:554/h264Preview_01_main"
      first_floor_stairway: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FIRST_FLOOR_STAIRWAY}:554/h264Preview_01_main"
      # `<name>_sub` = the same camera's SUB stream (640x360 / 896x512, ~256-1024
      # kbps), for the app's Low/High live-quality toggle (added 2026-07-30). The
      # main stream is fixed-bitrate with no adaptation, so a weak cellular link
      # stalls rather than degrades — Low keeps a live picture at ~1/20 the
      # bandwidth. go2rtc opens streams on demand: these cost nothing while nobody
      # selects Low, and one extra RTSP session to the camera while someone does
      # (an independent connection from Frigate's, which reads the same sub stream
      # — mind the per-camera RTSP session budget in plan.md).
      big_room_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BIG_ROOM}:554/h264Preview_01_sub"
      first_floor_stairway_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_FIRST_FLOOR_STAIRWAY}:554/h264Preview_01_sub"
      # kitchen is an E1 **Pro** (E330), not an E1 Zoom like the two above. Its main
      # stream is 2880x1616 and already h264 — the 4K/H.265 default that had to be
      # fixed on both Zooms does not apply to the 4MP models. Nothing to do here, but
      # do not assume the Zoom settings transfer; they do not (see the Frigate seed,
      # where this camera's detect geometry is completely different).
      kitchen: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_KITCHEN}:554/h264Preview_01_main"
      kitchen_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_KITCHEN}:554/h264Preview_01_sub"

      # Four more cameras, added 2026-07-31 — nursery, basement, bedroom, garage.
      # ALL FOUR ARE E1 PRO (E330), the same model as `kitchen` above, and every one
      # was ffprobed individually rather than assumed from the model name:
      #   sub   896x512  @10   main  2880x1616 @20   (all four, h264 both streams)
      # That matches kitchen exactly and differs from the two E1 Zooms (640x360 sub,
      # 2560x1440 main). Being 4MP models they need NO H.265 fix — the 4K/h265
      # SetEnc dance both Zooms required does not apply here.
      #
      # `basement` and `bedroom` REPLACE the Ring cameras that held those slugs (the
      # Ring entries are retired below, same swap as big_room/kitchen/stairway on
      # 2026-07-29). `nursery` and `garage` are new slugs — nothing had them.
      nursery: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY}:554/h264Preview_01_main"
      nursery_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_NURSERY}:554/h264Preview_01_sub"
      basement: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BASEMENT}:554/h264Preview_01_main"
      basement_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BASEMENT}:554/h264Preview_01_sub"
      bedroom: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BEDROOM}:554/h264Preview_01_main"
      bedroom_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_BEDROOM}:554/h264Preview_01_sub"
      garage: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_GARAGE}:554/h264Preview_01_main"
      garage_sub: "rtsp://${REOLINK_USER}:${REOLINK_PASS}@${REOLINK_IP_GARAGE}:554/h264Preview_01_sub"

      # --- Ring (cloud) ---------------------------------------------------------
      # ONE entry per Ring camera you want to talk through. The stream NAME MUST
      # match the Home Assistant camera base (`camera.<base>`) so the Hawksnest app
      # can find it (e.g. HA `camera.front_door_live` -> base `front_door` -> here).
      #
      # Fill in each camera's Ring device_id (find it in go2rtc's web UI: Add > Ring,
      # or in ring-mqtt). The refresh_token is shared via env. Duplicate per camera.
      # Stream name = the HA camera base (verify against Developer Tools -> States;
      # rename if ring-mqtt slugged a name differently, e.g. first_floor_stairway).
      front_door: "ring:?device_id=${RING_DEVICE_ID_FRONT_DOOR}&refresh_token=${RING_REFRESH_TOKEN}"
      front_driveway: "ring:?device_id=${RING_DEVICE_ID_FRONT_DRIVEWAY}&refresh_token=${RING_REFRESH_TOKEN}"
      # NOTE: no `basement` entry here — the Reolink above claims that slug
      # (2026-07-31). `RING_DEVICE_ID_BASEMENT` joins RING_DEVICE_ID_BIG_ROOM,
      # RING_DEVICE_ID_KITCHEN and RING_DEVICE_ID_FIRST_FLOOR_STAIRWAY as
      # unused-but-harmless keys in go2rtc.env; leave it in place.
      puzzle_room: "ring:?device_id=${RING_DEVICE_ID_PUZZLE_ROOM}&refresh_token=${RING_REFRESH_TOKEN}"
      back_yard_patio: "ring:?device_id=${RING_DEVICE_ID_BACK_YARD_PATIO}&refresh_token=${RING_REFRESH_TOKEN}"
      # NOTE: no `kitchen` entry here — the Reolink above claims that slug
      # (2026-07-29). `RING_DEVICE_ID_KITCHEN` joins RING_DEVICE_ID_BIG_ROOM and
      # RING_DEVICE_ID_FIRST_FLOOR_STAIRWAY as unused-but-harmless keys in go2rtc.env.
      pet_camera: "ring:?device_id=${RING_DEVICE_ID_PET_CAMERA}&refresh_token=${RING_REFRESH_TOKEN}"
      back_side_yard: "ring:?device_id=${RING_DEVICE_ID_BACK_SIDE_YARD}&refresh_token=${RING_REFRESH_TOKEN}"
      # NOTE: no `first_floor_stairway` entry here — the Reolink above claims that
      # slug (2026-07-29, same swap as big_room). The Ring stairway camera is retired.
      # `RING_DEVICE_ID_FIRST_FLOOR_STAIRWAY` joins RING_DEVICE_ID_BIG_ROOM as an
      # unused-but-harmless key in go2rtc.env; leave both in place.
      # NOTE: no `bedroom` entry here — the Reolink above claims that slug
      # (2026-07-31). This is the slug the FIRST Reolink was originally scoped for
      # before it was retargeted to `big_room` on 2026-07-29; the room finally has
      # its own camera. `RING_DEVICE_ID_BEDROOM` is now unused-but-harmless in
      # go2rtc.env; leave it in place.
      # NOTE: no `big_room` entry here on purpose — the Reolink above claims that slug.
      # The Ring big_room camera is the one being retired. `RING_DEVICE_ID_BIG_ROOM` is
      # now the unused key in go2rtc.env (it was RING_DEVICE_ID_BEDROOM before the
      # 2026-07-29 retarget); leave it in place, it is harmless.
