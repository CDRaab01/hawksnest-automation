apiVersion: apps/v1
kind: Deployment
metadata:
  name: go2rtc
  labels:
    app: go2rtc
spec:
  # ENABLED in prod (was parked at 0 until 2026-07-13): go2rtc's native `ring:`
  # source is the low-latency live path + the two-way "talk" backchannel. Safe to
  # run before the real secret lands: deploy.sh falls back to the dummy example
  # secret, go2rtc still boots and serves /api/streams (probes pass — the ring
  # streams just error until real creds arrive), and go2rtc is deliberately NOT in
  # deploy.sh's rollout-wait list, so it can never fail a lock-cluster deploy.
  # Staging keeps it parked via the go2rtc-replicas-0 overlay patch.
  # Full enablement (secret + device ids + :8555 socat forwarder): DEPLOYMENT.md §7c.
  replicas: 1
  # Recreate: go2rtc-config is RWO and go2rtc owns a single Ring session (it rotates
  # the refresh token in its config file).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: go2rtc
  template:
    metadata:
      labels:
        app: go2rtc
    spec:
      initContainers:
        # Seed /config/go2rtc.yaml on first boot only. go2rtc rewrites this file when
        # it rotates the Ring refresh token, so we must NOT clobber an existing one.
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -f /config/go2rtc.yaml ]; then
                echo "seeding go2rtc.yaml"
                cp /seed/go2rtc.yaml /config/go2rtc.yaml
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
      containers:
        - name: go2rtc
          image: alexxit/go2rtc:latest
          # The image defaults to -config /config/go2rtc.yaml, which is our PVC.
          ports:
            - name: api
              containerPort: 1984
            - name: webrtc-tcp
              # WebRTC media (TCP). Exposed via the go2rtc-webrtc NodePort Service
              # (30855) + a socat forwarder in the distro (windows/go2rtc-forwarder
              # .service) — NOT a hostPort: under WSL mirrored networking a hostPort
              # is iptables DNAT with no listening socket, unreachable from Windows
              # (same reason the HA portproxy died — see windows/ha-forwarder.service).
              # The ICE candidate go2rtc advertises stays GO2RTC_HOST_IP:8555.
              containerPort: 8555
              protocol: TCP
          envFrom:
            - secretRef:
                name: go2rtc-credentials
          readinessProbe:
            httpGet:
              path: /api/streams
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/streams
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: go2rtc-config
        - name: seed
          configMap:
            name: go2rtc-seed
