apiVersion: apps/v1
kind: Deployment
metadata:
  name: go2rtc
  labels:
    app: go2rtc
spec:
  # ENABLED in prod (was parked at 0 until 2026-07-13): go2rtc's native `ring:`
  # source is the low-latency live path + the two-way "talk" backchannel. Safe to
  # run before the real secret lands: deploy.sh falls back to the dummy example
  # secret, go2rtc still boots and serves /api/streams (probes pass — the ring
  # streams just error until real creds arrive), and go2rtc is deliberately NOT in
  # deploy.sh's rollout-wait list, so it can never fail a lock-cluster deploy.
  # Staging keeps it parked via the go2rtc-replicas-0 overlay patch.
  # Full enablement (secret + device ids + :8555 socat forwarder): DEPLOYMENT.md §7c.
  replicas: 1
  # Recreate: go2rtc-config is RWO and go2rtc owns a single Ring session (it rotates
  # the refresh token in its config file).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: go2rtc
  template:
    metadata:
      labels:
        app: go2rtc
    spec:
      initContainers:
        # ALWAYS re-seed /config/go2rtc.yaml from the ConfigMap on every start.
        # Why not "first boot only": go2rtc takes ownership of this file at runtime
        # and drops ConfigMap stream changes made after first boot (and was observed
        # clearing the file entirely on this cluster), so the operator's stream list
        # never reached it. Overwriting on every start guarantees go2rtc loads all
        # streams into memory at boot — what it does to the file afterward no longer
        # matters. Trade-off: a rotated Ring refresh_token is NOT persisted across a
        # restart; go2rtc re-reads ${RING_REFRESH_TOKEN} from the secret each boot.
        # Fine for a fresh token — regenerate + update go2rtc.env if Ring invalidates
        # it. To change the stream list, edit the ConfigMap and restart the pod.
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              echo "re-seeding go2rtc.yaml from ConfigMap"
              cp /seed/go2rtc.yaml /config/go2rtc.yaml
              # Quick Reply audio. Re-copied every boot like the config above, so the
              # ConfigMap stays the source of truth — replacing a message means editing
              # replies-configmap.yaml and redeploying, not hand-copying a file onto a PVC.
              # Deliberately NOT first-boot-only: these have no runtime state to preserve.
              echo "re-seeding quick-reply audio"
              mkdir -p /config/replies
              cp /replies/*.wav /config/replies/
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
            - name: replies
              mountPath: /replies
      containers:
        - name: go2rtc
          # PINNED (2026-07-30, was :latest). Same rationale as the Frigate pin,
          # enforced by the same tests/validate_manifests.py check: config schema
          # and stream-source behavior move between releases, and an unpinned tag
          # upgrades silently on any pod recreate — on THIS deployment that also
          # re-seeds go2rtc.yaml, so a schema change would wedge every stream at
          # once. Bump deliberately.
          image: alexxit/go2rtc:1.9.14
          # The image defaults to -config /config/go2rtc.yaml, which is our PVC.
          #
          # THE MOUNT BELOW IS LOAD-BEARING: this container originally shipped with
          # NO volumeMounts, so the seed-config init wrote the streams config to the
          # PVC while go2rtc read /config from its own (empty) image filesystem —
          # every stream change silently no-opped and /api/streams stayed {}. The
          # init and main containers MUST share the `config` volume.
          volumeMounts:
            - name: config
              mountPath: /config
            # The Home Hub wake wrapper (hubwake.py, configMapGenerator in the base
            # kustomization). The hub cameras' streams are `exec:python3 /hubwake/hubwake.py`,
            # so without this mount `front` and `backyard_patio` cannot open at all.
            - name: hubwake
              mountPath: /hubwake
              readOnly: true
          ports:
            - name: api
              containerPort: 1984
            - name: webrtc-tcp
              # WebRTC media (TCP). Exposed via the go2rtc-webrtc NodePort Service
              # (30855) + a socat forwarder in the distro (windows/go2rtc-forwarder
              # .service) — NOT a hostPort: under WSL mirrored networking a hostPort
              # is iptables DNAT with no listening socket, unreachable from Windows
              # (same reason the HA portproxy died — see windows/ha-forwarder.service).
              # The ICE candidate go2rtc advertises stays GO2RTC_HOST_IP:8555.
              containerPort: 8555
              protocol: TCP
          # NOTE: there is deliberately NO UDP entry here, even though go2rtc listens
          # on 8555 for both transports. A container's ports list merges on
          # `containerPort`, so a second 8555 entry is silently dropped by
          # client-side `kubectl apply` (see service-webrtc.yaml for the full
          # story). It would buy nothing anyway -- these declarations are
          # informational and open no ports. The UDP path is wired by the Service's
          # numeric targetPort instead.
          envFrom:
            - secretRef:
                name: go2rtc-credentials
          readinessProbe:
            httpGet:
              path: /api/streams
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/streams
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # RAISED 256Mi -> 512Mi, 2026-07-31, in the same commit that gave every
              # Reolink main stream an audio-only `#audio=opus` ffmpeg producer (see the
              # configmap). Those ffmpeg children live in THIS pod's cgroup, one per
              # camera being watched, so concurrent viewers now consume memory that the
              # bare-RTSP passthrough never did.
              #
              # This is not a "give it room" guess — an OOMKill here is expensive. This
              # is the SAME go2rtc that serves Ring two-way talk, so the pod dying takes
              # the walkie-talkie with it, and with `strategy: Recreate` plus the config
              # re-seed on start, a Ring refresh-token rotation is lost on that restart.
              # AAC 16 kHz mono -> Opus is a cheap encode (well under 2% of a core, no
              # video work), so CPU is untouched; memory is the only real cost.
              memory: 512Mi
        # Holds every always-on camera's SUB stream open in go2rtc, so a phone that opens
        # a camera joins a stream that is already flowing instead of waiting for the camera.
        #
        # Measured 2026-10-14 (Kitchen): a Reolink takes ~2 s to answer ANY new RTSP viewer
        # (2.0-2.2 s first packet, 24 cold connects), which was most of Hawksnest's live-view
        # delay against the vendor app (it keeps a standing connection to every camera). A
        # viewer joining a go2rtc stream that is already open got its first packet in
        # 0.1-0.2 s; go2rtc keeps no cached keyframe, so the first DECODABLE frame then comes
        # at the camera's next keyframe — which is why the sub streams' I-frame interval is set
        # to 1x on the cameras (Reolink app; the `frigate` account is guest-level and cannot
        # change encoder settings). Both halves are needed: warm without 1x waits up to 4 s.
        #
        # Sub only, by design: ~0.1-0.25 Mbps each. Holding the 3-4 Mbps MAIN streams open
        # would put ~35 Mbps on the cameras' Wi-Fi around the clock. Capacity checked: Kitchen
        # served Frigate's sub + 2 more subs + 3 mains concurrently, all delivering video.
        # Frigate still reads the cameras directly, so recordings never depend on this pod.
        #
        # NEVER list a Home Hub camera (front, backyard_patio): any RTSP request wakes a
        # battery camera, so warming one would hold it awake until its battery died.
        # tests/validate_manifests.py enforces that against the go2rtc ConfigMap.
        - name: warm-sub
          # Same pinned image as go2rtc: it already ships ffmpeg, so this adds no pull.
          image: alexxit/go2rtc:1.9.14
          command: ["sh", "-c"]
          args:
            - |
              set -u
              # go2rtc's RTSP server listens on 127.0.0.1:8554; this container shares the
              # pod's network namespace. Stream copy into the null muxer: no decode, no disk.
              # `-loglevel fatal` because the sub streams log a harmless "Overread VUI"
              # line on connect. Reconnects forever: a camera reboot or a go2rtc restart
              # just ends the copy, and the next pass picks the stream back up.
              keep() {
                while true; do
                  # VIDEO ONLY, twice over (`?video` asks go2rtc for no audio track;
                  # -allowed_media_types stops ffmpeg SETUPing one): each `_sub` also
                  # lists an on-demand Opus transcode (configmap.yaml), and a consumer
                  # that took audio would keep nine ffmpegs running around the clock.
                  ffmpeg -nostdin -loglevel fatal -rtsp_transport tcp \
                    -allowed_media_types video \
                    -i "rtsp://127.0.0.1:8554/$1?video" -map 0:v:0 -c copy -f null - || true
                  echo "$(date -Iseconds) warm-sub: $1 ended; reconnecting in 5 s"
                  sleep 5
                done
              }
              for s in $WARM_STREAMS; do keep "$s" & done
              wait
          env:
            # go2rtc stream names (configmap.yaml). Add a new camera's `<name>_sub` here
            # (docs/adding-a-camera.md) — unless it sleeps on a Home Hub (see above).
            - name: WARM_STREAMS
              value: >-
                big_room_sub first_floor_stairway_sub kitchen_sub nursery_sub
                nursery_high_sub basement_sub bedroom_sub garage_sub
                front_door_reolink_sub
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              # Nine stream-copy ffmpeg processes, ~10-15 MB each.
              memory: 256Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: go2rtc-config
        - name: seed
          configMap:
            name: go2rtc-seed
        - name: replies
          configMap:
            name: go2rtc-replies
        - name: hubwake
          configMap:
            name: go2rtc-hubwake
