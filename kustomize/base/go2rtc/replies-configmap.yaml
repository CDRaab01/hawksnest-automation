apiVersion: v1
kind: ConfigMap
metadata:
  name: go2rtc-replies
# Prerecorded messages played out of a camera's speaker by Hawksnest's Quick Reply.
#
# HOW THEY ARE PLAYED: the app POSTs to go2rtc
#   /api/streams?dst=<camera>&src=ffmpeg:/config/replies/<file>#audio=pcmu
# which pushes the file into that camera's audio backchannel. No audio ever touches the phone,
# which is why this works identically from the web app and needs no microphone permission.
#
# WHY PCMU 8 kHz MONO: that is what the cameras advertise as their sendonly backchannel codec
# (`a=rtpmap:0 PCMU/8000` in their SDP). Anything else makes go2rtc transcode at best and fail at
# worst. Re-encode with:
#   ffmpeg -i in.wav -c:a pcm_mulaw -ar 8000 -ac 1 out.wav
#
# THESE ARE PLACEHOLDERS. They are Windows SAPI text-to-speech, committed so the feature works out
# of the box rather than shipping a button with nothing behind it. A recording of an actual
# household voice does this job considerably better — replace the files, keep the names, and
# nothing else has to change. Filenames are referenced by core/logic/QuickReply.kt in the
# Hawksnest repo; renaming one there without renaming it here is a reply that silently fails.
#
# binaryData rather than data: these are WAVs, and a ConfigMap's `data` is UTF-8 only.
binaryData:
  leave-at-door.wav: 
  be-right-there.wav: 
  cant-come.wav: 
