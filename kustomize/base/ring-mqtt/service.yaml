apiVersion: v1
kind: Service
metadata:
  name: ring-mqtt
  labels:
    app: ring-mqtt
spec:
  # ClusterIP is enough: HA consumes the camera stream in-cluster at
  # rtsp://ring-mqtt.home-automation.svc:8554/... and discovers devices over MQTT.
  # For the web UI / one-time Ring token generation, port-forward 55123:
  #   kubectl port-forward deploy/ring-mqtt 55123:55123 -n home-automation
  selector:
    app: ring-mqtt
  ports:
    - name: rtsp
      port: 8554
      targetPort: rtsp
    # NO webrtc ports. ring-mqtt's EMBEDDED go2rtc runs with its API and WebRTC
    # disabled -- it bridges Ring as a one-way RTSP `exec:` source and nothing else
    # (DEPLOYMENT.md 7c). Verified 2026-08-25 from inside the running pod: nothing
    # is listening on 8555 at all, so the `webrtc-tcp` / `webrtc-udp` entries that
    # used to sit here pointed at a port with no socket behind it.
    #
    # Removed for two reasons. First, it is precisely the decoy 7c warns about: a
    # declared port reads as "this works", and that illusion is what hid the missing
    # :8555 host forwarder for months. Second, the two entries shared port number
    # 8555, and `Service.spec.ports` merges on `port` -- a duplicate survives object
    # CREATION (which is why these were live) but gets silently collapsed on a later
    # client-side apply. tests/validate_manifests.py now rejects duplicates outright.
    #
    # Two-way audio and real WebRTC come from the DEDICATED go2rtc deployment, which
    # is a separate pod with its own Service, forwarders and firewall rules.
    - name: go2rtc-api
      port: 1984
      targetPort: go2rtc-api
    - name: web-ui
      port: 55123
      targetPort: web-ui
