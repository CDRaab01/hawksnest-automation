apiVersion: apps/v1
kind: Deployment
metadata:
  name: ring-mqtt
  labels:
    app: ring-mqtt
spec:
  replicas: 1
  # Recreate: ring-mqtt-data is RWO and ring-mqtt is a singleton (it owns the Ring
  # refresh token / session state).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ring-mqtt
  template:
    metadata:
      labels:
        app: ring-mqtt
      annotations:
        # Bump to force a clean ring-mqtt restart on apply. 2026-06-27: restart so it
        # reconnects to mosquitto with topic aliases disabled from the first connect
        # (an MQTT reconnect alone wouldn't re-run a startup that stalled on the
        # publish errors). The wait-for-mqtt initContainer ensures it starts after
        # mosquitto is back up.
        restart-revision: "2026-06-27-location-ids-mfa-only"
    spec:
      initContainers:
        # Don't start ring-mqtt until the broker is reachable, so first-boot logs
        # aren't full of MQTT connection retries. Mirrors HA's wait-for-mariadb.
        - name: wait-for-mqtt
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for mosquitto:1883 ..."
              until nc -w2 mosquitto 1883 </dev/null >/dev/null 2>&1; do
                sleep 2
              done
              echo "mosquitto is up"
        # Seeds /data/config.json on first boot only, injecting the broker URL with the
        # MQTT password (from the ring-mqtt-credentials Secret). ring-mqtt rewrites this
        # file at runtime, so we never clobber an existing one — user/runtime edits and
        # the generated ring-state.json (refresh token) survive restarts.
        #
        # The password is embedded in a URL, so it MUST be URL-safe (no '/', '@', ':',
        # '#'); '#' is the sed delimiter below. See secrets/ring-mqtt.env.example.
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -f /data/config.json ]; then
                echo "seeding config.json"
                url="mqtt://ring:${RING_MQTT_PASSWORD}@mosquitto.home-automation.svc.cluster.local:1883"
                sed "s#MQTT_URL_PLACEHOLDER#${url}#" /seed/config.json > /data/config.json
              fi
          envFrom:
            - secretRef:
                name: ring-mqtt-credentials
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
        # Pin discovery to the MFA Ring location (the live home: Ring Alarm + keypads +
        # sensors + 11 cameras). Without this, ring-mqtt also tries the old "fort wayne"
        # location whose Alarm Base Station is OFFLINE; ring-mqtt then HANGS device
        # discovery waiting for that hub to come ONLINE and never publishes anything or
        # binds its web UI on :55123 (pod never goes Ready). location_ids has no env-var
        # override and the seed only writes config.json on first boot, so we set it here
        # idempotently on every boot using the image's own node runtime (preserves all
        # other config; never blocks startup on error). Remove fort wayne from Ring to
        # retire it fully; add its id back here if it ever returns online.
        - name: set-location-ids
          image: tsightler/ring-mqtt:5.9.2
          command:
            - node
            - -e
            - |
              try {
                const fs = require('fs');
                const p = '/data/config.json';
                const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                c.location_ids = ['7c2f48e0-c7e9-4d46-84ad-15f8f80fe063'];
                fs.writeFileSync(p, JSON.stringify(c, null, 2));
                console.log('location_ids pinned to MFA (fort wayne excluded)');
              } catch (e) {
                console.error('set-location-ids: skipping -', e.message);
              }
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: ring-mqtt
          # Pinned (NOT :latest). v5.9.3 bumped bundled mqtt.js to 5.15.0, which throws
          # in _removeTopicAliasAndRecoverTopicName on every QoS1/2 publish that uses a
          # topic alias — breaking ALL ring-mqtt -> HA publishing (cameras, snapshots,
          # the Ring modes/alarm panel) and stalling startup so :55123 never binds.
          # 5.9.2 ships mqtt 5.14.1 (pre-regression). Pinning also stops :latest from
          # silently drifting into a broken build on the next pod recreate. Re-evaluate
          # when a newer ring-mqtt ships a fixed mqtt.js.
          image: tsightler/ring-mqtt:5.9.2
          ports:
            - name: rtsp
              containerPort: 8554
            # No webrtc entries -- see service.yaml. Nothing listens on 8555 in this
            # pod; its go2rtc has API/WebRTC disabled and bridges one-way RTSP only.
            - name: go2rtc-api
              containerPort: 1984
            - name: web-ui
              containerPort: 55123
          env:
            - name: TZ
              value: "America/New_York"   # adjust if needed
            # NOTE: ENABLEMODES (Ring Location Modes) intentionally NOT set. This account
            # has a real Ring Alarm (security-panel device "MFA Alarm" + keypads + sensors),
            # so ring-mqtt publishes a real alarm_control_panel automatically — that's the
            # panel Hawksnest arms/disarms. Location Modes is only for camera/doorbell-only
            # accounts with no Ring Alarm; enabling it here would add a redundant second
            # alarm panel and could mask the real one in the dashboard.
          envFrom:
            - secretRef:
                name: ring-mqtt-credentials
          volumeMounts:
            - name: data
              mountPath: /data
          # Readiness ONLY — deliberately no liveness probe (a liveness probe restarts
          # the pod mid-init and restarts the slow Ring setup from scratch — an
          # inescapable kill-loop: observed 8 restarts, cameras all dropped offline).
          # Probe rtsp (8554), NOT the web UI on 55123: in this deployment 55123 never
          # actually binds (the web UI isn't served — confirmed only 8554 + the MQTT
          # client port listen), so the old httpGet on web-ui left the pod stuck 0/1
          # forever even while ring-mqtt was fully working and publishing to MQTT.
          # rtsp:8554 comes up once go2rtc starts, so it's a real "serving" signal.
          # Generous thresholds for the slow Ring init.
          readinessProbe:
            tcpSocket:
              port: rtsp
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            # 512Mi OOMKilled this pod (exit 137) during startup — discovering the full
            # device set (Ring Alarm panel + 2 keypads + motion/contact sensors + 11
            # cameras + go2rtc) exceeds it, so the pod was killed before binding :55123
            # and never went Ready. 1Gi gives headroom for discovery + on-demand streams.
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ring-mqtt-data
        - name: seed
          configMap:
            name: ring-mqtt-seed
