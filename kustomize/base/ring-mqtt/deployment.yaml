apiVersion: apps/v1
kind: Deployment
metadata:
  name: ring-mqtt
  labels:
    app: ring-mqtt
spec:
  replicas: 1
  # Recreate: ring-mqtt-data is RWO and ring-mqtt is a singleton (it owns the Ring
  # refresh token / session state).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ring-mqtt
  template:
    metadata:
      labels:
        app: ring-mqtt
      annotations:
        # Bump to force a clean ring-mqtt restart on apply. 2026-06-27: restart so it
        # reconnects to mosquitto with topic aliases disabled from the first connect
        # (an MQTT reconnect alone wouldn't re-run a startup that stalled on the
        # publish errors). The wait-for-mqtt initContainer ensures it starts after
        # mosquitto is back up.
        restart-revision: "2026-06-27-topic-alias-fix"
    spec:
      initContainers:
        # Don't start ring-mqtt until the broker is reachable, so first-boot logs
        # aren't full of MQTT connection retries. Mirrors HA's wait-for-mariadb.
        - name: wait-for-mqtt
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for mosquitto:1883 ..."
              until nc -w2 mosquitto 1883 </dev/null >/dev/null 2>&1; do
                sleep 2
              done
              echo "mosquitto is up"
        # Seeds /data/config.json on first boot only, injecting the broker URL with the
        # MQTT password (from the ring-mqtt-credentials Secret). ring-mqtt rewrites this
        # file at runtime, so we never clobber an existing one — user/runtime edits and
        # the generated ring-state.json (refresh token) survive restarts.
        #
        # The password is embedded in a URL, so it MUST be URL-safe (no '/', '@', ':',
        # '#'); '#' is the sed delimiter below. See secrets/ring-mqtt.env.example.
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -f /data/config.json ]; then
                echo "seeding config.json"
                url="mqtt://ring:${RING_MQTT_PASSWORD}@mosquitto.home-automation.svc.cluster.local:1883"
                sed "s#MQTT_URL_PLACEHOLDER#${url}#" /seed/config.json > /data/config.json
              fi
          envFrom:
            - secretRef:
                name: ring-mqtt-credentials
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
      containers:
        - name: ring-mqtt
          # Pinned (NOT :latest). v5.9.3 bumped bundled mqtt.js to 5.15.0, which throws
          # in _removeTopicAliasAndRecoverTopicName on every QoS1/2 publish that uses a
          # topic alias — breaking ALL ring-mqtt -> HA publishing (cameras, snapshots,
          # the Ring modes/alarm panel) and stalling startup so :55123 never binds.
          # 5.9.2 ships mqtt 5.14.1 (pre-regression). Pinning also stops :latest from
          # silently drifting into a broken build on the next pod recreate. Re-evaluate
          # when a newer ring-mqtt ships a fixed mqtt.js.
          image: tsightler/ring-mqtt:5.9.2
          ports:
            - name: rtsp
              containerPort: 8554
            - name: webrtc-tcp
              containerPort: 8555
              protocol: TCP
            - name: webrtc-udp
              containerPort: 8555
              protocol: UDP
            - name: go2rtc-api
              containerPort: 1984
            - name: web-ui
              containerPort: 55123
          env:
            - name: TZ
              value: "America/New_York"   # adjust if needed
            # Publish the Ring Location Modes panel (Disarmed/Home/Away) so HA gets an
            # alarm_control_panel entity even on camera/doorbell-only accounts with no
            # Ring Alarm base station — this is the "ring alarm" Hawksnest's security
            # panel arms/disarms. Set as an env var (not just config.json) because
            # seed-config only writes config.json on FIRST boot; ring-mqtt env vars
            # override the already-seeded PVC config on every boot. Matches
            # configmap.yaml's enable_modes:true so fresh deploys agree.
            - name: ENABLEMODES
              value: "true"
          envFrom:
            - secretRef:
                name: ring-mqtt-credentials
          volumeMounts:
            - name: data
              mountPath: /data
          # Readiness ONLY — deliberately no liveness probe. ring-mqtt's web UI on
          # 55123 doesn't bind until it has connected to the Ring cloud API and set
          # up every camera (snapshot fetches can time out and retry for minutes with
          # many cameras). A liveness probe on 55123 therefore restarts the pod mid-init,
          # which restarts the slow Ring setup from scratch — an inescapable kill-loop
          # (observed: 8 restarts, "failed liveness probe, will be restarted", cameras
          # all dropped offline). Readiness alone gates the Service without force-killing,
          # so the pod gets an uninterrupted boot and comes up healthy. Generous
          # thresholds for the slow Ring init.
          readinessProbe:
            httpGet:
              path: /
              port: web-ui
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ring-mqtt-data
        - name: seed
          configMap:
            name: ring-mqtt-seed
