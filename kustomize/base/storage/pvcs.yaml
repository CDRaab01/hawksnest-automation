# PersistentVolumeClaims.
#
# ha-config, zwavejs-config and ring-mqtt-data bind to the NFS PVs above. ha-config and
# zwavejs-config MUST be backed up; ring-mqtt-data also MUST be backed up because it
# holds the Ring account refresh token (losing it means re-authenticating with 2FA).
# mosquitto-data also lives on NFS.
#
# mariadb-data deliberately uses K3s' node-local `local-path` StorageClass, NOT NFS:
# a database server's datadir over NFS reintroduces the same file-locking risk we are
# avoiding by moving off SQLite. Recorder history is regenerable and intentionally not
# stored on the NAS.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: ha-config
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zwavejs-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: zwavejs-config
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: mosquitto-data
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ring-mqtt-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: ring-mqtt-data
  resources:
    requests:
      storage: 1Gi
---
# go2rtc's writable config (seeded once from the go2rtc-seed ConfigMap). go2rtc
# rewrites it when it rotates the Ring refresh token, so it must persist. Uses the
# node-local local-path class (not NFS): the only critical state is the rotated
# token, and re-auth is a documented recovery step — not worth an NFS PV here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go2rtc-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
# ntfy's message cache (recent-push replay for reconnecting phones). Node-local
# local-path, not NFS: it's a regenerable cache — losing it drops at most a few
# hours of undelivered pushes, not worth an NFS PV. Local-path also means the
# staging overlay's "repoint every PVC to local-path" patch is a no-op here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
# ring-timeline's rotated Ring refresh token — a few hundred bytes, but it must survive a
# pod restart: Ring rotates the token on every use, so the seed in the Secret is stale
# after first boot and losing this file means re-authenticating with 2FA (a human step).
# Node-local local-path rather than NFS: the file is tiny, written rarely, and read at
# startup only, so NFS buys nothing here — but it DOES need a real backup story, so treat
# `npx -y -p ring-client-api ring-auth-cli` as the recovery path rather than a restore.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ring-timeline-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
