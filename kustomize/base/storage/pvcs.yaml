# PersistentVolumeClaims.
#
# ha-config, zwavejs-config and ring-mqtt-data bind to the NFS PVs above. ha-config and
# zwavejs-config MUST be backed up; ring-mqtt-data also MUST be backed up because it
# holds the Ring account refresh token (losing it means re-authenticating with 2FA).
# mosquitto-data also lives on NFS.
#
# mariadb-data deliberately uses K3s' node-local `local-path` StorageClass, NOT NFS:
# a database server's datadir over NFS reintroduces the same file-locking risk we are
# avoiding by moving off SQLite. Recorder history is regenerable and intentionally not
# stored on the NAS.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: ha-config
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zwavejs-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: zwavejs-config
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: mosquitto-data
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ring-mqtt-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: ring-mqtt-data
  resources:
    requests:
      storage: 1Gi
---
# go2rtc's writable config (seeded once from the go2rtc-seed ConfigMap). go2rtc
# rewrites it when it rotates the Ring refresh token, so it must persist. Uses the
# node-local local-path class (not NFS): the only critical state is the rotated
# token, and re-auth is a documented recovery step — not worth an NFS PV here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go2rtc-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
# ntfy's message cache (recent-push replay for reconnecting phones). Node-local
# local-path, not NFS: it's a regenerable cache — losing it drops at most a few
# hours of undelivered pushes, not worth an NFS PV. Local-path also means the
# staging overlay's "repoint every PVC to local-path" patch is a no-op here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
# ring-timeline's rotated Ring refresh token — a few hundred bytes, but it must survive a
# pod restart: Ring rotates the token on every use, so the seed in the Secret is stale
# after first boot and losing this file means re-authenticating with 2FA (a human step).
# Node-local local-path rather than NFS: the file is tiny, written rarely, and read at
# startup only, so NFS buys nothing here — but it DOES need a real backup story, so treat
# `npx -y -p ring-client-api ring-auth-cli` as the recovery path rather than a restore.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ring-timeline-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
# Frigate's config + SQLite event index (events, GenAI descriptions, and the CLIP
# embeddings behind semantic search). local-path, NEVER NFS — the same file-locking
# argument that keeps mariadb-data off the Synology applies to any SQLite datadir,
# and this one is written on every detection.
#
# NOT covered by the NFS backup story that protects ha-config and zwavejs-config.
# Losing it loses all search history: the recordings survive but nothing is
# findable, and re-embedding costs real CPU. Back it up separately (README §Backups).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# SUPERSEDED 2026-08-04 by frigate-media-nas below. Frigate no longer mounts this.
#
# Kept defined, and deliberately NOT deleted, as the rollback for the NAS migration:
# it still holds the 41 GB of recordings and 30 days of alert clips that were copied
# to the DS925+. local-path's reclaim policy is **Delete**, so deleting this PVC
# destroys that data — do not remove it until the NAS side has proven itself over a
# few days AND Storage Pool 3 has been repaired (it is running degraded on a single
# drive until the DOA 10 TB replacement arrives).
#
# `deploy.sh` runs `kubectl apply -k` with no --prune, so removing this block would
# orphan rather than delete the PVC — but leaving it here keeps the rollback explicit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 200Gi
---
# Frigate's recordings and snapshots — on the DS925+ since 2026-08-04.
#
# This replaced a node-local PVC that had no quota enforcement and would eventually
# have filled the Dragonfly virtual disk, taking k3s, Home Assistant and the door
# locks with it. That failure mode is now gone: the volume is a dedicated 3 TB ext4
# volume on the NAS, so Frigate can only ever fill its own storage.
#
# `record.continuous.days` in the frigate-seed ConfigMap is still the retention
# control, but it is no longer load-bearing for cluster survival — which is what
# made it safe to raise it off the deliberately-low value of 3.
#
# Binds by volumeName to the static PV; nfs-manual disables dynamic provisioning.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media-nas
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-manual
  volumeName: frigate-media-nas
  resources:
    requests:
      storage: 2900Gi
