apiVersion: apps/v1
kind: Deployment
metadata:
  name: everyday
  labels:
    app: everyday
spec:
  replicas: 1
  # Recreate: singleton scheduler (two replicas would each run the nightly scan) on an
  # RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: everyday
  template:
    metadata:
      labels:
        app: everyday
    spec:
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown 1000:1000 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: everyday
          # Built + imported by deploy.yml; no registry, so IfNotPresent is required.
          image: everyday:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: "America/Indiana/Indianapolis"
            - name: FRIGATE_URL
              value: "http://frigate:5000"
            # The SAME LM Studio endpoint Frigate's GenAI uses, from Frigate's own secret.
            # optional: true -> unset means heuristics only. server.py also refuses any
            # public endpoint: these are interior-camera frames, they never leave the house.
            - name: GENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: frigate-credentials
                  key: OPENAI_BASE_URL
                  optional: true
            - name: GENAI_MODEL
              value: "google/gemma-4-e4b"
            # Tuning knobs (defaults shown in everyday/README.md).
            - name: EXCLUDE_CAMERAS
              value: "bedroom"
            - name: CAMERA_WEIGHTS
              value: "garage=0.4,front=0.6"
            - name: CLIP_SECONDS
              value: "2.5"
            # crop = fill 16:9 around the subject (panoramas lose their sides); pad = letterbox.
            - name: FRAMING
              value: "crop"
            # The daily anchor: same camera + window every day -> the time-lapse thread.
            - name: ANCHOR_CAMERA
              value: "big_room"
            - name: ANCHOR_WINDOW
              value: "17:00-19:30"
            - name: PROVISIONAL_AT
              value: "21:00"
            - name: FINAL_AT
              value: "00:20"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              # ffmpeg decodes a 4K nursery_high recording per candidate, and the edited reel
              # renders EDIT_CHUNK (10) 1080p clips in one graph: measured ~820 MB at 16.
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: everyday-media
