apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwave-js-ui
  labels:
    app: zwave-js-ui
spec:
  replicas: 1
  # Recreate: only one pod may own the serial device, and the store PVC is RWO.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zwave-js-ui
  template:
    metadata:
      labels:
        app: zwave-js-ui
    spec:
      containers:
        - name: zwave-js-ui
          # Pinned, not :latest. This pod owns the radio for three deadbolts and the
          # ZEN32 scene controllers; a floating tag means any pod recreate can roll
          # the Z-Wave stack forward unattended, on the one workload where a bad
          # upgrade is a locked-out house rather than a broken page. Bump
          # deliberately, after reading the release notes. (Same reasoning the
          # frigate manifest spells out for its own tag.)
          image: zwavejs/zwave-js-ui:11.22.0
          ports:
            - name: ws
              containerPort: 3000   # Z-Wave JS websocket — HA connects here
            - name: ui
              containerPort: 8091   # Control panel UI
          # Readiness only, matching frigate and ring-mqtt: the driver takes a while
          # to come up and interview the mesh, and a liveness probe on a slow start
          # turns into an inescapable kill-loop (ring-mqtt did exactly that once —
          # see PROGRESS.md). Readiness is still worth having, because without it a
          # wedged daemon keeps its Service endpoint and HA goes on believing the
          # websocket is fine. This pod previously had no probes at all, which was an
          # omission rather than the deliberate choice its neighbours made.
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            # The ZWA-2 is a raw serial device; privileged is the simplest reliable
            # way to give the container access to it inside K3s-in-WSL2. A narrower
            # device cgroup rule is possible but more fragile across replug — we
            # deliberately choose privileged and document it.
            privileged: true
          env:
            - name: TZ
              value: "America/New_York"   # adjust if needed
          volumeMounts:
            - name: store
              mountPath: /usr/src/app/store
            - name: zwave-device
              # Point Z-Wave JS UI's serial port setting at this path: /dev/zwave
              mountPath: /dev/zwave
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: zwavejs-config
        - name: zwave-device
          hostPath:
            # Stable by-id path of the ZWA-2 inside WSL2 (Dragonfly), confirmed via
            # `ls -l /dev/serial/by-id/` -> resolves to ../../ttyACM0.
            # `type` is intentionally left unset so kubelet does not reject the
            # by-id symlink. If the pod fails to see the device, substitute the
            # resolved node (e.g. /dev/ttyACM0) here — but prefer by-id (stable).
            path: /dev/serial/by-id/usb-Nabu_Casa_ZWA-2_9070690E14E4-if00
