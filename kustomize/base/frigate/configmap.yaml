apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-seed
data:
  # Seed config for Frigate — the NVR + object detection behind Hawksnest's
  # recorded timeline and AI event search. Copied to the PVC at /config/config.yml
  # on FIRST BOOT ONLY (see the seed-config initContainer): Frigate's own UI writes
  # this file when you draw motion masks and zones, and that must not be clobbered
  # on every restart. (Contrast go2rtc, which re-seeds every boot because it drops
  # ConfigMap stream changes.) To change something here after first boot you must
  # edit the live file too — same dual-write ritual as HA's configuration.yaml.
  #
  # SCHEMA IS VERSION-SPECIFIC AND WAS VERIFIED AGAINST 0.17.2. Notably `record`
  # has NO top-level `retain:` block in 0.17 (it was `record.retain.days` through
  # 0.16) — it is now continuous/motion/alerts/detections. Re-verify against the
  # release notes before bumping the pinned image in deployment.yaml.
  #
  # ${VARS} are NOT used here — Frigate does its own substitution and requires the
  # FRIGATE_ prefix on any env var referenced as {FRIGATE_FOO}.
  config.yml: |
    mqtt:
      host: mosquitto.home-automation.svc.cluster.local
      port: 1883
      user: frigate
      password: "{FRIGATE_MQTT_PASSWORD}"
      # Frigate's MQTT user is SEPARATE from ring-mqtt's `ring` user in the same
      # mosquitto passwd file. That file must only ever be APPENDED to — rewriting
      # it drops `ring` and takes every Ring camera offline at once.

    detectors:
      ov:
        type: openvino
        # CPU is the committed default and is genuinely adequate for one camera at
        # 640x360/5fps. Flip to GPU only after the /dev/dri probe in README §Frigate
        # actually finds a render node: WSL2 exposes /dev/dxg rather than a normal
        # DRI render node, and there is no GPU precedent anywhere in this cluster,
        # so GPU here is unproven rather than merely unconfigured. Flipping it also
        # means uncommenting the device mounts in deployment.yaml.
        device: CPU

    # OpenVINO does not auto-select a model — the path, geometry and labelmap are
    # all required. These files ship inside the image.
    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt

    birdseye:
      # OFF deliberately. The HA integration surfaces birdseye as a standalone
      # `camera.birdseye` entity, which Hawksnest's resolveCameras() would treat as
      # a real camera and render as an unscrubbable tile on the camera wall.
      enabled: false

    # Global ffmpeg args. SCOPE: OUTPUT args only — this block deliberately sets no
    # `input_args`, and every camera below carries a comment on why the 0.17 RTSP
    # input preset is left alone. Keep that true.
    ffmpeg:
      output_args:
        # COPY THE CAMERA'S AAC, DO NOT RE-ENCODE IT.
        # Added 2026-07-31 after "chopped and muffled" audio on recorded playback.
        #
        # Frigate's DEFAULT record preset is `preset-record-generic-audio-aac`
        # (= `-c:v copy -c:a aac`, no -b:a). Verified against the RUNNING ffmpeg
        # cmdline in the pod, not assumed. That default exists because many cameras
        # emit G.711/PCM, which is not legal in an MP4 container. These are not
        # those cameras — every one already emits AAC, the exact codec we want.
        #
        # MEASURED 2026-07-31, all seven sub streams, `-c copy` into mp4:
        #   E1 Zoom  big_room / first_floor_stairway   aac 16 kHz mono ~31 kbps
        #   E1 Pro   kitchen/nursery/basement/bedroom/garage
        #                                              aac 16 kHz mono ~64 kbps
        # Recorded output was 32,411 bps for ALL of them. So the five E1 Pros were
        # having their bitrate halved, and all seven were paying a second generation
        # of lossy coding through ffmpeg's weakest AAC encoder, for nothing. `-c copy`
        # is strictly better here: better audio, less CPU, same container.
        #
        # THE PRECONDITION, AND IT IS LOAD-BEARING: every camera must emit MP4-legal
        # audio. All seven were individually test-muxed with `-c copy` before this
        # went in — not inferred from the model name. (The `PCMU/8000` line in their
        # SDP is the two-way-talk backchannel and is sendonly; ffmpeg picks the AAC
        # track.) If a future camera ships non-AAC audio, or has its mic disabled so
        # only the PCMU line survives, the mp4 muxer refuses and ffmpeg EXITS — and
        # since Frigate runs ONE ffmpeg per camera with TWO outputs, that takes
        # DETECTION down along with recording. The escape hatch is per-camera, not a
        # global revert:
        #     ffmpeg:
        #       output_args:
        #         record: preset-record-generic-audio-aac
        # under the offending camera. docs/adding-a-camera.md now probes audio too.
        #
        # DISK: +~32 kbps on the five E1 Pros only, ~1.7 GB/day added. Immaterial
        # against the ~16.7 GB/day baseline below.
        #
        # ---------------------------------------------------------------------------
        # SEGMENT LENGTH 60s, AND WHY THESE ARGS ARE SPELLED OUT INSTEAD OF A PRESET
        #
        # These args ARE `preset-record-generic-audio-copy` verbatim, with one change:
        # `-segment_time 10` -> `-segment_time 60`. Frigate bundles the chunk length
        # into the same preset as the codec choice, so there is no way to keep the
        # preset and change only the length.
        #
        # THE SECOND HALF OF THE "chopped and muffled" REPORT. `-c copy` above fixed
        # the muffling; it did NOT fix the chopping, and the chopping is not a codec
        # problem at all. The segment muxer cuts on a VIDEO keyframe, but AAC audio is
        # packed in indivisible 64 ms frames (1024 samples @ 16 kHz) that do not line
        # up with that cut. The frame straddling the boundary is DROPPED rather than
        # split, so every segment starts its audio late and ends it early. MEASURED
        # 2026-07-31 on garage, three consecutive segments:
        #       video 12.015s / audio 11.838s  -> 177 ms of sound missing
        #       video 12.340s / audio 12.179s  -> 161 ms
        #       video  8.010s / audio  7.842s  -> 168 ms
        # Concatenating six segments showed inter-packet gaps of 336/272/216 ms at the
        # joins. The app plays recordings as nginx-vod-module HLS, which stitches these
        # chunks end to end, so the user hears a ~150 ms dropout every ~10 seconds.
        #
        # RULED OUT FIRST, so nobody re-litigates it: the input timestamp flags are NOT
        # the cause. All four combinations of `-use_wallclock_as_timestamps` and
        # `+genpts` were tested against the live camera and produced identical results.
        # It is purely the keyframe-vs-audio-frame grid mismatch.
        #
        # 60s DOES NOT ELIMINATE THE GAP — it makes it 6x rarer (one dropout a minute
        # instead of six). The hole is the same size; there are simply fewer seams.
        # Owner accepted that trade 2026-07-31 over leaving it alone.
        #
        # WHAT IT COSTS:
        #  - Coarser seeking and coarser retention granularity (60s is the smallest
        #    unit Frigate can keep or delete).
        #  - This block is now PINNED. It will not pick up upstream changes to the
        #    segmenter on a Frigate upgrade the way the preset would. **On any version
        #    bump, re-read `PRESETS_RECORD_OUTPUT` and re-sync everything here except
        #    the segment_time.**
        #  - 6x more data in flight in /tmp/cache, which is a 1 GB **tmpfs** and
        #    therefore counts against this container's memory cgroup. Measured 32 MB at
        #    10s across seven cameras, so expect ~190 MB. Frigate was already sitting at
        #    3718 MiB of a 4 GiB limit (stable, not leaking), which left no room — the
        #    deployment's memory limit was raised 4Gi -> 5Gi in the same commit. Do not
        #    separate those two changes.
        record: -f segment -segment_time 60 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c copy

    record:
      enabled: true
      # 24/7 continuous. SEVEN of the eight cameras record from the SUB stream
      # (roles [detect, record] on one input). This is what actually runs, and this
      # comment says so on purpose.
      #
      # ONE EXCEPTION AS OF 2026-08-30: `nursery_high` records from its MAIN stream
      # (4K H.265, ~4370 kbps measured, ~47 GB/day). That is a deliberate, isolated
      # deviation, not the start of rolling #64 back out to the fleet — the full
      # case, the measured baseline and the revert instructions live on that camera's
      # block below. The fleet-wide version stays reverted for the reasons under
      # point 2 here, and those reasons are about SEVEN main streams, not one.
      #
      # REVERTED 2026-08-26. #64 moved `record` to its own main-stream input to fix
      # visibly choppy recorded playback. That change was correct about the problem
      # and is reverted for two independent reasons, both found by measurement:
      #
      # 1. IT NEVER TOOK EFFECT, AND COULD NOT. Frigate's seed initContainer copies
      #    /seed/config.yml to the PVC ONLY IF /config/config.yml is absent (see
      #    deployment.yaml) -- deliberately, so Frigate's own UI edits survive. The
      #    PVC has had a config since first boot, so from 2026-08-24 to 2026-08-26
      #    this file claimed main-stream recording while every camera actually
      #    recorded from sub. A merged, applied, green-deployed change that does
      #    nothing. Editing THIS FILE alone can never change a running Frigate;
      #    the live file on the PVC has to be edited too.
      #
      # 2. IT WOULD HAVE BROKEN THE NURSERY. Seven simultaneous main streams take the
      #    wireless fleet from ~1.4 Mbps to ~24 Mbps, and the nursery cannot hold a
      #    main stream in that contention. Measured 2026-08-26, repeated 4x across
      #    two pods (512Mi and 7Gi, so not a pod-resource artifact):
      #
      #      camera                signal   main alone   under 6 others
      #      bedroom               -35 dBm   4315 kbps    4251 kbps   ok
      #      garage                -40 dBm   4363 kbps    4276 kbps   ok
      #      big_room              -60 dBm    937 kbps     941 kbps   ok
      #      first_floor_stairway    --       734 kbps     789 kbps   ok
      #      nursery               -61 dBm   3272 kbps     236 kbps   COLLAPSES
      #
      #    Its detect stream also began skipping (skipped_fps 0.0 -> 1.7) and, while
      #    six others streamed main and the nursery streamed NOTHING, it still saw
      #    40% packet loss and 229 ms RTT where garage saw 0% and 40 ms.
      #
      # THE CAUSE IS SIGNAL x DEMAND, NOT SIGNAL. big_room sits at -60 dBm, one dB
      # off the nursery, and is completely unaffected -- because it only asks for
      # 937 kbps. The nursery asks 3.5x that on an equally weak link. A weak link is
      # fine until you ask it for real throughput, which is exactly why the nursery
      # has never missed a detection: today it carries one ~213 kbps sub stream on a
      # near-idle channel. Do not read "it works fine" as "it has headroom".
      #
      # WHAT WOULD UNBLOCK MAIN-STREAM RECORDING, best first:
      #   1. Fix the nursery's RF (an AP/mesh node nearer that room). At -35/-40 like
      #      the others it would carry 3.3 Mbps under contention and all seven could
      #      record from main. Costs nothing in quality.
      #   2. Lower the nursery's main bitrate to ~1 Mbps on the camera, which big_room
      #      proves a -60 dBm link sustains. Trades that camera's LIVE quality.
      #   3. Six on main with the nursery on sub -- REJECTED. Six cameras recording
      #      main 24/7 makes the channel permanently busy, which is the exact
      #      condition that costs the nursery 40% of its packets. It would protect
      #      the nursery's recording by degrading its live view, permanently.
      #
      # Sub-stream budget, MEASURED, and the cameras are not interchangeable:
      #   big_room             (E1 Zoom)  256 kbps  ~2.8 GB/day
      #   first_floor_stairway (E1 Zoom)  256 kbps  ~2.8 GB/day
      #   kitchen              (E1 Pro)  1024 kbps ~11.1 GB/day   <-- 4x the others
      # ~16.7 GB/day total; 3 days is ~50 GB against ~900 GB free. Verify with
      # `df -h /media/frigate` after 24h rather than trusting this arithmetic.
      #
      # If it needs trimming, the levers in order of bang-per-edit:
      # `detections.retain.mode: motion` (stops holding dead air around events),
      # then `detections.retain.days`, then `continuous.days`. Lowering a camera's
      # main-stream bitrate on the Reolink itself is the LAST resort — it gives
      # back exactly the quality this change was made to get.
      #
      # Retention is per-camera if it needs to be: a camera wanting a SHORTER
      # window carries its own block rather than dragging this global down.
      #
      # HISTORY — 2026-08-04, the DS925+ migration. Recordings live on
      # `frigate-media-nas` (NFS -> DS925+ Volume 4, a dedicated 3 TB ext4 volume),
      # NOT the unquotaed node-local hostPath. The old danger — Frigate filling the
      # Dragonfly virtual disk and taking k3s, Home Assistant and the door locks
      # with it — is gone: Frigate can only ever fill its own volume now.
      #
      # STILL HELD AT 3 DAYS for one reason: Storage Pool 3 was running DEGRADED on
      # a single drive after one of the two new 10 TB drives failed DOA 2026-08-04.
      # Raise this only once the replacement has landed and the pool reports
      # Healthy — until then every extra day sits on an unprotected disk, and note
      # that the main-stream switch already put ~16x more data at risk there.
      continuous:
        days: 3
      alerts:
        retain:
          days: 30
          mode: all
      detections:
        retain:
          days: 30
          mode: all

    snapshots:
      enabled: true
      retain:
        default: 30

    semantic_search:
      # CLIP embeddings over event thumbnails — this is what makes natural-language
      # search work ("person carrying a box") rather than just label/zone filters.
      # `small` runs on CPU; `large` wants a GPU and is only worth revisiting if the
      # OpenVINO GPU path lands.
      enabled: true
      model: jinav2
      model_size: small
      reindex: false

    genai:
      # Points at LM Studio on the Windows host, NOT at OpenAI.
      #
      # READ THIS BEFORE EDITING: in Frigate 0.17 the `base_url` key under `genai`
      # is IGNORED for the openai provider — the endpoint comes from the
      # OPENAI_BASE_URL environment variable (set in deployment.yaml). Putting a
      # base_url here instead would silently send camera snapshots to
      # api.openai.com. That is a real privacy failure, not a config typo: these
      # are interior cameras and a BEDROOM one is planned for a later phase.
      # 0.18 is expected to honour base_url directly; re-check on upgrade.
      #
      # The endpoint itself is NOT the host's LAN IP — it goes through the
      # lmstudio-fwd socat unit. See plan.md before changing OPENAI_BASE_URL.
      #
      # `{VAR}` DOES NOT INTERPOLATE HERE. Frigate substitutes environment
      # variables in a limited set of fields — ffmpeg input paths and a few
      # credential slots — and `genai.*` is not among them. `model:` used to read
      # `'{FRIGATE_GENAI_MODEL}'` and Frigate sent that string to the endpoint
      # verbatim, so the model name is written out literally below.
      #
      # It hid for a while behind LM Studio's behaviour: with exactly one model
      # loaded, LM Studio serves an unrecognised identifier from whatever is
      # loaded. That was the coder model, which has no vision, so the failure
      # read "Model does not support images" — a plausible wrong answer that sent
      # the 2026-08-02 audit looking at the model choice rather than the config.
      # Loading a second model made it say what it actually meant:
      # `Invalid model identifier "{FRIGATE_GENAI_MODEL}"`.
      #
      # api_key stays a placeholder deliberately: it does not interpolate either,
      # so Frigate sends the literal string — which is fine, because LM Studio
      # does not check it. Do NOT read this line as "the key comes from the
      # secret"; it does not. A real key would have to be written here, which is
      # why this endpoint is a local one that needs none.
      provider: openai
      api_key: "{FRIGATE_GENAI_API_KEY}"
      # Literal, for the reason above. Must name a VISION model — a text-only one
      # returns "Model does not support images" and every event description and
      # semantic-search enrichment silently fails, with only a WARNING in the log.
      # Must also be loaded in LM Studio; listing it is not enough.
      model: google/gemma-4-e4b
      # DO NOT ADD `runtime_options:` HERE. It is a real key on this schema
      # (frigate.config.config.GenAIConfig) and genai/openai.py does splat it into
      # the chat.completions call — but adding it took the whole NVR down on
      # 2026-07-30. On startup Frigate rewrites /config/config.yml and relocates
      # the key into `objects -> genai`, whose model is GenAIObjectConfig, which
      # has no such field. Its own validator then rejects the file it just wrote
      # ("Extra inputs are not permitted") and Frigate boots into SAFE MODE with
      # every camera stopped. The seed was valid; the round-trip is what broke it.
      #
      # What it was wanted for: the gemma-4-*-a4b models are REASONING models, and
      # measured on this host they burn ~317 reasoning tokens / ~15 s before
      # emitting a one-line answer, versus 0 tokens / 0.7 s with
      # `reasoning_effort: none`. That cost is accepted instead. It is survivable
      # because Frigate sends NO max_tokens (verified in genai/openai.py), so the
      # thinking always terminates and the description is still produced — it is
      # slow, not lost. Descriptions are generated after an event ends, off the
      # detection path, so nothing user-facing waits on it.
      #
      # If this ever needs fixing properly, set the default inference params on the
      # model inside LM Studio instead — that is server-side and Frigate cannot
      # rewrite it.

    # A LOCAL MobileNetV2 that answers "cat or dog?" after the detector has already
    # found the animal. It does NOT correct `label` — it can't; it writes `sub_label`.
    # Use sub_label, not label, in any automation that cares which animal it is.
    #
    # WHY THIS AND NOT A BIGGER DETECTOR: measured 2026-08-31 on 284 blind-graded
    # events. The detector's `dog` label is right 49.0% of the time and `cat` 63.2%
    # — but `person` is right 98.9%, and the detector MISSED ZERO of 166 pet events.
    # It finds the animal and then names it with a coin. Exporting YOLOv9-s @ 320 and
    # rerunning the same frames scored 71.8% vs SSDLite's 70.1% overall and was WORSE
    # on the actual complaint (62.7% vs 64.5% on cat-vs-dog), and worse still weighted
    # for real traffic (88.7% vs 93.5%), because person is 87.7% of all events. A
    # different detector is not the fix. A second opinion on the crop is.
    #
    # SCOPED TO BOTH LABELS ON PURPOSE. If it only ran on `cat`, a cat misread as a
    # dog would never reach it. Listing both means the classifier sees the crop
    # whichever way the detector flipped, which covers 96.3% of real pet events.
    #
    # The `none` class is not padding: 26 of the 191 seeded crops are PEOPLE the
    # detector called a pet. Without them the model has no way to say "not an animal"
    # and would confidently name one.
    #
    # Assignment needs BOTH `threshold` and consensus: >=3 attempts with 60% agreeing
    # (frigate/data_processing/real_time/custom_classification.py). Short events may
    # get no sub_label at all — that is the design, not a fault.
    #
    # SCHEMA VERIFIED against the LIVE 0.17.2 instance via /api/config/schema.json,
    # not the docs. Every block here is `additionalProperties: false`, so one stray
    # key boots the whole NVR into safe mode with all cameras stopped — this is the
    # exact trap `genai.runtime_options` fell into on 2026-07-30. Re-verify on upgrade.
    classification:
      custom:
        pets:
          # Frigate uses this KEY as the on-disk folder name, so the training set
          # lives at clips/pets/dataset/{cat,dog,none}/ and the staging pile of
          # recent attempts at clips/pets/train/. Renaming the key orphans the data.
          threshold: 0.8
          object_config:
            objects:
              - dog
              - cat
            classification_type: sub_label

    cameras:
      # Name must match the go2rtc stream, the HA entity object id and
      # Hawksnest's overrides.ts exactly — `cameraNameOf()` is
      # `camera.id.split(".")[1]`. Retargeted from `bedroom` 2026-07-29.
      big_room:
        ffmpeg:
          inputs:
            # The camera's SUB stream, read directly rather than through go2rtc.
            # go2rtc serves the MAIN stream for live view on its own connection, so
            # recording and live view have independent failure domains — a go2rtc
            # restart must never punch a hole in the 24/7 timeline.
            #
            # NO input_args ON PURPOSE (applies to all three cameras). Frigate
            # 0.17's default RTSP preset already supplies what an explicit override
            # would: verified 2026-07-30 against the RUNNING ffmpeg processes
            # (/proc/<pid>/cmdline in the pod), which carry
            #   -rtsp_transport tcp -timeout 10000000
            #   -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt
            #   -use_wallclock_as_timestamps 1
            # plus ffmpeg.retry_interval 10s for reconnects. Pinning input_args
            # here would freeze today's preset and silently opt out of upstream
            # fixes on the 0.18 upgrade. Re-verify the cmdline after any Frigate
            # version bump instead.
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_BIG_ROOM}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          # MUST be set explicitly. Frigate 0.17 defaults detect.enabled to FALSE
          # when the key is absent, and the failure is silent in the worst way:
          # the camera records 24/7, the pod is healthy, ffmpeg is fine,
          # camera_fps looks correct — and NOTHING is ever detected. No events, no
          # search index, no alerts, no GenAI descriptions. It ran that way from
          # first deploy until caught 2026-07-29 by noticing detection_fps was 0.0
          # while a person was plainly visible in the frame.
          #
          # `kubectl logs` will not tell you. The tells are
          # `/api/stats` -> detection_enabled:false, and the MQTT topic
          # frigate/<camera>/detect/state reading OFF.
          enabled: true
          # VERIFIED against the real camera 2026-07-29 (E1 Zoom, itemNo E340,
          # firmware v3.2.0.4741) by ffprobe AND by the camera's own GetEnc:
          #   subStream: 640*360, h264, High profile, 10 fps, 256 kbps, gop 4
          #
          # width/height MUST match what the camera sends — a mismatch there
          # silently misplaces every bounding box rather than erroring. They match.
          width: 640
          height: 360
          # fps is DIFFERENT: the camera sends 10, this asks for 5, and that is
          # deliberate — not an oversight to "fix" later.
          #
          # detect.fps is the rate Frigate runs DETECTION at, not an assertion about
          # the stream; Frigate decimates to it. Leaving the camera at 10 while
          # detecting at 5 is the better split here because this same sub stream also
          # carries the `record` role — 10 fps makes the 24/7 timeline noticeably
          # smoother to scrub, while detection gains nothing from the extra frames.
          # Dropping the camera to 5 would degrade recordings to save decode work
          # that is negligible at 640x360.
          fps: 5
        motion:
          # Mask the camera's OSD TIMESTAMP. The clock repaints every second, and
          # Frigate reads that as motion — continuously, forever, in an empty room.
          # Because object detection only runs where there is motion, an unmasked
          # timestamp means detection runs on EVERY frame 24/7: wasted inference,
          # and every passing object gets scored against a permanently-hot detector.
          #
          # Measured 2026-07-29, and the numbers make the case better than prose:
          #   before mask -> detection_fps 5.0 constantly, empty room
          #   after mask  -> detection_fps 0.0, empty room
          # Confirmed visually first: /api/<cam>/latest.jpg?motion=1 drew a motion
          # box squarely on the seconds digits with nobody in the room.
          #
          # Normalised 0-1 over the 640x360 detect frame. Re-check this box if the
          # camera's OSD position or the detect resolution ever changes — a mask
          # that no longer covers the clock silently restores the old behaviour.
          mask:
            - 0.26,0.015,0.72,0.015,0.72,0.11,0.26,0.11
        objects:
          track:
            - person
            - dog
            - cat
          genai: &person_genai
            # Per-camera, and deliberately narrower than `track`: a description for
            # every passing cat is noise in the search index and needless VLM load.
            enabled: true
            objects:
              - person
            # Send ONE wide frame instead of a sequence of tight crops.
            #
            # Default (false) feeds the model `create_thumbnail(frame, box)` — a
            # stack of images cropped hard to the object's bounding box. On a
            # greyscale IR night frame that is a few hundred pixels of blurry
            # torso with NO surrounding room, and the model fills the void with
            # invention: measured output included "a couple dances on a grand
            # staircase", "two men nearby", and clothing described in detail that
            # is simply not resolvable at that crop size.
            #
            # `true` sends the snapshot cropped to the detection REGION (see
            # `_read_and_crop_snapshot` in data_processing/post/object_descriptions.py)
            # — several times the box area, so the model can see the actual room.
            # Requires the global `snapshots.enabled: true` above; without it
            # `event.has_snapshot` is false and Frigate silently falls back to
            # thumbnails.
            #
            # THE TRADE: one frame instead of many, so motion is no longer
            # inferable — "walks down the stairs" becomes "stands on the stairs".
            # Taken deliberately. A confident sentence about the wrong thing is
            # worse than a plain sentence about the right thing, and it is the
            # search index that has to live with it.
            use_snapshot: true
            # OVERRIDE THE DEFAULT PROMPT. Frigate's built-in one asks the model to
            # "Analyze the sequence of images… consider what the {label} is doing,
            # why, and what it might do next" — an invitation to write an essay, and
            # the model obliges: multi-paragraph answers with markdown headings and
            # numbered sections.
            #
            # The first rewrite fixed length but not truth: it said "plainly state
            # what the {label} is doing", which PRESUPPOSES the model can see what
            # that is and licenses it to fill in gender, clothing and bystanders to
            # make a fluent sentence. Detection is not the problem — those events
            # scored 0.90-0.98 and the people were genuinely there. The narration
            # around them was fabricated.
            #
            # So this version spends most of its words on what NOT to say, and
            # gives an explicit escape hatch: a model with no way to admit
            # uncertainty will always guess.
            #
            # `{label}` is the ONLY brace pair allowed — Frigate runs this through
            # str.format(), so any other literal `{` raises KeyError and kills
            # description generation for every camera at once.
            #
            # Anchored (&person_genai) and aliased by the other two cameras so the
            # wording can never drift between them.
            prompt: >-
              Describe only what is clearly visible in this image. In ONE sentence
              of at most 20 words, say what the {label} is doing and where in the
              room. Write plain text only: no markdown, no preamble. Say "a person"
              — never guess gender, age, identity, or what they are wearing. Never
              mention other people or objects you cannot clearly see, and never
              state a count. If the {label} is blurry, dark, or mostly out of
              frame, reply exactly: "A {label} is present but not clearly visible."
        # ZONES are not committed — unlike the timestamp mask above, they are drawn
        # against a live frame in Frigate's UI and land in the live /config/config.yml.
        # Tune early: every false alert is another junk embedding in the search index.

      # -----------------------------------------------------------------------
      first_floor_stairway:
        # Replaces the RING first_floor_stairway camera (2026-07-29) — same slug on
        # purpose, so the HA entity id and everything downstream keep working. The
        # Ring stream for this slug is retired in the go2rtc seed.
        ffmpeg:
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_FIRST_FLOOR_STAIRWAY}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          # Frigate 0.17 defaults this to FALSE when absent — see the long note on
          # big_room. Without it this camera would record and detect nothing.
          enabled: true
          # VERIFIED 2026-07-29 against 192.168.4.53 by ffprobe (as the `frigate`
          # account, not admin) AND the camera's own GetEnc. Identical hardware and
          # firmware to big_room — E1 Zoom, itemNo E340, v3.2.0.4741 — and the sub
          # stream matches exactly: 640x360 h264 High, 10 fps, 256 kbps, gop 4.
          #
          # It was worth measuring anyway. The MAIN stream shipped as 3840x2160
          # h265, the same WebRTC-breaking default big_room had, and had to be
          # switched to 2560x1440 h264. "Same model so same settings" held for the
          # sub stream and was wrong for the main one.
          width: 640
          height: 360
          # Same 10-sends / 5-detects split as big_room, for the same reason: this
          # stream also carries the `record` role.
          fps: 5
        motion:
          # Same OSD timestamp mask as big_room. Same camera model, same firmware and
          # the same 640x360 detect frame, so the clock sits in the same place.
          # CONFIRMED 2026-07-30 (/api/first_floor_stairway/latest.jpg?motion=1):
          # no motion box on the clock.
          #
          # TWO MORE MASKS — the CEILING FANS, both of them. The debug frame drew
          # detection regions squarely on spinning fan blades: a 24/7 motion
          # source exactly like the clock, keeping the detector hot all night in
          # an empty house (detection_fps was pinned at 13-16). Nobody appears at
          # ceiling height, so masking the sweeps costs nothing.
          #
          # The second fan was only found by re-checking AFTER masking the first
          # (2026-07-30): with the big right-hand fan quiet, detection_fps settled
          # at 1.6-1.9 rather than 0.0, and the fresh debug frame boxed a second
          # fan through the doorway at top-LEFT. Masking one motion source can
          # reveal the next — verify to 0.0, don't stop at "better".
          #   fan 1 (right, in-room):    0.76,0.0 .. 1.0,0.42
          #   fan 2 (left, thru doorway): 0.0,0.23 .. 0.18,0.44
          # VERIFIED 2026-07-30: detection_fps 0.0 on an empty stairway, no boxes.
          # Re-check every box if the OSD position, either fan, or the detect
          # resolution ever changes.
          mask:
            - 0.26,0.015,0.72,0.015,0.72,0.11,0.26,0.11
            - 0.76,0.0,1.0,0.0,1.0,0.42,0.76,0.42
            - 0.0,0.23,0.18,0.23,0.18,0.44,0.0,0.44
        objects:
          track:
            - person
            - dog
            - cat
          # Same one-sentence prompt as big_room — see the anchor there.
          genai: *person_genai

      # -----------------------------------------------------------------------
      kitchen:
        # Replaces the RING kitchen camera (2026-07-29), same slug as big_room and
        # first_floor_stairway before it.
        #
        # DIFFERENT HARDWARE from the other two: this is an E1 **Pro** (itemNo
        # "E Series E330"), firmware v3.1.0.4417 — not an E1 Zoom (E340, v3.2.0.4741).
        # Nothing about the Zooms' stream settings carries over, and the differences
        # are the silent kind:
        #   sub   896x512  @10  1024 kbps   (Zooms: 640x360 @10, 256 kbps)
        #   main  2880x1616 @20 3072 kbps   (Zooms: 2560x1440 @20)
        # Copying the Zooms' 640x360 detect here would have misplaced every bounding
        # box without erroring.
        #
        # It also needs NO H.265 fix: 4MP Reolinks ship h264 on both streams, so the
        # 4K/H.265 SetEnc dance both Zooms required does not apply. Confirmed by
        # ffprobe — GetEnc on this older firmware omits vType entirely, so the camera
        # cannot tell you the codec and ffprobe is the only source of truth.
        ffmpeg:
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_KITCHEN}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          # Frigate 0.17 defaults this to FALSE when absent — see big_room.
          enabled: true
          # VERIFIED by ffprobe 2026-07-29 against 192.168.4.64: h264 High, 896x512,
          # 10 fps. NOT the 640x360 the other two use.
          width: 896
          height: 512
          # Same 10-sends / 5-detects split as the others.
          fps: 5
        motion:
          # Timestamp OSD mask. The box is carried over from the Zooms because the OSD
          # sits in the same relative place; the frame is 896x512 with a slightly
          # different aspect ratio, but normalised coordinates absorb that.
          # CONFIRMED 2026-07-30: /api/kitchen/latest.jpg?motion=1 showed no motion
          # box on the clock, and detection_fps read 0.0 with the kitchen empty.
          # Re-check if the OSD position or detect resolution ever changes.
          mask:
            - 0.26,0.015,0.72,0.015,0.72,0.11,0.26,0.11
        objects:
          track:
            - person
            - dog
            - cat
          # Same one-sentence prompt as big_room — see the anchor there.
          genai: *person_genai

      # =======================================================================
      # FOUR MORE E1 PROs, added 2026-07-31: nursery, basement, bedroom, garage.
      #
      # GEOMETRY VERIFIED PER CAMERA by ffprobe on 2026-07-31, not copied between
      # them. All four returned h264 896x512 @10 on the sub stream — identical to
      # kitchen, different from the two Zooms' 640x360. They were probed
      # individually anyway, because "same model so same settings" already held
      # for the sub stream and was WRONG for the main one on the Zooms (see
      # first_floor_stairway). Main is 2880x1616 @20 h264 on all four, so none of
      # them needs the 4K/H.265 SetEnc fix the Zooms required.
      #
      # NO motion.mask ON ANY OF THESE FOUR YET — deliberate, not an oversight.
      # They were configured while sitting at a temporary bench location and get
      # physically mounted afterwards, so a timestamp/OSD mask drawn against the
      # current scene would be aimed at the wrong part of the frame. Every camera
      # already here needed one and the stairway needed three (clock + two ceiling
      # fans). Draw them per camera AFTER mounting: check
      # /api/<cam>/latest.jpg?motion=1 for a box on the seconds digits, mask it,
      # then confirm detection_fps settles to 0.0 on an empty room — and re-check
      # after each mask, since masking one motion source can reveal the next.
      # Until that is done these four run the detector continuously on the clock
      # repaint, which is wasteful but not harmful.
      # =======================================================================
      nursery:
        # New slug — nothing held it before. Not a Ring replacement.
        ffmpeg:
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_NURSERY}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          # Frigate 0.17 defaults this to FALSE when absent — see big_room.
          enabled: true
          # ffprobe 192.168.4.30, 2026-07-31: h264 896x512 @10.
          width: 896
          height: 512
          # Same 10-sends / 5-detects split as every other camera here.
          fps: 5
        # Retention: inherits the global 3 days. Considered explicitly against the
        # bedroom's 1 day and kept at 3 on 2026-07-31 — this is a monitoring
        # camera where looking back a couple of days is the point of having it.
        objects:
          track:
            - person
            - dog
            - cat
          # Same one-sentence prompt as big_room — see the anchor there.
          genai: *person_genai

      # -----------------------------------------------------------------------
      # SECOND camera in the nursery, added 2026-08-29. Does NOT replace `nursery`
      # (192.168.4.30) — both run, on their own IPs and their own slugs.
      #
      # FIRST E1 OUTDOOR PRO IN THE FLEET (IPC_560SD88MPW, fw v3.1.0.5714_2511271366),
      # and its numbers do NOT follow the model it sits next to. ffprobed 192.168.4.40
      # on 2026-08-29:
      #   sub   640x360  h264 @10, 256 kbps   <-- E1 ZOOM geometry, NOT E1 Pro
      #   main  3840x2160 h265 @20, 4096 kbps
      # The other nursery camera is an E1 Pro at 896x512. Copying its block would have
      # put detect at 896x512 against a 640x360 stream and silently misplaced every
      # bounding box — no error, just wrong boxes. This is why the runbook says probe
      # every camera individually.
      #
      # ===================== DELIBERATE FLEET DEVIATION =====================
      # THIS IS THE ONLY CAMERA THAT RECORDS FROM ITS MAIN STREAM (2026-08-30).
      # Every other camera records from sub. Chosen knowingly, and the whole case
      # for it is below — read it before copying this block to another camera,
      # because the reasoning is camera-specific and does NOT generalise.
      #
      # 4K H.264 (3840x2160 @20). It is NOT SetEnc'd down to 2560x1440 like both
      # E1 Zooms were on 2026-07-29, because it does not have to be:
      #
      # **THIS MODEL SUPPORTS 4K H.264, AND THE FLEET RULE SAYS IT CANNOT.**
      # plan.md and the go2rtc seed both state that 4K forces h265 and that a
      # 4K+h264 SetEnc returns success while silently keeping h265. That was
      # MEASURED ON THE E1 ZOOM and is true there. It is FALSE on the E1 Outdoor
      # Pro. Verified 2026-08-30 with ffprobe, not with the API's 200:
      #     h264Preview_01_main -> h264, 3840, 2160, 20/1
      # Treat "4K forces h265" as a per-model fact to re-probe, not a fleet law.
      #
      # THIS CAMERA SHIPPED H.265 AND THAT CRASHED THE ANDROID APP. Going live on
      # it killed the process outright, 2026-08-29 22:20 EDT:
      #     Fatal signal 11 (SIGSEGV), fault addr 0x0
      #     #00 libjingle_peerconnection_so.so    <- WebRTC native lib
      # libwebrtc null-derefs on HEVC instead of failing negotiation cleanly. Live
      # view was parked on the sub stream as a stopgap; re-encoding the camera to
      # h264 on 2026-08-30 removed the cause, and that stopgap is now reverted.
      #
      # WHAT THE h264 SWITCH BOUGHT, none of which the h265 version had:
      #   - live view works on EVERY client (phone + web) at full 4K over WebRTC,
      #     instead of 640x360 on a workaround
      #   - recordings play in a BROWSER, not just on the phone via ExoPlayer
      #   - no dependence on the RTSP-direct tier, which turned out never to have
      #     been configured on the phone at all (rtspUser/rtspPass are blank, so
      #     every camera in the fleet streams over go2rtc/WebRTC today)
      # Cost: h264 is ~half as efficient as h265, so the same ~4096 kbps carries
      # less detail. Measured bitrate barely moved (4370 -> 4377 kbps), so the
      # disk figures below are unchanged.
      #
      # NOTE THIS NEEDS NO FRIGATE-SIDE CHANGE AT ALL. SetEnc was only ever required to
      # The record split is pure Frigate config either way; what changed on
      # 2026-08-30 was the camera's ENCODER, not this block. Reverting the 4K
      # recording is still pure Frigate config.
      #
      # MEASURED BEFORE COMMITTING (2026-08-30, /h264Preview_01_main — the `h264`
      # in that path is a label, not a promise; it serves HEVC):
      #   -c copy -> mp4   PASSES, hevc + aac 16kHz mono, MP4-legal
      #   achieved         4370 kbps  ->  47.2 GB/day  ->  142 GB at 3-day
      #   volume           2.8 TB free, so disk is not the constraint
      # Recording is -c:v copy, so this costs disk and NIC, NOT detector CPU.
      #
      # THE REAL RISK IS NOT THIS CAMERA — IT IS `nursery`, ITS ROOMMATE.
      # The fleet tried main-stream recording on ALL SEVEN cameras 2026-08-24 and
      # reverted it 2026-08-26 because `nursery` collapsed under the contention
      # (3272 -> 236 kbps, 40% packet loss). That camera is the weakest link in
      # the house and it shares this room. The reason this is worth trying anyway
      # is scale: that test put ~24 Mbps on the channel, this puts ~4.4 Mbps, and
      # `nursery_high` is the stronger radio of the two (signal 3 vs 2).
      #
      # BASELINE TAKEN IMMEDIATELY BEFORE THE CHANGE, so a regression is provable
      # rather than remembered (both sub streams, 20s samples, 00:47Z):
      #   nursery      (.30)  113 kbps   0% loss   RTT avg 8.3 ms   signal 2
      #   nursery_high (.40)  109 kbps   0% loss   RTT avg 12.6 ms  signal 3
      #
      # MEASURED AFTER, 10 minutes in (this is the outcome the baseline existed for):
      #   nursery MAIN stream   3100 kbps   <-- HOLDING. 3272 alone in August, 236
      #                                         when it collapsed. Its live view,
      #                                         the thing this could have killed,
      #                                         is at ~95% of its solo baseline.
      #   nursery sub           116 kbps    (113 before — unchanged)
      #   skipped_fps           0 on all 8 cameras
      #   4K on disk            ~32 MB/min segments = ~46 GB/day, matching the
      #                         47.2 GB/day predicted from the bitrate probe
      #
      # ONE HONEST CAVEAT, recorded because it would otherwise be forgotten: the
      # ICMP path to `nursery` DID degrade — 0% loss / 8.3 ms RTT before, 14% loss /
      # 44.7 ms avg / 421 ms max after, over a 200-packet sample, while big_room as
      # a control sat at 2%. Every functional metric is fine, and APs deprioritise
      # ICMP, so this overstates the impact. But it is real, it means the room has
      # less headroom than it did, and it is the number that would move FIRST if
      # this ever does go bad. Re-measure it before adding anything else to that
      # room — a third camera, or nursery's own main stream going to 24/7 record.
      #
      # (The HEVC-playback caveat that used to sit here is GONE as of 2026-08-30 —
      # recordings are h264 and play anywhere.)
      #
      # IF YOU ARE HERE BECAUSE SOMETHING BROKE: check `nursery`, not this camera.
      # Non-zero skipped_fps or a collapsed bitrate on .30 means this experiment
      # failed — revert to a single sub input with roles [detect, record] and
      # restart. The 30-day alert/detection retention is the other thing to watch,
      # and it only shows up after day 3: a nursery has near-constant motion, so
      # the event pile grows faster here than anywhere else in the house.
      # ======================================================================
      nursery_high:
        ffmpeg:
          inputs:
            # SUB -> detect. Detection wants geometry matching `detect:` below, not
            # pixels; pointing it at 4K would cost decode CPU for no accuracy.
            # No input_args on purpose, same as every other camera here.
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_NURSERY_HIGH}:554/h264Preview_01_sub"
              roles:
                - detect
            # MAIN -> record. 4K HEVC, muxed with -c copy (verified above).
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_NURSERY_HIGH}:554/h264Preview_01_main"
              roles:
                - record
        detect:
          # Frigate 0.17 defaults this to FALSE when absent — see big_room.
          enabled: true
          # ffprobe 192.168.4.40, 2026-08-29: h264 640x360 @10. Measured, not assumed.
          width: 640
          height: 360
          # Same 10-sends / 5-detects split as every other camera here.
          fps: 5
        motion:
          # Mask the OSD TIMESTAMP, same reason as big_room — the clock repaints
          # every second and Frigate reads that as motion forever, in an empty room.
          #
          # CONFIRMED VISUALLY BEFORE MASKING, 2026-08-30, not assumed from the other
          # cameras: /api/nursery_high/latest.jpg?motion=1 drew a motion box squarely
          # on the SECONDS DIGITS with the room empty, and detection_fps sat at 4.7.
          # The timestamp occupies roughly x 205-432, y 8-25 of the 640x360 detect
          # frame; the box below spans x 166-461, y 5-40, clearing it on all sides.
          #
          # Reuses big_room's exact normalised box. That is deliberate and is the
          # same call `kitchen` made: this camera is an E1 Outdoor Pro, a different
          # model, but its detect frame is 640x360 — identical to the Zooms — and its
          # OSD sits in the same relative place. Re-check the debug frame if the OSD
          # position or the detect resolution ever changes; a mask that no longer
          # covers the clock silently restores the old behaviour with no error.
          mask:
            - 0.26,0.015,0.72,0.015,0.72,0.11,0.26,0.11
        # Retention: inherits the global 3 days, matching the other nursery camera.
        objects:
          track:
            - person
            # NO dog/cat ON THIS CAMERA, and that is MEASURED, not squeamishness.
            #
            # This is the ceiling-mounted camera. From directly overhead an adult
            # leaning into the crib presents a wide, low, four-cornered box that is
            # geometrically a quadruped, and the detector says so. Graded blind over
            # 32 sampled events (2026-08-31, harness in OPERATIONS.md):
            #   - 19 of the 23 `dog` events here were PEOPLE. Only 4 were the dog,
            #     and not one was a cat.
            #   - This single camera produced 27% of every misclassification across
            #     the whole system, and scored 37.5% accuracy against 60-100% elsewhere.
            #
            # Everything cheaper was tried against the data first and does NOT work:
            #   - `threshold`/`min_score`: people-called-dog score 0.74-0.99, real pets
            #     0.74-0.90. Completely overlapping — a threshold kills the real dogs
            #     FIRST. There is no cut point.
            #   - `min_area`/`max_area`: people 3519-40812 px2, real pets 3286-15984 px2.
            #     Nested, not separated.
            #   - `min_ratio`/`max_ratio`: people 0.63-1.35 w/h, real pets 0.68-1.22.
            #     Also nested. From overhead a bending person IS the shape of a dog.
            #
            # Dropping the labels is safe because the person is not lost with them:
            # 17 of those 19 events had a concurrent `person` event on this same
            # camera within +/-15s, so the human is already tracked independently.
            # Both labels go, not just `dog` — `cat` fires once per ~3 days here and
            # leaving it would just hand it the person-shaped crops that `dog` was
            # catching.
            #
            # The cost is ~4 real dog events per 3 days on this camera, and it is
            # paid twice over by `nursery`, which watches the same room from the wall,
            # still tracks dog/cat, and caught 23 dog events in the same sample.
            #
            # Re-check this if the camera is ever re-aimed off the overhead angle,
            # because the overhead angle is the entire reason.
          # Same one-sentence prompt as big_room — see the anchor there.
          genai: *person_genai

      # -----------------------------------------------------------------------
      basement:
        # Replaces the RING basement camera (2026-07-31) — same slug on purpose,
        # so the HA entity id and everything downstream keep working. The Ring
        # stream for this slug is retired in the go2rtc seed.
        ffmpeg:
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_BASEMENT}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          enabled: true
          # ffprobe 192.168.4.23, 2026-07-31: h264 896x512 @10.
          width: 896
          height: 512
          fps: 5
        objects:
          track:
            - person
            - dog
            - cat
          genai: *person_genai

      # -----------------------------------------------------------------------
      bedroom:
        # Replaces the RING bedroom camera (2026-07-31), same slug. This is the
        # slug the FIRST Reolink was originally scoped for before being retargeted
        # to big_room on 2026-07-29 — the room finally has its own camera.
        ffmpeg:
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_BEDROOM}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          enabled: true
          # ffprobe 192.168.4.46, 2026-07-31: h264 896x512 @10.
          width: 896
          height: 512
          fps: 5
        record:
          # ONE DAY, not the global 3 — decided 2026-07-31. The global record:
          # block anticipated this exact camera: "The bedroom Reolink planned for a
          # later phase should carry its own SHORTER window set under that camera
          # — do not raise this one and assume it covers both." This is that
          # window. It shortens ONLY the 24/7 continuous timeline; alert and
          # detection clips still follow the global 30-day retention.
          continuous:
            days: 1
        objects:
          track:
            - person
            - dog
            - cat
          genai: *person_genai

      # -----------------------------------------------------------------------
      garage:
        # New slug — nothing held it before. Not a Ring replacement.
        ffmpeg:
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_GARAGE}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          enabled: true
          # ffprobe 192.168.4.62, 2026-07-31: h264 896x512 @10.
          width: 896
          height: 512
          fps: 5
        objects:
          track:
            - person
            - dog
            - cat
          genai: *person_genai

      front_door_reolink:
        # Reolink Video Doorbell WiFi (D340W), added 2026-08-30 — the first DOORBELL in
        # the fleet; every other entry is a wall camera.
        #
        # TEMPORARY SLUG, deliberately not `front_door`. The retired Ring doorbell's
        # ring-mqtt entities still HOLD the `front_door` slugs (they are unavailable but
        # registered, and a registered entity keeps its id), so taking that name now
        # would force these entities onto `_2`/`_3` suffixes — the collision that
        # mis-bound the basement/bedroom tiles. Rename only after those are deleted.
        ffmpeg:
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_IP_FRONT_DOOR_REOLINK}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          enabled: true
          # VERIFIED 192.168.4.74, 2026-08-30, by ffprobe AND the camera's own GetEnc,
          # which agreed: sub h264 640x480 @10, High profile, 256 kbps, gop 4.
          #
          # 640x480 is 4:3 and is NOT a typo — every other Reolink here is 16:9 (640x360
          # Zooms/Outdoor Pro, 896x512 Pros). Copying any of them silently misplaces
          # every bounding box rather than erroring. Do not "correct" this to 360.
          #
          # RTSP over UDP HANGS on this camera — a manual ffprobe never returns and never
          # errors. Use `-rtsp_transport tcp`. Frigate's 0.17 preset already passes it.
          width: 640
          height: 480
          fps: 5
        objects:
          track:
            - person
            - dog
            - cat
          genai: *person_genai
        # NO motion mask, and that is MEASURED not deferred: detection_fps sits at 0.1 on
        # this camera, against 0.0-0.1 on the masked wall cameras. The D340W paints no
        # repainting OSD clock, so there is nothing for a mask to suppress.

      # =======================================================================
      # Reolink Home Hub battery cameras (Argus 4 Pro) — ON DEMAND. Added 2026-09-12.
      #
      # These two are not wall cameras and must not be treated like them. They have no
      # RTSP of their own: the Home Hub (192.168.4.44) serves each bound camera as a
      # channel — h264Preview_0N_{main,sub}, N 1-BASED — on ONE IP with ONE credential
      # pair, and that pair is the hub's ADMIN login (the hub has no user table:
      # AddUser -> "not support" on v3.3.0.456). Hence FRIGATE_REOLINK_HUB_*, never the
      # fleet FRIGATE_REOLINK_USER/PASSWORD.
      #
      # THE HUB WAKES A BATTERY CAMERA ON ANY RTSP REQUEST (7-15 s measured) AND
      # FORCE-SLEEPS IT AFTER 5 MINUTES. A camera Frigate pulls continuously is a
      # wake→sleep→wake loop, forever, on solar. So Frigate never holds these streams:
      #   - `enabled: true` below is the DESIGN, not an oversight. A camera seeded
      #     `enabled: false` can never be turned on over MQTT (0.17.2 dispatcher.py
      #     refuses ON unless enabled_in_config). It comes up ON after every Frigate
      #     start and the HA automation `hawksnest_argus_park` publishes OFF within
      #     ~5 s; `hawksnest_argus_on_demand_<cam>` publishes ON only while the hub's
      #     PIR holds the camera awake, for at most 4 minutes.
      #   - A parked camera stays in /api/stats with camera_fps FROZEN (0 after a
      #     restart). base/frigate/health-cronjob.yaml carries the matching ON_DEMAND
      #     allow-list; the HA detection watchdog needs none (its fps sensors are
      #     disabled by the integration).
      #   - `record.continuous.days: 1` here means "keep every woken window for a
      #     day" whether or not the detector fired inside it — the only shape of the
      #     owner's "1 day" the hardware allows. Alert/detection clips follow the
      #     global 30 days. Disk cost: minutes of footage per day.
      #
      # Both streams ffprobed 2026-09-12 from the hub, per channel, not copied: sub is
      # h264 1536x432 @25 with AAC 16k mono (the Argus 4 Pro's stitched dual-lens 32:9
      # frame — not a 16:9 sibling's numbers); main is 5120x1440 HEVC and is used by
      # nothing (WebRTC cannot carry it, and it is 12x the pixels for a detector that
      # runs a few minutes a day). The hub carried three concurrent sessions on one
      # channel, so this single input beside go2rtc's two is within budget.
      #
      # No motion mask yet: the camera is awake too little to measure one. Check
      # detection_fps during a woken window before drawing any.
      # -----------------------------------------------------------------------
      backyard_patio:
        # Home Hub channel 0 ("Backyard Patio") -> RTSP h264Preview_01. Replaces the
        # Ring `back_yard_patio` camera, DIFFERENT slug on purpose: the Ring entities are
        # still registered and a shared slug would bind Hawksnest to the dead ones (the
        # basement/bedroom lesson). Retire the Ring device, then consider renaming.
        enabled: true
        ffmpeg:
          # THE ONE input_args IN THIS FILE, and it is measured (walk test 2026-09-12):
          # the hub accepts the RTSP connection and starts sending packets at once
          # while the camera is still waking, so ffmpeg's default 5 s probe window
          # (`analyzeduration` 0 = auto) closed before a keyframe/SPS arrived —
          # "Could not find codec parameters ... unspecified size" — and the first
          # attempt died every time. The 10 s retry then succeeded (camera awake by
          # then), costing ~30 s of a ≤4.5-minute window. This is Frigate's own
          # `preset-rtsp-generic` verbatim, with a 10 s probe window and a 30 s
          # socket timeout in place of the preset's 10 s. Wall cameras keep the
          # preset (no input_args) — they answer in a second.
          #
          # NOT LONGER THAN 10 s: Frigate's frame watchdog (video.py) kills an
          # ffmpeg that has produced no frame in 20 s, and a 20 s probe window sat
          # exactly on that deadline — the arrival test 2026-09-12 21:17Z lost
          # its first attempt to "No frames received in 20 seconds" instead.
          #
          # And a second, hub-side race the probe window cannot fix (walk test 2):
          # while the camera finishes waking, the hub answers ffmpeg's SETUP with
          # `454 Session Not Found` and the first attempt dies anyway. Frigate's
          # retry always succeeds — so make it quick. 3 s here instead of the
          # global 10 s turns "~30 s of the window lost" into "~13 s". Per-camera on
          # purpose: a wall camera that needs retries has a real problem, and the
          # slower cadence there is what keeps the watchdog readable.
          retry_interval: 3
          input_args:
            - -avoid_negative_ts
            - make_zero
            - -fflags
            - +genpts+discardcorrupt
            - -rtsp_transport
            - tcp
            - -timeout
            - "30000000"
            - -use_wallclock_as_timestamps
            - "1"
            - -analyzeduration
            - "10000000"
            - -probesize
            - "10000000"
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_HUB_USER}:{FRIGATE_REOLINK_HUB_PASSWORD}@{FRIGATE_REOLINK_IP_HOME_HUB}:554/h264Preview_01_sub"
              roles:
                - detect
                - record
        detect:
          enabled: true
          # ffprobe 192.168.4.44 ch 01, 2026-09-12: h264 1536x432 @25.
          width: 1536
          height: 432
          fps: 5
        record:
          continuous:
            days: 1
        objects:
          track:
            - person
            - dog
            - cat
          genai: *person_genai

      front_yard:
        # Home Hub channel 1 ("Front") -> RTSP h264Preview_02. NOT `front`: that slug is
        # the live Ring "Front" camera's go2rtc stream and HA base (the camera this one
        # replaces) — same ghost-entity trap as above.
        enabled: true
        ffmpeg:
          # Same wake-tolerant input args + quick retry as backyard_patio — see there.
          retry_interval: 3
          input_args:
            - -avoid_negative_ts
            - make_zero
            - -fflags
            - +genpts+discardcorrupt
            - -rtsp_transport
            - tcp
            - -timeout
            - "30000000"
            - -use_wallclock_as_timestamps
            - "1"
            - -analyzeduration
            - "10000000"
            - -probesize
            - "10000000"
          inputs:
            - path: "rtsp://{FRIGATE_REOLINK_HUB_USER}:{FRIGATE_REOLINK_HUB_PASSWORD}@{FRIGATE_REOLINK_IP_HOME_HUB}:554/h264Preview_02_sub"
              roles:
                - detect
                - record
        detect:
          enabled: true
          # ffprobe 192.168.4.44 ch 02, 2026-09-12: h264 1536x432 @25.
          width: 1536
          height: 432
          fps: 5
        record:
          continuous:
            days: 1
        objects:
          track:
            - person
            - dog
            - cat
          genai: *person_genai
