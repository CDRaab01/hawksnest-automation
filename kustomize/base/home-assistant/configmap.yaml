        data:
          command_class: 112
          property: 99
          value: 85
          property_key: 16711680
        action: zwave_js.set_value
      - target:
          device_id: 83fde5fed357870364f7dc7b9c127ac5
        data:
          command_class: 112
          property: 99
          value: 100
          property_key: 65280
        action: zwave_js.set_value
      - target:
          device_id: 83fde5fed357870364f7dc7b9c127ac5
        data:
          command_class: 112
          property: 99
