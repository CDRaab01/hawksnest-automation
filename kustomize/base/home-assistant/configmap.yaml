    - id: '1785540000001'
      alias: Master Bedroom ZEN32 - WLED presets
      description: 'Small keys 1-4 pick a WLED preset on a single tap; a DOUBLE TAP sets
        the same preset at 10%. Each key''s LED colour matches its preset (1 magenta = Nebula,
        2 cyan = Ocean, 3 white = Warm White, 4 yellow = Campfire - the ZEN32 has no orange,
        so Campfire takes the closest warm option). REWIRED 2026-08-04. Before this, only
        keys 1-3 single tap did anything, so five of the eight small-key gestures were silent
        - and a key that does nothing is indistinguishable from a key whose press was dropped,
        which is most of why this pad felt broken next to Cooper''s. Double tap is the SAME
        look rather than a different one, because what a bedroom wants twice is a sleep-safe
        brightness, not eight presets. Warm White drives the SK6812''s dedicated white channel
        instead of mixing RGB, which is the one thing an RGBW strip does that an RGB one
        cannot. Key-to-scene mapping (scene_001..004 = small keys) confirmed live on this
        unit 2026-08-01. Every key powers the strip first via script.master_bedroom_strip_power_up,
        because the big key''s relay is the strip''s mains supply - without that, pressing
        a scene key on a dark strip would do nothing at all and look broken.'
      triggers:
      - platform: state
        entity_id:
        - event.master_bedroom_scene_controller_scene_001
        - event.master_bedroom_scene_controller_scene_002
        - event.master_bedroom_scene_controller_scene_003
        - event.master_bedroom_scene_controller_scene_004
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state not in [''unknown'',''unavailable'',''none'']
          and chosen not in [none,''None'',''''] and ev in [''KeyPressed'',''KeyPressed2x'']
          }}'
      actions:
      - action: script.master_bedroom_strip_power_up
      - action: select.select_option
        target:
          entity_id: select.master_bedroom_preset
        data:
          option: '{{ chosen }}'
      - if:
        - condition: template
          value_template: '{{ ev == ''KeyPressed2x'' }}'
        then:
        - delay:
            seconds: 1
        - action: light.turn_on
          target:
            entity_id: light.master_bedroom
          data:
            brightness_pct: 10
      variables:
        presets:
          '1': Nebula
          '2': Ocean
          '3': Warm White
          '4': Campfire
        chosen: '{{ presets.get(trigger.entity_id[-1]) }}'
        ev: '{{ trigger.to_state.attributes.event_type }}'
      mode: queued
      max: 10
    - id: '1785540000002'
      alias: Master Bedroom ZEN32 - big key gestures
      description: 'SINGLE PRESS IS DELIBERATELY ABSENT. The big key''s relay is the strip''s
        mains supply, so a tap already powers it in hardware - no Home Assistant, no Wi-Fi,
        no Z-Wave. Adding a light.toggle there was an outright bug: it raced the ESP''s
        ~4s boot and could switch the strip straight back off. Double tap drops to 3%
        - chosen to match Blue Relax and Noisemeter, which are both stored at 8/255; the
        first attempt used 12%, which is four times brighter than either and so brightened
        the room instead of dimming it. Press-and-hold sets solid red at 20% as a night-vision-friendly
        mode. Both power the strip first, since neither can reach a controller with no
        mains.'
      triggers:
      - platform: state
        entity_id:
        - event.master_bedroom_scene_controller_scene_005
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state not in [''unknown'',''unavailable'',''none'']
          }}'
      actions:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.to_state.attributes.event_type == ''KeyPressed2x''
              }}'
          sequence:
          - action: script.master_bedroom_strip_power_up
          - action: light.turn_on
            target:
              entity_id: light.master_bedroom
            data:
              brightness_pct: 3
        - conditions:
          - condition: template
            value_template: '{{ trigger.to_state.attributes.event_type == ''KeyHeldDown''
              }}'
          sequence:
          - action: script.master_bedroom_strip_power_up
          - action: light.turn_on
            target:
              entity_id: light.master_bedroom
            data:
              rgb_color:
              - 255
              - 0
              - 0
              brightness_pct: 20
              effect: Solid
      mode: queued
      max: 5
    - id: '1785540000003'
      alias: Master Bedroom strip - brighten amber by day
      description: 'The strip''s mains is the ZEN32''s relay, so every power-on is a cold
        boot. WLED boots into preset 5 ''Amber Night'' (solid amber, 26/255) - deliberately
        the DIM one, because the failure that matters is being blasted at 2am, and brightening
        a room in daylight bothers nobody. This automation supplies the other half: if
        the strip comes up during the day, it is raised to the full-brightness ''Startup''
        amber it used to boot into. Triggered on the entity becoming available, which
        is what a boot looks like from Home Assistant''s side. Doing it the other way
        round - boot bright, dim afterwards - would flash the room every night before
        HA could react.'
      triggers:
      - platform: state
        entity_id: light.master_bedroom
        from: unavailable
      conditions:
      - condition: time
        after: 07:00:00
        before: '21:00:00'
      actions:
      - delay:
          seconds: 3
      - action: select.select_option
        target:
          entity_id: select.master_bedroom_preset
        data:
          option: Startup
      mode: single
    - id: '1785540000004'
      alias: Master Bedroom ZEN32 - LEDs off at night
      description: 'Five lit LEDs point at the bed all night, so after sunset the pad
        goes fully dark and at sunrise it comes back. Only the LED MODE parameters (1-5)
        are toggled: Always on (3) by day, Always off (2) by night. Colour is deliberately
        NOT part of this - it is written once at startup by "Master Bedroom ZEN32 - LED
        colours", because an LED that is off has no colour and rewriting ten parameters
        twice a day to no visible effect is just Z-Wave traffic, on a link that measured
        -86 dBm median and cannot spare it. Earlier versions recoloured to red and then blue
        at Low; both still read as too bright on the wall, and 30% is this device''s floor,
        so the answer was fewer lit LEDs rather than a different colour. KEY 4 JOINED THE
        LOOP 2026-08-04, when it stopped being an unassigned key with a permanently dark
        LED and became Campfire. Night comes from sun.sun rather than from
        which trigger fired, so a Home Assistant restart at 3am re-applies the correct
        state instead of leaving the pad lit - this host has an intermittent RAM fault
        and does restart unexpectedly. Consequence accepted by the owner: at night the
        pad is invisible and the big key has to be found by memory.'
      triggers:
      - platform: sun
        event: sunset
      - platform: sun
        event: sunrise
      - platform: homeassistant
        event: start
      actions:
      - repeat:
          for_each:
          - 1
          - 2
          - 3
          - 4
          - 5
          sequence:
          - action: zwave_js.set_config_parameter
            target:
              device_id: a62df2c050dc5f0aca52cb9e302ef98e
            data:
              parameter: '{{ repeat.item }}'
              value: '{{ 2 if night else 3 }}'
          - delay:
              milliseconds: 400
      variables:
        night: '{{ is_state(''sun.sun'',''below_horizon'') }}'
      mode: single
      max_exceeded: silent
    - id: '1785540000007'
      alias: Master Bedroom ZEN32 - LED colours
      description: 'Writes the four small-key LED colours so the pad says what the keys
        actually do - 1 magenta = Nebula, 2 cyan = Ocean, 3 white = Warm White, 4 yellow
        = Campfire. This device''s palette is White/Blue/Green/Red/Magenta/Yellow/Cyan with
        no orange, so Campfire takes yellow as the closest warm option. These used to be
        set by hand in Z-Wave JS UI and recorded only in a comment, which is exactly how
        the comment ended up describing a key mapping that no longer existed; holding them
        here makes git the source of truth, and a re-include or factory reset self-heals
        on the next restart. Runs ONLY on Home Assistant start, deliberately not on the
        sunset/sunrise schedule - the night automation avoids rewriting colour twice a day
        because an LED that is off has no colour, and that reasoning still holds. Waits for
        the pad to actually answer first. This fires during startup, when zwave_js may not
        have finished loading, and a write then fails with "No zwave_js nodes found for given
        targets" - the same race that was breaking the LED-effect automations.'
      triggers:
      - platform: homeassistant
        event: start
      actions:
      - wait_template: '{{ has_value(''switch.master_bedroom_scene_controller'') }}'
        timeout: '00:05:00'
        continue_on_timeout: false
      - repeat:
          for_each:
          - parameter: 7
            value: 4
          - parameter: 8
            value: 6
          - parameter: 9
            value: 0
          - parameter: 10
            value: 5
          sequence:
          - action: zwave_js.set_config_parameter
            target:
              device_id: a62df2c050dc5f0aca52cb9e302ef98e
            data:
              parameter: '{{ repeat.item.parameter }}'
              value: '{{ repeat.item.value }}'
          - delay:
              milliseconds: 400
      mode: single
      max_exceeded: silent
    - id: '1785540000005'
      alias: Master Bedroom LED bar - alarm colour + dim at night
      description: 'BASE layer only; transient effects live in the overlay automation.
        Colour follows the MFA alarm (blue disarmed, red armed-home, violet armed-away,
        orange arming), ported from the Nursery. NIGHT RULE: after sunset the bar stays
        lit but very dim (8 on / 1 off, the Nursery''s night values) WHENEVER THE ALARM
        IS NOT DISARMED, and goes fully dark when it is. The point is that an armed house
        should still say so at 3am - going dark unconditionally, which this did first,
        threw away the one piece of information worth having overnight. Disarmed and dark
        is fine because there is nothing to report. Sun-based rather than the Nursery''s
        fixed 07/19/21 steps, to match the ZEN32 in the same room. Alerts are independent:
        the overlay writes parameter 99, which carries its own brightness, so a triggered
        alarm or over-temperature pulse shows regardless.'
      triggers:
      - platform: state
        entity_id: alarm_control_panel.mfa_alarm
      - platform: sun
        event: sunset
      - platform: sun
        event: sunrise
      - platform: homeassistant
        event: start
      actions:
      - action: zwave_js.set_config_parameter
        target:
          device_id: 4921442741687644efb1bd60b30c377d
        data:
          parameter: 95
          value: '{{ colour | int }}'
      - action: zwave_js.set_config_parameter
        target:
          device_id: 4921442741687644efb1bd60b30c377d
        data:
          parameter: 96
          value: '{{ colour | int }}'
      - action: zwave_js.set_config_parameter
        target:
          device_id: 4921442741687644efb1bd60b30c377d
        data:
          parameter: 97
          value: '{{ bri_on | int }}'
      - action: zwave_js.set_config_parameter
        target:
          device_id: 4921442741687644efb1bd60b30c377d
        data:
          parameter: 98
          value: '{{ bri_off | int }}'
      variables:
        colour: '{% set s = states(''alarm_control_panel.mfa_alarm'') %}

          {{ {''disarmed'':170,''armed_home'':0,''armed_away'':190,''triggered'':0,''pending'':0,''arming'':7}.get(s,
          170) }}'
        bri_on: '{% set night = is_state(''sun.sun'',''below_horizon'') %}{% set armed
          = states(''alarm_control_panel.mfa_alarm'') != ''disarmed'' %}{{ (8 if armed
          else 0) if night else 33 }}'
        bri_off: '{% set night = is_state(''sun.sun'',''below_horizon'') %}{% set armed
          = states(''alarm_control_panel.mfa_alarm'') != ''disarmed'' %}{{ (1 if armed
          else 0) if night else 10 }}'
      mode: queued
      max: 5
    - id: '1785540000006'
      alias: Master Bedroom LED effect - alarm + too hot
      description: 'Sustained overlay on the Master Bedroom LED bar. VERIFIED ON HARDWARE
        2026-08-02: with the base layer at brightness 8/1 (the dim armed-at-night setting),
        firing this effect produced bright red fast blinking, not a faint one - so parameter
        99 carries its own brightness and is not capped by the base. That is what makes
        ''dim bar all night, loud alert when it matters'' work, and it is the assumption
        the Nursery''s identical overlay also rests on. Priority: alarm triggered (red
        fast blink) > room at or over 78F (orange pulse) > nothing (clear). Parameter
        99 is written as FOUR partials - colour, level, duration, effect - because a whole-parameter
        write returns a 500 on this firmware. Effect 255 is ''Clear'', which releases
        the bar back to the base layer; effect 0 is ''Off'', which would hold it dark
        and outrank the base colour. Temperature comes from the SWITCH''S OWN sensor:
        this room has no separate thermometer, and the Nursery pair was measured on 2026-08-01
        at 72.6F on the switch against 72.2F on its ZSE44 - 0.45F apart, so the switch
        is trustworthy here. That also corrects the Nursery overlay''s description, which
        claims the in-wall sensor runs warm; the measurement says it does not.'
      triggers:
      - platform: state
        entity_id: alarm_control_panel.mfa_alarm
      - platform: state
        entity_id: sensor.master_bedroom_on_off_switch_air_temperature
      - platform: homeassistant
        event: start
      - platform: event
        event_type: master_bedroom_led_restore
      conditions:
      # Do not write to the node before zwave_js can resolve it. Without this, every run in
      # the first minute after a restart failed with "No zwave_js nodes found for given
      # targets" - six such errors on 2026-08-03 at 22:16, because a state trigger on this
      # switch's own sensor fires while the integration is still loading. Guarding on the
      # sensor having a real value is the closest available proxy for "this device answers",
      # since the sensor belongs to the same node the actions write to. A dropped node now
      # skips the run instead of erroring; the write would have failed anyway.
      - condition: template
        value_template: '{{ has_value(''sensor.master_bedroom_on_off_switch_air_temperature'')
          }}'
      actions:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ alarmed }}'
          sequence:
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 16711680
              value: 0
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 65280
              value: 100
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 255
              value: 255
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 4278190080
              value: 2
        - conditions:
          - condition: template
            value_template: '{{ hot }}'
          sequence:
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 16711680
              value: 7
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 65280
              value: 60
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 255
              value: 255
          - action: zwave_js.set_value
            target:
              device_id: 4921442741687644efb1bd60b30c377d
            data:
              command_class: 112
              property: 99
              property_key: 4278190080
              value: 4
        default:
        - action: zwave_js.set_value
          target:
            device_id: 4921442741687644efb1bd60b30c377d
          data:
            command_class: 112
            property: 99
            property_key: 4278190080
            value: 255
      variables:
        alarmed: '{{ states(''alarm_control_panel.mfa_alarm'') == ''triggered'' }}'
        hot: '{{ states(''sensor.master_bedroom_on_off_switch_air_temperature'') | float(0)
          >= 78 }}'
      mode: queued
      max: 5

    # ── Nursery fan follows the nursery temperature ──────────────────────────
    # ENTITY ID IS REAL, not a placeholder: `fan.tower_fan`, confirmed in the entity registry
    # after the Dreo integration was added through the HA UI on 2026-08-04. It is per-install
    # though — re-adding the integration, or renaming the fan in the Dreo app, can change it. The
    # symptom would be HA logging "Referenced entities ... are missing" while the fan never moves.
    #
    # SAME SENSOR AS THE NURSERY LED, deliberately: the mains-powered switch's own thermometer,
    # not the ZSE44. That choice was made 2026-08-02 and the reasoning applies at least as much
    # here — the ZSE44 is battery powered and sleeps, and on 2026-08-01 it had last reported five
    # hours earlier while the switch's reading was seconds old. A fan driven by a five-hour-old
    # temperature is worse than no fan.
    #
    # 74 ON / 72 OFF IS A DEADBAND, NOT A TYPO. A single threshold makes the fan chatter on and
    # off around it, which on a Wi-Fi fan is also a burst of cloud calls each time. Two degrees of
    # separation costs nothing and stops that.
    #
    # Both edges need the temperature to HOLD for two minutes. The deadband handles oscillation;
    # this handles one bad reading. Between 72 and 74 nothing happens at all, so a fan switched on
    # by hand in that range is left alone.
    #
    # Sits below the LED bar's 78 "too hot" alert on purpose: the fan tries to prevent the state
    # the light exists to warn about. If both fire, the room got hot faster than the fan could
    # help and the alert is doing its job.
    #
    # float(0) matches the LED automation: a dropped sensor reads 0, which means "not hot", which
    # means the fan does not run forever on a dead thermometer.
    - id: hawksnest_nursery_fan
      alias: "Nursery: fan follows temperature"
      mode: single
      triggers:
        - trigger: numeric_state
          entity_id: sensor.nursery_on_off_switch_air_temperature
          above: 74
          for: "00:02:00"
          id: hot
        - trigger: numeric_state
          entity_id: sensor.nursery_on_off_switch_air_temperature
          below: 72
          for: "00:02:00"
          id: cool
        # On restart, settle to whatever the current temperature implies rather than leaving the
        # fan wherever it happened to be when HA went down.
        - trigger: homeassistant
          event: start
      variables:
        temp: "{{ states('sensor.nursery_on_off_switch_air_temperature') | float(0) }}"
      actions:
        - choose:
            - conditions: "{{ trigger.id == 'hot' or (trigger.platform == 'homeassistant' and temp >= 74) }}"
              sequence:
                - action: fan.turn_on
                  target:
                    entity_id: fan.tower_fan
            - conditions: "{{ trigger.id == 'cool' or (trigger.platform == 'homeassistant' and temp <= 72) }}"
              sequence:
                - action: fan.turn_off
                  target:
                    entity_id: fan.tower_fan

  scripts.yaml: |
    master_bedroom_strip_power_up:
      alias: 'Master Bedroom strip: ensure powered'
      description: The ZEN32's relay IS the WLED strip's mains supply, so anything that
        talks to the strip over Wi-Fi has to make sure it is actually powered first -
        otherwise the command goes to a controller that is not switched on and vanishes
        silently. Turns the relay on only if it is off, then waits for the ESP to finish
        booting (about 4 seconds, measured) rather than guessing with a fixed delay. Shared
        by every key that sets a scene, so this wait exists once.
      mode: single
      sequence:
      - if:
        - condition: state
          entity_id: switch.master_bedroom_scene_controller
          state: 'off'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.master_bedroom_scene_controller
        - wait_template: '{{ states(''light.master_bedroom'') not in [''unavailable'',''unknown'']
            }}'
          timeout:
            seconds: 25
          continue_on_timeout: false
        - delay:
            seconds: 1

  scenes.yaml: |
    []
