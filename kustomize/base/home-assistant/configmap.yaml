# Seed configuration for Home Assistant.
#
# These files are copied into the ha-config PVC by an initContainer ONLY if they do
# not already exist (see the Deployment). After first boot, HA owns these files on the
# PVC and edits via the UI / file editor persist normally — re-applying this ConfigMap
# will not clobber them.
#
# IMPORTANT: because the seed is a fresh-install-only copy, changes here do NOT reach
# the LIVE prod HA (its PVC is already seeded). To roll the ntfy push config below onto
# the running instance, follow docs/ntfy-push.md (add the rest_command + automations to
# the live config, then Developer Tools → YAML → Reload). CI's ha-config-check still
# validates this seed with HA's own check_config, so it stays a correct record.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-seed
data:
  configuration.yaml: |
    # Loads default integrations (frontend, history, config, etc.)
    default_config:

    http:
      # Ready for a future reverse proxy / Tailscale Serve in front of HA.
      # Harmless with the direct NodePort path used in V1.
      use_x_forwarded_for: true
      trusted_proxies:
        - 127.0.0.1
        - ::1
        - 100.64.0.0/10   # Tailscale CGNAT range
        - 10.42.0.0/16    # K3s flannel pod CIDR (Hawksnest reverse-proxy pod)

    # Recorder history stored in the in-cluster MariaDB (not SQLite-on-NFS).
    # The db_url (with password) is injected via secrets.yaml by the initContainer.
    recorder:
      db_url: !secret recorder_db_url
      purge_keep_days: 30
      commit_interval: 5
      # Added 2026-07-31, with the four-camera rollout. plan.md called for an
      # exclude block during the ORIGINAL three-camera rollout and it was never
      # added, so until now every Frigate diagnostic counter was recorded against
      # purge_keep_days: 30.
      #
      # THE GLOBS ARE MEASURED, NOT COPIED. The obvious set (sensor.*_camera_fps,
      # *_detection_fps, *_process_fps, *_skipped_fps, *_*_cpu_usage) matches
      # ZERO entities on this instance — those sensors do not exist here, and a
      # glob that matches nothing silently excludes nothing while looking correct.
      # What Frigate's HA integration actually creates here are per-camera COUNT
      # sensors. Measured over 24h on 2026-07-31, with 3 cameras:
      #   12 entities (4 per camera), 15,643 of 102,335 total state rows = ~15%
      # At 7 cameras that becomes 28 entities and roughly 36,000 rows/day.
      #
      # Verified these globs match ONLY Frigate camera entities — no Z-Wave, lock
      # or Ring entity is caught. Re-check with a LIKE query against states_meta
      # before adding to this list; do not extend it from another install's docs.
      #
      # DELIBERATELY NOT EXCLUDED: binary_sensor.<cam>_person / _motion*. Those
      # are 7,859 rows/day but they are real history — "when was there motion in
      # the kitchen" is a question worth being able to answer — and the motion
      # glob also catches non-Frigate motion sensors.
      exclude:
        entity_globs:
          - sensor.*_all_count
          - sensor.*_all_active_count
          - sensor.*_person_count
          - sensor.*_person_active_count

    # Push transport for Hawksnest (doorbell + alarm). Publishes to the in-cluster
    # ntfy Service (http://ntfy) — phones subscribe over Tailscale Serve. Generic,
    # entity-agnostic: the automations below pass topic/title/message/tags/etc.
    rest_command:
      # Cooper's WLED strip doubles as the ambilight for the PS5 (HyperHDR on the Wyse
      # 5070 at 192.168.4.65 streams to it). WLED's realtime input OVERRIDES everything
      # else — presets, effects, even on/off — so while the ambilight is running, every
      # other control in this file is silently ineffective on that strip.
      # `lor` is WLED's live-override: 0 = accept the stream, 2 = ignore it and run our
      # own effects. It is a runtime state field and CANNOT be stored in a WLED preset,
      # so it has to be set explicitly here.
      # Talking straight to WLED rather than via the wled integration because the
      # integration exposes no control for this field.
      ambilight_on:
        url: "http://192.168.4.45/json/state"
        method: POST
        content_type: "application/json"
        payload: '{"lor":0,"on":true}'
      ambilight_off:
        url: "http://192.168.4.45/json/state"
        method: POST
        content_type: "application/json"
        payload: '{"lor":2}'
      ntfy_publish:
        url: "http://ntfy/{{ topic }}"
        method: POST
        content_type: "text/plain; charset=utf-8"
        payload: "{{ message }}"
        headers:
          Title: "{{ title }}"
          Priority: "{{ priority | default('default') }}"
          Tags: "{{ tags | default('') }}"
          Click: "{{ click | default('') }}"
          # Optional external image URL (the doorbell snapshot). Empty = no
          # attachment, so alarm/other publishes that omit it are unaffected.
          Attach: "{{ attach | default('') }}"

    # Frigate's actual continuous-recording retention, surfaced as an entity so the
    # Hawksnest apps can size their recorded timeline from the source of truth
    # instead of a hand-synced constant (which drifted the moment anyone touched
    # `record.continuous.days`). HA reaches Frigate's unauthenticated in-cluster
    # API directly; the apps only ever see the resulting sensor — the config
    # endpoint (which embeds camera RTSP URLs) is never proxied outward.
    # Harmless when Frigate is parked (staging): the sensor just reads unavailable
    # and the apps fall back to their built-in default.
    sensor:
      - platform: rest
        name: Frigate retention days
        unique_id: frigate_retention_days
        resource: http://frigate:5000/api/config
        value_template: "{{ value_json.record.continuous.days }}"
        scan_interval: 3600

      # Is the vision model Frigate's GenAI depends on actually loaded and actually
      # capable of images? Added 2026-08-02 after both halves of that failed silently
      # for an unknown length of time.
      #
      # WHY THIS EXISTS. GenAI failures surface only as a WARNING in Frigate's log —
      # event descriptions and semantic-search enrichment just stop, and nothing in
      # HA or the app looks any different. Two distinct faults hid there at once:
      #   1. genai.model was never env-substituted, so Frigate sent the literal
      #      string "{FRIGATE_GENAI_MODEL}" to LM Studio.
      #   2. With one model loaded, LM Studio serves an unknown identifier from
      #      whatever IS loaded. That was a text-only coder model, so the error read
      #      "Model does not support images" — a plausible wrong answer that pointed
      #      at the model choice rather than the config.
      # Loading a second model made LM Studio say what it meant. Neither fault would
      # have been noticed without someone reading the log.
      #
      # LM Studio's NATIVE api (/api/v0/models), not the OpenAI-compatible /v1/models:
      # /v1 lists everything DOWNLOADED, so it reports the model present even when it
      # is unloaded and unusable. /api/v0 carries `state` and `type` per model, which
      # is the whole point — `type: vlm` marks it vision-capable, so this also catches
      # someone repointing genai at a text-only model.
      #
      # The endpoint is the same LM Studio the Frigate container reaches (through the
      # lmstudio-fwd socat unit, NOT the host's LAN IP). Keep it in step with
      # OPENAI_BASE_URL in the frigate secret; they must name the same instance.
      - platform: rest
        name: Frigate GenAI model ready
        unique_id: frigate_genai_model_ready
        resource: http://10.42.0.1:21234/api/v0/models
        # Guard every hop: a missing key or an unreachable endpoint must read
        # "unavailable", never a cheerful "on".
        value_template: >-
          {% set want = 'google/gemma-4-e4b' %}
          {% set m = (value_json.data | default([], true))
                     | selectattr('id', 'eq', want) | list | first | default(none) %}
          {% if m is none %} missing
          {% elif m.state != 'loaded' %} unloaded
          {% elif m.type != 'vlm' %} not_vision
          {% else %} ready {% endif %}
        # LM Studio's idle TTL can unload a model between checks, so poll often
        # enough that a silent unload is caught in minutes rather than at the next
        # time somebody happens to look at an event.
        scan_interval: 300

      # The nursery temperature with the dither taken out. This is what drives
      # the nursery fan's speed (automations.yaml, hawksnest_nursery_fan).
      #
      # THE RAW SENSOR IS NOISY, MEASURED NOT ASSUMED. 113 reports over the nine
      # hours to 2026-08-04 17:00 EDT, and consecutive ones alternate about a
      # degree apart while the room is plainly steady:
      #     72.2498, 73.2002, 72.1562, 73.1660, 72.1382, 73.0886
      # That is ~0.5C of dither around a true value near 72.7, which reads like
      # the switch quantising its ADC rather than the room doing anything.
      #
      # WHY IT MATTERS HERE AND NOT FOR THE LED BAR. The LED compares against a
      # single 78F threshold with the whole room on one side of it. The fan maps
      # 73-78F onto six speeds, so one speed step is ~1.1F — NARROWER THAN THE
      # DITHER. Driven from the raw sensor the fan would change speed every few
      # minutes, all night, in a room with a sleeping baby in it, and every one
      # of those changes is also a round trip to Dreo's cloud.
      #
      # 15 MINUTES flattens an alternation whose period is minutes, and is far
      # shorter than the thermal time constant of a room — a nursery that is
      # genuinely warming is still followed within a few minutes. The lag is a
      # feature on the way down too: it will not chase a door being opened.
      #
      # Deliberately its own entity rather than folded into the automation: it
      # is worth being able to graph the smoothed signal against the raw one
      # when the fan does something surprising.
      #
      # SOURCE CHANGED 2026-08-07, from the switch's own sensor to
      # `sensor.nursery_room_temperature` (defined under `template:` below, where
      # the measurement that justifies it is written down). The dither argument
      # above still applies: that composite passes the switch's reading straight
      # through whenever the switch is trustworthy, so the ADC quantisation is
      # still in the signal. The smoothing now does a second job as well — it
      # ramps the ~6F step that happens when the composite changes which
      # thermometer it believes, instead of stepping the fan in one jump.
      - platform: filter
        name: Nursery temperature average
        unique_id: nursery_temperature_average
        entity_id: sensor.nursery_room_temperature
        filters:
          - filter: time_simple_moving_average
            window_size: "00:15:00"
            precision: 2

    # Household policy for camera object alerts, toggled from Hawksnest's Settings
    # (added 2026-07-30). Server-side ON PURPOSE rather than filtered on the phone:
    # this stops the push being *generated*, so it applies to every device and
    # never wakes a radio for an alert nobody wants. Distinct from the app's own
    # "Push alerts" switch, which is that one phone's ntfy subscription.
    #
    # NO `initial:` — it would reset these on every HA restart and silently
    # override whatever the user chose, which is the fastest way to make a
    # settings screen untrustworthy. Without it the state restores across
    # restarts. Consequence: on FIRST creation a helper is `off`, so turning
    # `hawksnest_alert_person` on once is a required rollout step (the
    # automation's fail-open covers a MISSING helper, not a genuinely-off one).
    input_boolean:
      hawksnest_alert_person:
        name: Person alerts
        icon: mdi:walk
      hawksnest_alert_pets:
        name: Pet alerts
        icon: mdi:dog-side

    # The garage tilt sensors, given door semantics the device does not carry itself.
    #
    # MEASURED ON A MOVING DOOR, 2026-08-06 19:58 — this is the authoritative measurement and
    # the only one that should ever be trusted here:
    #     door CLOSED -> raw `off`      door OPEN -> raw `on`
    # So the raw value already means what a door means, and these templates pass it straight
    # through. No inversion.
    #
    # THIS FILE BRIEFLY INVERTED THEM, AND THAT WAS WRONG. The inversion came from bench-testing
    # a sensor in the hand before mounting: upright read `on`, lying flat read `off`, and the
    # reasoning was that an overhead door's panel is upright when CLOSED, so `on` must mean
    # closed. That reasoning is sound and the conclusion was still wrong, because "upright in
    # someone's hand" and "mounted flat against a door panel" are not the same orientation —
    # this switch responds to rotation about an axis the hand test never isolated. Two further
    # hand tests (rotating 180 degrees end-for-end; lying it face-down) each produced a
    # confident, wrong model of the mechanism.
    #
    # THE LESSON WORTH KEEPING: for a tilt sensor, no amount of handling it on a desk
    # substitutes for one observation of the actual door moving. Open a door, watch the raw
    # entity, believe that. It cost an inversion, a restart and an hour to learn.
    #
    # THE TEMPLATE STAYS EVEN THOUGH IT NO LONGER INVERTS. Three automations name these two ids
    # and nothing else, and that indirection is what made the polarity mistake a one-line fix
    # in this file instead of an edit to every automation. It also adds two things the raw
    # entity does not have: `device_class: garage_door`, so it reads Open/Closed rather than
    # On/Off, and an availability rule. zwave-js exposes this device through BINARY SENSOR CC
    # with no device_class at all — it reports "the tilt switch is engaged", and nothing in the
    # chain knows the hardware is on a door. That meaning is ours to supply, and it is supplied
    # here, once.
    #
    # AVAILABILITY IS DELIBERATE. If a raw entity is missing or unavailable — a flat cell, a
    # dropped node, a sensor not yet paired — the template entity goes unavailable rather than
    # guessing a state. The automations already fail quiet on that, by design. It is why the
    # side sensor's entity sat `unavailable` rather than lying about a door that did not exist
    # yet, and why it started working the moment that node was paired, with no restart.
    #
    # `template:` NEEDED ONE RESTART when it was first added to this file, because the
    # integration was not set up and `template.reload` did not exist. It does now, so further
    # changes here are a reload.
    template:
      - binary_sensor:
          - name: "Garage bay main open"
            unique_id: garage_bay_main_open
            device_class: garage_door
            state: "{{ is_state('binary_sensor.garage_bay_main_tilt_raw', 'on') }}"
            availability: "{{ has_value('binary_sensor.garage_bay_main_tilt_raw') }}"
          - name: "Garage bay side open"
            unique_id: garage_bay_side_open
            device_class: garage_door
            state: "{{ is_state('binary_sensor.garage_bay_side_tilt_raw', 'on') }}"
            availability: "{{ has_value('binary_sensor.garage_bay_side_tilt_raw') }}"

      # ── Which nursery thermometer to believe ──────────────────────────────────────
      # THE SWITCH'S SENSOR IS NOT A ROOM THERMOMETER, and the vendor never said it was.
      # Inovelli parameter 32 is labelled "Internal Temperature" and described in the
      # device config as "Temperature inside of the switch"; it is read-only and exists
      # to feed parameter 33, the overheat cutout (load off at 90C/194F, back at
      # 70C/158F). The VZW30-SN has no calibration or offset parameter, so the bias
      # cannot be trimmed on the device — it has to be handled here.
      #
      # MEASURED 2026-08-07. With `light.nursery_on_off_switch` OFF the switch tracks the
      # ZSE44 to 0.3-0.7F, which is the 0.45F agreement that justified moving the fan and
      # the LED alert onto it on 2026-08-02. That measurement only ever sampled the off
      # state. The switch turned on at 15:54:20 and climbed to a plateau 6-8F above the
      # room — 79.9F against the ZSE44's 74.1F at 18:28 — with the load meter reading
      # 0.0W throughout, so the heat is the relay coil and the LED bar, not the lamp.
      # `sensor.nursery_temperature_average` followed it to 79.5F and the fan sat at 100%
      # in a 74F room for over two hours.
      #
      # WHY DIVERGENCE RATHER THAN "IS THE SWITCH ON". The switch keeps reporting inflated
      # for roughly 45 minutes after the relay opens. A light-state gate would hand back a
      # still-hot reading the instant it switched off; divergence clears itself as the
      # switch actually cools.
      #
      # 2.0F SITS IN AN EMPTY BAND: 0.3-0.7F apart with the switch off against 6-8F with
      # it on, and nothing observed in between, so the threshold is nowhere near either
      # population.
      #
      # THE `or` IS A SAFETY INTERLOCK, NOT BELT AND BRACES. `switch - room > 2` has one
      # false positive — the room genuinely warming while the ZSE44 sleeps — and believing
      # the stale reading there would SUPPRESS a real heat alert in a baby's room. The
      # ZSE44 does sleep: over the four days to 2026-08-07 its median reporting gap was
      # 13 min, but p95 was 131 min and the worst case 241 min. So the room reading is
      # believed only when the divergence is explainable, either because the switch has
      # been on recently (self-heat accounts for it) or because the room reading is fresh
      # (staleness cannot). If neither holds the switch wins, which fails toward running
      # the fan rather than toward missing heat.
      - sensor:
          - name: "Nursery room temperature"
            unique_id: nursery_room_temperature
            unit_of_measurement: "°F"
            device_class: temperature
            state_class: measurement
            # Unavailable only if BOTH thermometers are gone — either one alone is enough
            # to serve a number, and the automations' own guards read this entity.
            availability: >-
              {{ has_value('sensor.nursery_on_off_switch_air_temperature')
                 or has_value('sensor.nursery_temperature_humidity_xs_sensor_air_temperature') }}
            state: >-
              {% set sw_e = 'sensor.nursery_on_off_switch_air_temperature' %}
              {% set room_e = 'sensor.nursery_temperature_humidity_xs_sensor_air_temperature' %}
              {% if not has_value(room_e) %}{{ states(sw_e) | float | round(2) }}
              {% elif not has_value(sw_e) %}{{ states(room_e) | float | round(2) }}
              {% else %}
              {% set sw = states(sw_e) | float %}
              {% set room = states(room_e) | float %}
              {% set l = states.light.nursery_on_off_switch %}
              {% set diverged = (sw - room) > 2.0 %}
              {% set self_heat = l is not none and (l.state == 'on'
                                 or (now() - l.last_changed).total_seconds() < 3600) %}
              {% set fresh = (now() - states[room_e].last_reported).total_seconds() < 5400 %}
              {{ (room if (diverged and (self_heat or fresh)) else sw) | round(2) }}
              {% endif %}

    # Modular config splits so automations/scripts/scenes can grow independently
    # (WLED, Zigbee, Plex, presence/auto-lock all slot in here later).
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

  automations.yaml: |
    # Hawksnest push notifications (Gate 3). Both automations are deliberately
    # entity-ID-free: they watch the global state_changed event and filter in a
    # cheap template condition, so they work regardless of how the Ring/alarm
    # entities are named on this instance (no guessing on the lock stack). Once
    # you've confirmed the real entity_ids you may convert these to specific
    # `platform: state` triggers for efficiency — see docs/ntfy-push.md.
    - id: hawksnest_push_doorbell
      alias: "Hawksnest push: doorbell ding"
      mode: parallel
      max: 10
      trigger:
        - platform: event
          event_type: state_changed
      condition:
        - condition: template
          value_template: >-
            {{ trigger.event.data.entity_id.endswith('_ding')
               and trigger.event.data.new_state is not none
               and trigger.event.data.new_state.state == 'on'
               and (trigger.event.data.old_state is none
                    or trigger.event.data.old_state.state != 'on') }}
      action:
        # The camera base (`binary_sensor.<base>_ding` → `<base>`) is the app's logical
        # camera id (`camera.<base>`). The click deep-links a Hawksnest notification tap
        # straight to that camera's live view (PushRoute.cameraOf), and `attach` sends the
        # camera's current snapshot as the notification image (best-effort — empty if the
        # `camera.<base>` entity has no picture yet).
        - variables:
            cam_base: >-
              {{ trigger.event.data.entity_id
                 | replace('binary_sensor.', '') | replace('_ding', '') }}
            cam_pic: "{{ state_attr('camera.' ~ cam_base, 'entity_picture') }}"
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: "Doorbell"
            message: >-
              Someone's at {{ trigger.event.data.new_state.attributes.friendly_name
                              | default(trigger.event.data.entity_id) }}
            tags: "bell"
            priority: "high"
            click: "https://dragonfly.tail2ce561.ts.net:8443/?camera=camera.{{ cam_base }}"
            attach: >-
              {{ ('https://dragonfly.tail2ce561.ts.net:8443' ~ cam_pic)
                 if cam_pic else '' }}

    - id: hawksnest_push_alarm
      alias: "Hawksnest push: alarm state change"
      mode: parallel
      max: 10
      trigger:
        - platform: event
          event_type: state_changed
      condition:
        - condition: template
          value_template: >-
            {{ trigger.event.data.entity_id.startswith('alarm_control_panel.')
               and trigger.event.data.new_state is not none
               and trigger.event.data.old_state is not none
               and trigger.event.data.new_state.state
                   != trigger.event.data.old_state.state
               and trigger.event.data.new_state.state in
                   ['armed_home', 'armed_away', 'armed_night', 'armed_vacation',
                    'disarmed', 'triggered', 'pending', 'arming'] }}
      action:
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: >-
              Alarm {{ trigger.event.data.new_state.state | replace('_', ' ') }}
            message: >-
              {{ trigger.event.data.new_state.attributes.friendly_name
                 | default('Alarm') }} is now
              {{ trigger.event.data.new_state.state | replace('_', ' ') }}
            tags: >-
              {{ 'rotating_light' if trigger.event.data.new_state.state == 'triggered'
                 else 'shield' }}
            priority: >-
              {{ 'urgent' if trigger.event.data.new_state.state == 'triggered'
                 else 'default' }}
            click: "https://dragonfly.tail2ce561.ts.net:8443/"

    # Ring snapshot policy (camera tile freshness). ring-mqtt's per-camera
    # `select.<base>_snapshot_mode` defaults to Auto, whose interval flag is
    # !operatingOnBattery — so battery cameras only snapshot on motion/ding and
    # their Hawksnest tiles go stale for hours between events. Policy: every
    # camera gets mode "All" (= Auto's ding+motion PLUS interval snapshots on
    # battery too), and battery cams (those with a `sensor.<base>_battery`) get
    # a 300s interval — wired cams keep ring-mqtt's 30s default. Self-healing
    # (hourly + on HA start) because these live in ring-mqtt saved state on the
    # PVC: a PVC restore or camera re-discovery silently reverts them to Auto.
    # Entity-ID-free, like the push automations above. Battery cost is the
    # accepted trade-off; tune per-camera via the number entity if drain bites.
    # Camera object alerts — "There is a person at your Kitchen", with a picture.
    #
    # The repo's FIRST MQTT-triggered automation. That is deliberate and it beats
    # the `state_changed` + template pattern the three above use: it is inherently
    # entity-ID-free (it reads Frigate's own payload, not entity ids) AND it skips
    # the global state_changed firehose entirely.
    #
    # TRIGGERS ON `frigate/reviews`, NOT `frigate/events` — this is the dedup.
    # Frigate tracks each object separately, and one person crossing a room
    # produces SEVERAL concurrent tracked objects (measured: three at once on the
    # kitchen camera). Triggering on events meant three pushes for one person.
    # A "review segment" is Frigate's own coalescing of a burst of activity on one
    # camera into a single reviewable item, so `type: new` on reviews = one alert
    # per camera per burst of activity. That is upstream-maintained dedup rather
    # than a hand-rolled cooldown with helpers writing state on every event, on a
    # cluster that also runs the door locks.
    #
    # NOT filtered on `severity == 'alert'`, which is the obvious-looking thing to
    # do and would be wrong here: Frigate scores person/car as `alert` and
    # everything else as `detection`, so a severity filter would silently kill dog
    # and cat alerts. The object toggles below do that job properly instead.
    #
    # The payload is {type, before, after} (frigate/review/maintainer.py), where
    # `after.data.objects` is the DEDUPED LIST of labels in the segment — hence the
    # list handling rather than a single `label`.
    #
    # WHY the picture is the camera's `entity_picture` and NOT Frigate's
    # /api/frigate/notifications/<id>/thumbnail.jpg: Frigate writes both the
    # thumbnail and the snapshot to disk in end(), so at `new` NEITHER file is
    # guaranteed to exist yet — the attach would race and usually lose, and a
    # failed image silently degrades the notification to text-only. The camera
    # entity's signed entity_picture is always available, is the wide room view
    # (what the Ring notification shows), and is the same mechanism the doorbell
    # push above already uses in production. It is a LIVE frame, so on a slow
    # detection it can lag the event by a second — accepted; an always-present
    # near-frame beats an exact frame that is usually missing.
    #
    # The URL must be the https://…:8443 Tailscale front: Android ships with
    # cleartext disabled, and PushNotifier fetches the image with NO auth headers
    # (hence the *signed* token in entity_picture doing the authenticating).
    - id: hawksnest_push_camera_object
      alias: "Hawksnest push: camera object detected"
      mode: parallel
      max: 10
      trigger:
        - platform: mqtt
          topic: frigate/reviews
      variables:
        ev: "{{ trigger.payload_json.after | default({}, true) }}"
        # Deduped labels in this segment. `-verified` suffixes are stripped so a
        # verified detection still matches the plain label.
        objects: >-
          {{ (ev.data | default({}, true)).objects | default([], true)
             | map('replace', '-verified', '') | list }}
        # Person wins the wording when a segment contains both — it's the one you
        # actually care about, and a segment is one notification.
        label: >-
          {{ 'person' if 'person' in objects
             else (objects | select('in', ['dog', 'cat']) | first | default('', true)) }}
        cam: "{{ ev.camera | default('', true) }}"
        cam_name: >-
          {{ state_attr('camera.' ~ cam, 'friendly_name')
             | default(cam | replace('_', ' ') | title, true) }}
        cam_pic: "{{ state_attr('camera.' ~ cam, 'entity_picture') }}"
        # First tracked object in the segment — enough for the app to deep-link.
        event_id: >-
          {{ (ev.data | default({}, true)).detections | default([], true)
             | first | default('', true) }}
        front: "https://dragonfly.tail2ce561.ts.net:8443"
      condition:
        # Cheapest checks first — this runs on every Frigate review update.
        - condition: template
          value_template: "{{ trigger.payload_json.type == 'new' }}"
        # EXPLICIT allow-list, not "anything Frigate tracked": widening the
        # `track:` list in the Frigate seed must never silently start pushing.
        - condition: template
          value_template: "{{ label in ['person', 'dog', 'cat'] }}"
        # Armed-only. These are INDOOR cameras — people living here generate
        # person events constantly (measured: 10 in a few minutes), so alerting
        # while disarmed would be unusable. Entity-ID-free so a panel rename
        # can't break it; with one panel this reads as "the alarm is armed".
        # Only armed_home/armed_away are listed because the panel reports
        # supported_features=3 — night/vacation can never occur here.
        - condition: template
          value_template: >-
            {{ states.alarm_control_panel
               | selectattr('state', 'in', ['armed_home', 'armed_away'])
               | list | count > 0 }}
        # Object-class toggles, with DELIBERATELY ASYMMETRIC failure modes:
        # person fails OPEN (a missing or unknown helper still alerts — a renamed
        # helper must never silently disable a security feature), pets fail
        # CLOSED (off is the safe direction for noise).
        - condition: template
          value_template: >-
            {% if label == 'person' %}
              {{ states('input_boolean.hawksnest_alert_person') != 'off' }}
            {% else %}
              {{ states('input_boolean.hawksnest_alert_pets') == 'on' }}
            {% endif %}
      action:
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: "{{ label | title }} at {{ cam_name }}"
            message: "There is a {{ label }} at your {{ cam_name }}."
            # These tags are the CLIENT'S ROUTING KEY (PushRoute.kindOf picks the
            # notification channel off them) as well as valid ntfy emoji, so the
            # alert also renders sensibly in the plain ntfy app.
            tags: "{{ 'walking' if label == 'person' else label }}"
            priority: "{{ 'high' if label == 'person' else 'default' }}"
            # `event=` is unused by the client today, on purpose: the live-HA
            # dual-write is the expensive step, so every parameter we may ever
            # want ships now and the follow-up stays a pure client change.
            click: "{{ front }}/?camera=camera.{{ cam }}&event={{ event_id }}"
            attach: "{{ (front ~ cam_pic) if cam_pic else '' }}"

    # Frigate detection watchdog. Guards against the failure that actually shipped:
    # detect.enabled silently false (0.17 default) — pod healthy, ffmpeg healthy,
    # recordings accumulating, and NOTHING ever detected, with no log line to find.
    # Also catches a dead camera stream (camera_fps pinned at 0 — hung ffmpeg or a
    # DHCP'd camera IP moving out from under the Secret), which is otherwise equally
    # silent. Deliberately NOT detection_fps-based: detection only runs where there
    # is motion, so 0.0 overnight in an empty house is normal, not a failure.
    # Entity-ID-free like the push automations above (`switch.<cam>_detect` and
    # `sensor.<cam>_camera_fps` are frigate-hass-integration names). Checks hourly;
    # a 15-minute grace keeps Frigate restarts from paging anyone. Repeats hourly
    # until fixed — for a household, a reminder beats a latch that gets missed.
    - id: hawksnest_frigate_detection_watchdog
      alias: "Hawksnest: Frigate detection watchdog"
      mode: single
      trigger:
        - platform: time_pattern
          minutes: "23"
      variables:
        dead_detect: >-
          {{ states.switch
             | selectattr('entity_id', 'search', '_detect$')
             | selectattr('state', 'eq', 'off')
             | selectattr('last_changed', 'lt', now() - timedelta(minutes=15))
             | map(attribute='entity_id') | list }}
        dead_stream: >-
          {{ states.sensor
             | selectattr('entity_id', 'search', '_camera_fps$')
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('state', 'in', ['0', '0.0'])
             | selectattr('last_changed', 'lt', now() - timedelta(minutes=15))
             | map(attribute='entity_id') | list }}
        # Anything other than 'ready' means event descriptions and semantic-search
        # enrichment are silently dead. Deliberately treats unavailable/unknown as a
        # fault too: if the sensor cannot reach LM Studio, neither can Frigate.
        genai_state: "{{ states('sensor.frigate_genai_model_ready') }}"
        genai_bad: >-
          {{ genai_state not in ['ready'] }}
      condition:
        - condition: template
          value_template: >-
            {{ (dead_detect | count) > 0 or (dead_stream | count) > 0 or genai_bad }}
      action:
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: "Frigate watchdog"
            message: >-
              {%- if dead_detect | count > 0 -%}
              Detection is OFF: {{ dead_detect | join(', ') }}.
              {%- endif -%}
              {%- if dead_stream | count > 0 %}
              Camera stream dead (0 fps): {{ dead_stream | join(', ') }}.
              {%- endif %}
              {%- if genai_bad %}
              AI event descriptions are down ({{ genai_state }}) — LM Studio is not
              serving a loaded vision model, so every event description and search
              enrichment is failing silently.
              {%- endif %}
              {%- if dead_detect | count > 0 or dead_stream | count > 0 %}
              Frigate is recording blind — check /api/stats and the camera IPs.
              {%- endif %}
            tags: "warning"
            priority: "high"
            click: "https://dragonfly.tail2ce561.ts.net:8447/"

    - id: hawksnest_ring_snapshot_policy
      alias: "Hawksnest: Ring snapshot policy (battery cams get interval snapshots)"
      mode: single
      trigger:
        - platform: homeassistant
          event: start
        - platform: time_pattern
          hours: "/1"
          minutes: "7"
      action:
        - repeat:
            for_each: >-
              {{ states.select
                 | selectattr('entity_id', 'search', '_snapshot_mode$')
                 | selectattr('state', 'ne', 'All')
                 | rejectattr('state', 'in', ['unavailable', 'unknown'])
                 | map(attribute='entity_id') | list }}
            sequence:
              - service: select.select_option
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  option: "All"
        - repeat:
            for_each: >-
              {{ states.number
                 | selectattr('entity_id', 'search', '_snapshot_interval$')
                 | rejectattr('state', 'in', ['unavailable', 'unknown'])
                 | map(attribute='entity_id') | list }}
            sequence:
              - condition: template
                value_template: >-
                  {% set base = repeat.item
                     | replace('number.', '') | replace('_snapshot_interval', '') %}
                  {{ has_value('sensor.' ~ base ~ '_battery')
                     and (states(repeat.item) | float(0)) != 300 }}
              - service: number.set_value
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  value: 300

    # Bedroom privacy window, 19:00–07:00 (added 2026-07-31).
    #
    # TWO layers, because either alone leaves a hole:
    #   * Frigate detect/recordings/snapshots OFF — nothing is written to the NVR,
    #     no events, no AI descriptions, nothing enters the semantic search index.
    #   * The camera's own PRIVACY MODE ON — the Reolink physically stops serving
    #     video, so there is nothing to capture even for something that asks the
    #     camera directly (go2rtc live view, the Reolink app, anything on the LAN).
    #
    # Single automation rather than a pair, with an `homeassistant.start` trigger,
    # so the window is ENFORCED rather than merely toggled at the edges. A restart
    # at 21:00 (or a host reboot — this machine has a history of them) would
    # otherwise leave the bedroom recording all night because the 19:00 edge had
    # already passed.
    #
    # `continue_on_error` on every privacy_mode call is load-bearing:
    # switch.bedroom_privacy_mode only exists once the official Reolink
    # integration is added for this camera (runbook step 7.2 — not done at the
    # time of writing). Calling a service on a missing entity aborts the rest of
    # the sequence, which would silently take the Frigate half down with it. With
    # the guard, the software half works today and the hardware half starts
    # working the moment the integration lands, with no edit here.
    #
    # EXPECT DURING THE WINDOW: the bedroom tile reads unavailable in Hawksnest.
    # That is the feature working, not a fault.
    #
    # THE THIRD LAYER, added 2026-08-01: `frigate/bedroom/enabled/set` = OFF.
    #
    # detect/recordings/snapshots OFF only mutes Frigate's OUTPUTS — it keeps the
    # capture pipeline alive, so ffmpeg goes on pulling a camera that privacy mode
    # has made silent. The watchdog then crash-loops it all night:
    #     watchdog.bedroom: No frames received from bedroom in 20 seconds
    #     watchdog.bedroom: Ffmpeg process crashed unexpectedly for bedroom
    #     ffmpeg.bedroom.detect: Could not find codec parameters ... unspecified size
    # 634 error lines in one window on 2026-07-31. This note used to say those
    # errors were expected; they were, but they are also avoidable, and the real
    # cost is that a genuinely broken bedroom camera is indistinguishable from a
    # privacy window in the logs. (It cost an incorrect "the camera has failed"
    # diagnosis that same night — the direct symptoms of privacy mode, an RTSP
    # stream advertising `h264, 0x0, 0/0 fps` and port 80 refusing, look exactly
    # like a wedged encoder.)
    #
    # `enabled` is a real Frigate MQTT command (0.17.2 `dispatcher.py` registers
    # `"enabled": self._on_enabled_command`) and it stops the pipeline properly:
    # verified live — "Terminating the existing ffmpeg process / FFmpeg has exited",
    # 0 record processes, no watchdog noise, and back recording ~12s after ON.
    # There is NO `switch.<camera>_enabled` entity in the HA integration, which is
    # why this goes via mqtt.publish rather than switch.turn_off.
    #
    # The other two layers are deliberately KEPT. `enabled` alone would do it, but
    # they cost nothing, and if a Frigate upgrade ever renames this command the
    # privacy guarantee must not quietly depend on one topic string.
    - id: hawksnest_bedroom_privacy_window
      alias: "Hawksnest: bedroom privacy window (19:00-07:00)"
      mode: single
      trigger:
        - platform: time
          at: "19:00:00"
        - platform: time
          at: "07:00:00"
        - platform: homeassistant
          event: start
      action:
        - choose:
            # --- inside the window: privacy ON ---
            - conditions:
                - condition: time
                  after: "19:00:00"
                  before: "07:00:00"
              sequence:
                # Frigate first, THEN the lens — so the camera moving into privacy
                # position is never itself recorded.
                - service: switch.turn_off
                  target:
                    entity_id:
                      - switch.bedroom_detect
                      - switch.bedroom_recordings
                      - switch.bedroom_snapshots
                # Stop the capture pipeline outright, so no ffmpeg is left pulling a
                # camera that is about to go silent (see the note above).
                - service: mqtt.publish
                  data:
                    topic: frigate/bedroom/enabled/set
                    payload: "OFF"
                - service: switch.turn_on
                  continue_on_error: true
                  target:
                    entity_id: switch.bedroom_privacy_mode
          # --- outside the window: privacy OFF ---
          default:
            - service: switch.turn_off
              continue_on_error: true
              target:
                entity_id: switch.bedroom_privacy_mode
            # The lens takes ~20s to return and the encoder restarts with it.
            # Re-enabling Frigate first would bank a minute of black frames and a
            # burst of decode errors at the top of every morning's timeline.
            - delay: "00:00:30"
            # Pipeline back up BEFORE the output switches: `enabled` is what spawns
            # ffmpeg, and it takes ~12s to produce frames. Doing it in the other
            # order would arm recording against a camera with no capture running.
            - service: mqtt.publish
              data:
                topic: frigate/bedroom/enabled/set
                payload: "ON"
            - service: switch.turn_on
              target:
                entity_id:
                  - switch.bedroom_detect
                  - switch.bedroom_recordings
                  - switch.bedroom_snapshots

    # ── Reconciled from the live instance, 2026-08-02 ─────────────────────────
    # Built in the HA UI and never written back here, so they lived only on the
    # ha-config PVC. Copied in mechanically (scripts/ha-config-drift-check.sh now
    # guards the gap). Schema is HA's post-2024.10 spelling (triggers/conditions/
    # actions) because that is what the UI editor writes.
    - id: '1782824028630307'
      alias: All Lock
      triggers:
      - platform: state
        entity_id: alarm_control_panel.mfa_alarm
        to: armed_home
      conditions: []
      actions:
      - target:
          entity_id:
          - lock.front_door_lock
          - lock.garage_door
          - lock.lock
        action: lock.lock
      mode: single
    - id: '1783863871268981'
      alias: Garage Door Unarm
      triggers:
      - platform: state
        entity_id: alarm_control_panel.mfa_alarm
        to: disarmed
      conditions: []
      actions:
      - target:
          entity_id:
          - lock.garage_door
