      mode: single
    - id: '1785527100001'
      alias: Cooper's ZEN32 - WLED presets
      description: Small buttons 1-4 pick a WLED preset. Single tap = Starry Night / Campfire
        / Ocean / Nebula (matching each button's LED colour); double tap = New Sleep /
        Rocket / Rainbow 2 / Music. Button-to-scene mapping measured 2026-08-01, not assumed.
        Clears the ambilight override FIRST (2026-08-09) - the strip is now also the PS5's
        ambilight, and WLED realtime input outranks presets, so without this a button press
        selected the preset silently and nothing on the wall changed.
      triggers:
      - entity_id:
        - event.cooper_s_bedroom_cooper_s_scene_controller_scene_001
        - event.cooper_s_bedroom_cooper_s_scene_controller_scene_002
        - event.cooper_s_bedroom_cooper_s_scene_controller_scene_003
        - event.cooper_s_bedroom_cooper_s_scene_controller_scene_004
        platform: state
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state not in [''unknown'',''unavailable'',''none'']
          and chosen not in [none,''None'',''''] }}'
      actions:
      # Hand the strip back from the TV before selecting, or the preset is invisible.
      - action: rest_command.ambilight_off
      - target:
          entity_id: select.cooper_s_new_bedroom_preset
        data:
          option: '{{ chosen }}'
        action: select.select_option
      variables:
        presets:
          1_KeyPressed: Starry Night
          2_KeyPressed: Campfire
          3_KeyPressed: Ocean
          4_KeyPressed: Nebula
          1_KeyPressed2x: New Sleep
          2_KeyPressed2x: Rocket
          3_KeyPressed2x: Rainbow 2
          4_KeyPressed2x: Music
        chosen: '{{ presets.get(trigger.entity_id[-1] ~ ''_'' ~ trigger.to_state.attributes.event_type)
          }}'
      max: 10
      mode: queued
    - id: '1785527100002'
      alias: Cooper's ZEN32 - big button
      description: Big relay key (scene_005). SINGLE PRESS IS NOT HANDLED HERE - the key
        is hard-wired to the relay (parameter 19 = 1, local control enabled), so a tap
        throws the relay in hardware and keeps working when Home Assistant or Z-Wave is
        down. That matters because the relay drives real loads in a child's bedroom and
        this host has an intermittent RAM fault. Double tap toggles the WLED strip and
        press-and-hold starts the PS5 ambilight; both of those need HA, which costs nothing
        because the strip is Wi-Fi and needed it anyway. Scene events still fire on a single
        press - deliberately ignored, or the tap would toggle the relay twice over.
        CHANGED 2026-08-09 - press-and-hold used to select Starry Night. That preset is still
        one tap away on small button 1, so nothing was lost, and hold was the only gesture
        free on this key - every single/double tap on all five buttons is already spoken for.
        Double tap now clears the ambilight override before toggling, because WLED realtime
        outranks on/off - without it, "off" set the stored state but the LEDs stayed lit from
        the stream.
      triggers:
      - platform: state
        entity_id:
        - event.cooper_s_bedroom_cooper_s_scene_controller_scene_005
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state not in [''unknown'',''unavailable'',''none'']
          }}'
      actions:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.to_state.attributes.event_type == ''KeyPressed2x''
              }}'
          sequence:
          # Order matters: drop the override first, or the toggle is overridden by the
          # incoming stream and the strip appears not to respond at all.
          - action: rest_command.ambilight_off
          - action: light.toggle
            target:
              entity_id: light.cooper_s_new_bedroom
        - conditions:
          - condition: template
            value_template: '{{ trigger.to_state.attributes.event_type == ''KeyHeldDown''
              }}'
          sequence:
          - action: rest_command.ambilight_on
      mode: queued
      max: 5
    - id: '1785527100003'
      alias: Nursery LED bar - alarm colour + night dimming
      description: BASE layer only. Colour follows the MFA alarm (blue disarmed, red armed-home,
        violet armed-away, orange arming); brightness steps down through evening into
        night. Transient effects live in the two automations below. Updated 2026-08-01.
      triggers:
      - entity_id: alarm_control_panel.mfa_alarm
        platform: state
      - at:
        - 07:00:00
        - '19:00:00'
        - '21:00:00'
        platform: time
      - event: start
        platform: homeassistant
      actions:
      - target:
          device_id: 83fde5fed357870364f7dc7b9c127ac5
        data:
          parameter: 95
          value: '{{ colour | int }}'
        action: zwave_js.set_config_parameter
      - target:
          device_id: 83fde5fed357870364f7dc7b9c127ac5
        data:
          parameter: 96
          value: '{{ colour | int }}'
        action: zwave_js.set_config_parameter
      - target:
          device_id: 83fde5fed357870364f7dc7b9c127ac5
        data:
          parameter: 97
          value: '{{ bri_on | int }}'
        action: zwave_js.set_config_parameter
      - target:
          device_id: 83fde5fed357870364f7dc7b9c127ac5
        data:
          parameter: 98
          value: '{{ bri_off | int }}'
        action: zwave_js.set_config_parameter
      variables:
        bri_off: '{% set h = now().hour %}

          {{ 10 if 7 <= h < 19 else (5 if 19 <= h < 21 else 1) }}'
        bri_on: '{% set h = now().hour %}

          {{ 33 if 7 <= h < 19 else (20 if 19 <= h < 21 else 8) }}'
        colour: '{% set s = states(''alarm_control_panel.mfa_alarm'') %}

          {{ {''disarmed'':170,''armed_home'':0,''armed_away'':190,''triggered'':0,''pending'':0,''arming'':7}.get(s,
          170) }}'
      mode: single
    - id: '1785527100004'
      alias: Nursery LED effect - alarm + too hot
      description: 'Sustained overlay on the Nursery LED bar. Priority: alarm triggered
        (red fast blink) > room at or over 78F (orange pulse) > nothing (clear). TEMPERATURE
        SOURCE CHANGED TWICE. 2026-08-02 moved it from the ZSE44 to the switch''s OWN sensor:
        the ZSE44 is battery powered and sleeps - on 2026-08-01 it had last reported five
        hours earlier while the switch was seconds old - and the two agreed to 0.45F, so the
        prompt one won. 2026-08-07 found the hole in that measurement: 0.45F is only true
        while the switch is OFF. Under load the switch self-heats to 6-8F above the room
        (Inovelli parameter 32 is the chipset''s INTERNAL temperature, feeding the parameter
        33 overheat cutout - not a room thermometer, and the VZW30-SN has no offset
        parameter to trim it). It now reads `sensor.nursery_room_temperature`, which chooses
        between the two thermometers; the measurement justifying that lives in
        configuration.yaml. Fails safe: if that drops out, float(0) makes ''hot'' false
        rather than firing. Parameter 99 is written as FOUR partials because a whole-parameter
        write 500s on this firmware; effect 255 is ''Clear'' (releases the bar), not 0
        which is ''Off'' and would hold it dark. The override-beats-base behaviour this
        relies on was verified on the Master Bedroom twin 2026-08-02.'
      triggers:
      - entity_id: alarm_control_panel.mfa_alarm
        platform: state
      - entity_id: sensor.nursery_room_temperature
        platform: state
      - event: start
        platform: homeassistant
      - event_type: nursery_led_restore
        platform: event
      conditions:
      # Same startup race as the Master Bedroom twin, and it failed at the same two moments
      # on 2026-08-03 22:16. See that automation for the reasoning; the guard is identical
      # except for which node's sensor stands in for "this device answers".
      #
      # DELIBERATELY STILL THE SWITCH'S OWN SENSOR, not the composite this automation now
      # reads for temperature (2026-08-07). This guard is not asking "do we have a usable
      # temperature", it is asking "does the node we are about to write LED parameters to
      # answer". The composite can be perfectly available off the ZSE44 alone while the
      # switch is off the mesh, which is exactly the case this has to keep catching.
      - condition: template
        value_template: '{{ has_value(''sensor.nursery_on_off_switch_air_temperature'')
          }}'
      actions:
      - default:
        - target:
            device_id: 83fde5fed357870364f7dc7b9c127ac5
          data:
            command_class: 112
            property: 99
            value: 255
            property_key: 4278190080
          action: zwave_js.set_value
        choose:
        - sequence:
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 0
              property_key: 16711680
            action: zwave_js.set_value
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 100
              property_key: 65280
            action: zwave_js.set_value
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 255
              property_key: 255
            action: zwave_js.set_value
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 2
              property_key: 4278190080
            action: zwave_js.set_value
          conditions:
          - condition: template
            value_template: '{{ alarmed }}'
        - sequence:
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 7
              property_key: 16711680
            action: zwave_js.set_value
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 60
              property_key: 65280
            action: zwave_js.set_value
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 255
              property_key: 255
            action: zwave_js.set_value
          - target:
              device_id: 83fde5fed357870364f7dc7b9c127ac5
            data:
              command_class: 112
              property: 99
              value: 4
              property_key: 4278190080
            action: zwave_js.set_value
          conditions:
          - condition: template
            value_template: '{{ hot }}'
      variables:
        hot: '{{ states(''sensor.nursery_room_temperature'') | float(0) >= 78 }}'
        alarmed: '{{ states(''alarm_control_panel.mfa_alarm'') == ''triggered'' }}'
      mode: restart
    - id: '1785527100005'
      alias: Nursery LED effect - garage door opened
      description: Pulses the Nursery LED bar green for 5s when the garage door opens,
        then restores whatever the arbiter says should be showing. Skipped entirely while
        the alarm is triggered. Created 2026-08-01.
      triggers:
      - from: 'off'
