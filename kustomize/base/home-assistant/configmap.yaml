# Seed configuration for Home Assistant.
#
# These files are copied into the ha-config PVC by an initContainer ONLY if they do
# not already exist (see the Deployment). After first boot, HA owns these files on the
# PVC and edits via the UI / file editor persist normally — re-applying this ConfigMap
# will not clobber them.
#
# IMPORTANT: because the seed is a fresh-install-only copy, changes here do NOT reach
# the LIVE prod HA (its PVC is already seeded). To roll the ntfy push config below onto
# the running instance, follow docs/ntfy-push.md (add the rest_command + automations to
# the live config, then Developer Tools → YAML → Reload). CI's ha-config-check still
# validates this seed with HA's own check_config, so it stays a correct record.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-seed
data:
  configuration.yaml: |
    # Loads default integrations (frontend, history, config, etc.)
    default_config:

    http:
      # Ready for a future reverse proxy / Tailscale Serve in front of HA.
      # Harmless with the direct NodePort path used in V1.
      use_x_forwarded_for: true
      trusted_proxies:
        - 127.0.0.1
        - ::1
        - 100.64.0.0/10   # Tailscale CGNAT range
        - 10.42.0.0/16    # K3s flannel pod CIDR (Hawksnest reverse-proxy pod)

    # Recorder history stored in the in-cluster MariaDB (not SQLite-on-NFS).
    # The db_url (with password) is injected via secrets.yaml by the initContainer.
    recorder:
      db_url: !secret recorder_db_url
      purge_keep_days: 30
      commit_interval: 5

    # Push transport for Hawksnest (doorbell + alarm). Publishes to the in-cluster
    # ntfy Service (http://ntfy) — phones subscribe over Tailscale Serve. Generic,
    # entity-agnostic: the automations below pass topic/title/message/tags/etc.
    rest_command:
      ntfy_publish:
        url: "http://ntfy/{{ topic }}"
        method: POST
        content_type: "text/plain; charset=utf-8"
        payload: "{{ message }}"
        headers:
          Title: "{{ title }}"
          Priority: "{{ priority | default('default') }}"
          Tags: "{{ tags | default('') }}"
          Click: "{{ click | default('') }}"
          # Optional external image URL (the doorbell snapshot). Empty = no
          # attachment, so alarm/other publishes that omit it are unaffected.
          Attach: "{{ attach | default('') }}"

    # Frigate's actual continuous-recording retention, surfaced as an entity so the
    # Hawksnest apps can size their recorded timeline from the source of truth
    # instead of a hand-synced constant (which drifted the moment anyone touched
    # `record.continuous.days`). HA reaches Frigate's unauthenticated in-cluster
    # API directly; the apps only ever see the resulting sensor — the config
    # endpoint (which embeds camera RTSP URLs) is never proxied outward.
    # Harmless when Frigate is parked (staging): the sensor just reads unavailable
    # and the apps fall back to their built-in default.
    sensor:
      - platform: rest
        name: Frigate retention days
        unique_id: frigate_retention_days
        resource: http://frigate:5000/api/config
        value_template: "{{ value_json.record.continuous.days }}"
        scan_interval: 3600

    # Household policy for camera object alerts, toggled from Hawksnest's Settings
    # (added 2026-07-30). Server-side ON PURPOSE rather than filtered on the phone:
    # this stops the push being *generated*, so it applies to every device and
    # never wakes a radio for an alert nobody wants. Distinct from the app's own
    # "Push alerts" switch, which is that one phone's ntfy subscription.
    #
    # NO `initial:` — it would reset these on every HA restart and silently
    # override whatever the user chose, which is the fastest way to make a
    # settings screen untrustworthy. Without it the state restores across
    # restarts. Consequence: on FIRST creation a helper is `off`, so turning
    # `hawksnest_alert_person` on once is a required rollout step (the
    # automation's fail-open covers a MISSING helper, not a genuinely-off one).
    input_boolean:
      hawksnest_alert_person:
        name: Person alerts
        icon: mdi:walk
      hawksnest_alert_pets:
        name: Pet alerts
        icon: mdi:dog-side

    # Modular config splits so automations/scripts/scenes can grow independently
    # (WLED, Zigbee, Plex, presence/auto-lock all slot in here later).
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

  automations.yaml: |
    # Hawksnest push notifications (Gate 3). Both automations are deliberately
    # entity-ID-free: they watch the global state_changed event and filter in a
    # cheap template condition, so they work regardless of how the Ring/alarm
    # entities are named on this instance (no guessing on the lock stack). Once
    # you've confirmed the real entity_ids you may convert these to specific
    # `platform: state` triggers for efficiency — see docs/ntfy-push.md.
    - id: hawksnest_push_doorbell
      alias: "Hawksnest push: doorbell ding"
      mode: parallel
      max: 10
      trigger:
        - platform: event
          event_type: state_changed
      condition:
        - condition: template
          value_template: >-
            {{ trigger.event.data.entity_id.endswith('_ding')
               and trigger.event.data.new_state is not none
               and trigger.event.data.new_state.state == 'on'
               and (trigger.event.data.old_state is none
                    or trigger.event.data.old_state.state != 'on') }}
      action:
        # The camera base (`binary_sensor.<base>_ding` → `<base>`) is the app's logical
        # camera id (`camera.<base>`). The click deep-links a Hawksnest notification tap
        # straight to that camera's live view (PushRoute.cameraOf), and `attach` sends the
        # camera's current snapshot as the notification image (best-effort — empty if the
        # `camera.<base>` entity has no picture yet).
        - variables:
            cam_base: >-
              {{ trigger.event.data.entity_id
                 | replace('binary_sensor.', '') | replace('_ding', '') }}
            cam_pic: "{{ state_attr('camera.' ~ cam_base, 'entity_picture') }}"
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: "Doorbell"
            message: >-
              Someone's at {{ trigger.event.data.new_state.attributes.friendly_name
                              | default(trigger.event.data.entity_id) }}
            tags: "bell"
            priority: "high"
            click: "https://dragonfly.tail2ce561.ts.net:8443/?camera=camera.{{ cam_base }}"
            attach: >-
              {{ ('https://dragonfly.tail2ce561.ts.net:8443' ~ cam_pic)
                 if cam_pic else '' }}

    - id: hawksnest_push_alarm
      alias: "Hawksnest push: alarm state change"
      mode: parallel
      max: 10
      trigger:
        - platform: event
          event_type: state_changed
      condition:
        - condition: template
          value_template: >-
            {{ trigger.event.data.entity_id.startswith('alarm_control_panel.')
               and trigger.event.data.new_state is not none
               and trigger.event.data.old_state is not none
               and trigger.event.data.new_state.state
                   != trigger.event.data.old_state.state
               and trigger.event.data.new_state.state in
                   ['armed_home', 'armed_away', 'armed_night', 'armed_vacation',
                    'disarmed', 'triggered', 'pending', 'arming'] }}
      action:
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: >-
              Alarm {{ trigger.event.data.new_state.state | replace('_', ' ') }}
            message: >-
              {{ trigger.event.data.new_state.attributes.friendly_name
                 | default('Alarm') }} is now
              {{ trigger.event.data.new_state.state | replace('_', ' ') }}
            tags: >-
              {{ 'rotating_light' if trigger.event.data.new_state.state == 'triggered'
                 else 'shield' }}
            priority: >-
              {{ 'urgent' if trigger.event.data.new_state.state == 'triggered'
                 else 'default' }}
            click: "https://dragonfly.tail2ce561.ts.net:8443/"

    # Ring snapshot policy (camera tile freshness). ring-mqtt's per-camera
    # `select.<base>_snapshot_mode` defaults to Auto, whose interval flag is
    # !operatingOnBattery — so battery cameras only snapshot on motion/ding and
    # their Hawksnest tiles go stale for hours between events. Policy: every
    # camera gets mode "All" (= Auto's ding+motion PLUS interval snapshots on
    # battery too), and battery cams (those with a `sensor.<base>_battery`) get
    # a 300s interval — wired cams keep ring-mqtt's 30s default. Self-healing
    # (hourly + on HA start) because these live in ring-mqtt saved state on the
    # PVC: a PVC restore or camera re-discovery silently reverts them to Auto.
    # Entity-ID-free, like the push automations above. Battery cost is the
    # accepted trade-off; tune per-camera via the number entity if drain bites.
    # Camera object alerts — "There is a person at your Kitchen", with a picture.
    #
    # The repo's FIRST MQTT-triggered automation. That is deliberate and it beats
    # the `state_changed` + template pattern the three above use: it is inherently
    # entity-ID-free (it reads Frigate's own payload, not entity ids) AND it skips
    # the global state_changed firehose entirely.
    #
    # TRIGGERS ON `frigate/reviews`, NOT `frigate/events` — this is the dedup.
    # Frigate tracks each object separately, and one person crossing a room
    # produces SEVERAL concurrent tracked objects (measured: three at once on the
    # kitchen camera). Triggering on events meant three pushes for one person.
    # A "review segment" is Frigate's own coalescing of a burst of activity on one
    # camera into a single reviewable item, so `type: new` on reviews = one alert
    # per camera per burst of activity. That is upstream-maintained dedup rather
    # than a hand-rolled cooldown with helpers writing state on every event, on a
    # cluster that also runs the door locks.
    #
    # NOT filtered on `severity == 'alert'`, which is the obvious-looking thing to
    # do and would be wrong here: Frigate scores person/car as `alert` and
    # everything else as `detection`, so a severity filter would silently kill dog
    # and cat alerts. The object toggles below do that job properly instead.
    #
    # The payload is {type, before, after} (frigate/review/maintainer.py), where
    # `after.data.objects` is the DEDUPED LIST of labels in the segment — hence the
    # list handling rather than a single `label`.
    #
    # WHY the picture is the camera's `entity_picture` and NOT Frigate's
    # /api/frigate/notifications/<id>/thumbnail.jpg: Frigate writes both the
    # thumbnail and the snapshot to disk in end(), so at `new` NEITHER file is
    # guaranteed to exist yet — the attach would race and usually lose, and a
    # failed image silently degrades the notification to text-only. The camera
    # entity's signed entity_picture is always available, is the wide room view
    # (what the Ring notification shows), and is the same mechanism the doorbell
    # push above already uses in production. It is a LIVE frame, so on a slow
    # detection it can lag the event by a second — accepted; an always-present
    # near-frame beats an exact frame that is usually missing.
    #
    # The URL must be the https://…:8443 Tailscale front: Android ships with
    # cleartext disabled, and PushNotifier fetches the image with NO auth headers
    # (hence the *signed* token in entity_picture doing the authenticating).
    - id: hawksnest_push_camera_object
      alias: "Hawksnest push: camera object detected"
      mode: parallel
      max: 10
      trigger:
        - platform: mqtt
          topic: frigate/reviews
      variables:
        ev: "{{ trigger.payload_json.after | default({}, true) }}"
        # Deduped labels in this segment. `-verified` suffixes are stripped so a
        # verified detection still matches the plain label.
        objects: >-
          {{ (ev.data | default({}, true)).objects | default([], true)
             | map('replace', '-verified', '') | list }}
        # Person wins the wording when a segment contains both — it's the one you
        # actually care about, and a segment is one notification.
        label: >-
          {{ 'person' if 'person' in objects
             else (objects | select('in', ['dog', 'cat']) | first | default('', true)) }}
        cam: "{{ ev.camera | default('', true) }}"
        cam_name: >-
          {{ state_attr('camera.' ~ cam, 'friendly_name')
             | default(cam | replace('_', ' ') | title, true) }}
        cam_pic: "{{ state_attr('camera.' ~ cam, 'entity_picture') }}"
        # First tracked object in the segment — enough for the app to deep-link.
        event_id: >-
          {{ (ev.data | default({}, true)).detections | default([], true)
             | first | default('', true) }}
        front: "https://dragonfly.tail2ce561.ts.net:8443"
      condition:
        # Cheapest checks first — this runs on every Frigate review update.
        - condition: template
          value_template: "{{ trigger.payload_json.type == 'new' }}"
        # EXPLICIT allow-list, not "anything Frigate tracked": widening the
        # `track:` list in the Frigate seed must never silently start pushing.
        - condition: template
          value_template: "{{ label in ['person', 'dog', 'cat'] }}"
        # Armed-only. These are INDOOR cameras — people living here generate
        # person events constantly (measured: 10 in a few minutes), so alerting
        # while disarmed would be unusable. Entity-ID-free so a panel rename
        # can't break it; with one panel this reads as "the alarm is armed".
        # Only armed_home/armed_away are listed because the panel reports
        # supported_features=3 — night/vacation can never occur here.
        - condition: template
          value_template: >-
            {{ states.alarm_control_panel
               | selectattr('state', 'in', ['armed_home', 'armed_away'])
               | list | count > 0 }}
        # Object-class toggles, with DELIBERATELY ASYMMETRIC failure modes:
        # person fails OPEN (a missing or unknown helper still alerts — a renamed
        # helper must never silently disable a security feature), pets fail
        # CLOSED (off is the safe direction for noise).
        - condition: template
          value_template: >-
            {% if label == 'person' %}
              {{ states('input_boolean.hawksnest_alert_person') != 'off' }}
            {% else %}
              {{ states('input_boolean.hawksnest_alert_pets') == 'on' }}
            {% endif %}
      action:
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: "{{ label | title }} at {{ cam_name }}"
            message: "There is a {{ label }} at your {{ cam_name }}."
            # These tags are the CLIENT'S ROUTING KEY (PushRoute.kindOf picks the
            # notification channel off them) as well as valid ntfy emoji, so the
            # alert also renders sensibly in the plain ntfy app.
            tags: "{{ 'walking' if label == 'person' else label }}"
            priority: "{{ 'high' if label == 'person' else 'default' }}"
            # `event=` is unused by the client today, on purpose: the live-HA
            # dual-write is the expensive step, so every parameter we may ever
            # want ships now and the follow-up stays a pure client change.
            click: "{{ front }}/?camera=camera.{{ cam }}&event={{ event_id }}"
            attach: "{{ (front ~ cam_pic) if cam_pic else '' }}"

    # Frigate detection watchdog. Guards against the failure that actually shipped:
    # detect.enabled silently false (0.17 default) — pod healthy, ffmpeg healthy,
    # recordings accumulating, and NOTHING ever detected, with no log line to find.
    # Also catches a dead camera stream (camera_fps pinned at 0 — hung ffmpeg or a
    # DHCP'd camera IP moving out from under the Secret), which is otherwise equally
    # silent. Deliberately NOT detection_fps-based: detection only runs where there
    # is motion, so 0.0 overnight in an empty house is normal, not a failure.
    # Entity-ID-free like the push automations above (`switch.<cam>_detect` and
    # `sensor.<cam>_camera_fps` are frigate-hass-integration names). Checks hourly;
    # a 15-minute grace keeps Frigate restarts from paging anyone. Repeats hourly
    # until fixed — for a household, a reminder beats a latch that gets missed.
    - id: hawksnest_frigate_detection_watchdog
      alias: "Hawksnest: Frigate detection watchdog"
      mode: single
      trigger:
        - platform: time_pattern
          minutes: "23"
      variables:
        dead_detect: >-
          {{ states.switch
             | selectattr('entity_id', 'search', '_detect$')
             | selectattr('state', 'eq', 'off')
             | selectattr('last_changed', 'lt', now() - timedelta(minutes=15))
             | map(attribute='entity_id') | list }}
        dead_stream: >-
          {{ states.sensor
             | selectattr('entity_id', 'search', '_camera_fps$')
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('state', 'in', ['0', '0.0'])
             | selectattr('last_changed', 'lt', now() - timedelta(minutes=15))
             | map(attribute='entity_id') | list }}
      condition:
        - condition: template
          value_template: "{{ (dead_detect | count) > 0 or (dead_stream | count) > 0 }}"
      action:
        - service: rest_command.ntfy_publish
          data:
            topic: "hawksnest-alerts"
            title: "Frigate watchdog"
            message: >-
              {%- if dead_detect | count > 0 -%}
              Detection is OFF: {{ dead_detect | join(', ') }}.
              {%- endif -%}
              {%- if dead_stream | count > 0 %}
              Camera stream dead (0 fps): {{ dead_stream | join(', ') }}.
              {%- endif %}
              Frigate is recording blind — check /api/stats and the camera IPs.
            tags: "warning"
            priority: "high"
            click: "https://dragonfly.tail2ce561.ts.net:8447/"

    - id: hawksnest_ring_snapshot_policy
      alias: "Hawksnest: Ring snapshot policy (battery cams get interval snapshots)"
      mode: single
      trigger:
        - platform: homeassistant
          event: start
        - platform: time_pattern
          hours: "/1"
          minutes: "7"
      action:
        - repeat:
            for_each: >-
              {{ states.select
                 | selectattr('entity_id', 'search', '_snapshot_mode$')
                 | selectattr('state', 'ne', 'All')
                 | rejectattr('state', 'in', ['unavailable', 'unknown'])
                 | map(attribute='entity_id') | list }}
            sequence:
              - service: select.select_option
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  option: "All"
        - repeat:
            for_each: >-
              {{ states.number
                 | selectattr('entity_id', 'search', '_snapshot_interval$')
                 | rejectattr('state', 'in', ['unavailable', 'unknown'])
                 | map(attribute='entity_id') | list }}
            sequence:
              - condition: template
                value_template: >-
                  {% set base = repeat.item
                     | replace('number.', '') | replace('_snapshot_interval', '') %}
                  {{ has_value('sensor.' ~ base ~ '_battery')
                     and (states(repeat.item) | float(0)) != 300 }}
              - service: number.set_value
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  value: 300

  scripts.yaml: |
    {}

  scenes.yaml: |
    []
