apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  # Recreate: ha-config is RWO and HA is a singleton.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      initContainers:
        # Gate HA on MariaDB being reachable. Without this, a boot-time race (HA up
        # before MariaDB finishes first-boot DB init) makes the recorder setup fail
        # permanently for that boot, taking history/logbook/energy down with it.
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for mariadb:3306 ..."
              until nc -w2 mariadb 3306 </dev/null >/dev/null 2>&1; do
                sleep 2
              done
              echo "mariadb is up"
        # Seeds configuration files and assembles secrets.yaml (containing the
        # recorder DB URL with the MariaDB password) on first boot only. Existing
        # files on the PVC are never overwritten, so user edits survive restarts.
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              for f in configuration.yaml automations.yaml scripts.yaml scenes.yaml; do
                if [ ! -f "/config/$f" ]; then
                  echo "seeding $f"
                  cp "/seed/$f" "/config/$f"
                fi
              done
              if [ ! -f /config/secrets.yaml ]; then
                echo "writing secrets.yaml"
                printf 'recorder_db_url: "mysql://%s:%s@mariadb:3306/%s?charset=utf8mb4"\n' \
                  "$MYSQL_USER" "$MYSQL_PASSWORD" "$MYSQL_DATABASE" > /config/secrets.yaml
              fi
          envFrom:
            - secretRef:
                name: mariadb-credentials
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
      containers:
        - name: home-assistant
          # Pinned, not :stable. `stable` is a moving tag, so any pod recreate —
          # a node reboot, an eviction, an unrelated `kubectl apply` — can pull a
          # new HA minor unattended. HA minors do make breaking config changes, and
          # this instance owns three deadbolts, an alarm panel and the Z-Wave mesh.
          # Bump deliberately, after reading the release notes; the frigate manifest
          # already makes this argument for itself and HA is the higher-stakes half.
          image: ghcr.io/home-assistant/home-assistant:2026.6.4
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: TZ
              value: "America/New_York"   # adjust if needed
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ha-config
        - name: seed
          configMap:
            name: home-assistant-seed
