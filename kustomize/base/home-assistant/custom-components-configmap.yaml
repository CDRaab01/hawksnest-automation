apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-custom-components
# Third-party Home Assistant integrations, vendored so they survive a PVC rebuild.
#
# WHY THIS EXISTS. HA custom_components live on the ha-config PVC, which means they are invisible
# to git and gone if the volume is ever restored from scratch. The Frigate integration is in
# exactly that state today — installed by hand, recorded nowhere. Rather than add a second one,
# Dreo is vendored here and copied in by the seed initContainer, the same pattern go2rtc's config
# and the quick-reply audio already use.
#
# WHY NOT HACS. HACS is UI-managed state that git never sees, which is the drift the 2026-08-02
# audit flagged with the live HA automations. A pinned tarball is auditable and reproducible; the
# cost is that upgrades are a deliberate act rather than a button.
#
# WHY NOT DOWNLOAD AT BOOT. An initContainer that fetches from GitHub would make Home Assistant —
# and therefore three deadbolts and the alarm — unable to start when GitHub is unreachable. Not a
# trade worth making to avoid a 94 KB blob in git.
#
# CONTENTS: JeffSteinbok/hass-dreo v1.11.1 (2026-08-02), custom_components/dreo only, with the
# brand/ images stripped — those belong to the HA brands repo and are not needed at runtime.
# Reviewed before vendoring: manifest declares iot_class cloud_push and a single requirement
# (websockets), and the only URL in the source is Dreo's own API.
#
# UPGRADING:
#   curl -sL -o src.tgz https://api.github.com/repos/JeffSteinbok/hass-dreo/tarball/vX.Y.Z
#   tar xzf src.tgz && rm -rf */custom_components/dreo/brand
#   tar czf dreo.tgz -C */custom_components dreo && base64 -w0 dreo.tgz
# then replace the blob below and bump the name in the header. HA needs a restart to pick it up.
#
# CLOUD, NOT LOCAL. Dreo has no local API; this integration talks to Dreo's servers, so the fan
# stops responding when the internet does. Acceptable for a comfort fan and NOT acceptable for
# anything on the lock/alarm path — do not extend this pattern there.
binaryData:
  dreo-1.11.1.tar.gz: 
