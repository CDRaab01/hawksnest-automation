apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  type: NodePort
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http
      # Fixed NodePort so the Windows-side portproxy target is stable.
      nodePort: 30123
