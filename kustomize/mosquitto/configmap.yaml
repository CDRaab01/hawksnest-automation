apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    # Mosquitto broker config.
    # Installed now as a seam for future local MQTT devices (e.g. Ratgdo on ESP32).
    # Harmless if nothing connects.
    listener 1883
    persistence true
    persistence_location /mosquitto/data/

    # Authentication required (no anonymous access). The password file is provided
    # via the `mosquitto-credentials` Secret (see secrets/mosquitto.passwd.example).
    allow_anonymous false
    password_file /mosquitto/config/passwd

    log_dest stdout
    log_type warning
    log_type notice
