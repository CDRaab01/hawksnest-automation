apiVersion: v1
kind: Service
metadata:
  name: ring-mqtt
  labels:
    app: ring-mqtt
spec:
  # ClusterIP is enough: HA consumes the camera stream in-cluster at
  # rtsp://ring-mqtt.home-automation.svc:8554/... and discovers devices over MQTT.
  # For the web UI / one-time Ring token generation, port-forward 55123:
  #   kubectl port-forward deploy/ring-mqtt 55123:55123 -n home-automation
  selector:
    app: ring-mqtt
  ports:
    - name: rtsp
      port: 8554
      targetPort: rtsp
    - name: webrtc-tcp
      port: 8555
      targetPort: webrtc-tcp
      protocol: TCP
    - name: webrtc-udp
      port: 8555
      targetPort: webrtc-udp
      protocol: UDP
    - name: go2rtc-api
      port: 1984
      targetPort: go2rtc-api
    - name: web-ui
      port: 55123
      targetPort: web-ui
